const heatedRoom=rm=>!['balcone','scala','garage','ripostiglio'].includes(usoOf(rm));
function termGen(){ if(S.impGenPos.termo) return {gRoom:S.rooms.find(r=>r.lab===labRoomOf(S.impGenPos.termo))||null, gpos:S.impGenPos.termo};
  const gRoom=S.rooms.find(rm=>['cucina','bagno','lavanderia','ripostiglio'].includes(usoOf(rm)))||S.rooms[0];
  const gpos=gRoom?roomCtr(gRoom):{x:S.bbox.x0+0.5,y:S.bbox.y0+0.5};
  return {gRoom,gpos}; }
function genTermo(){ if(S.termMode==='radiante') genTermoRadiante(); else genTermoRadiatori(); }
/* fabbisogno di massima del vano, per dimensionare radiatori e circuiti (W) */
const roomLoad=rm=>Math.round(rm.area*(S.termMode==='radiante'?70:85));
/* collettore di distribuzione, agganciato al muro accanto al generatore */
function termCollettore(gpos,gRoom){
  const c=gRoom?roomCtr(gRoom):gpos;
  const w=wallSnap({x:gpos.x+(c.x-gpos.x)*0.25+0.55,y:gpos.y+(c.y-gpos.y)*0.25},c,0.03);
  return addDev('termo','collterm',w.x,w.y,gRoom?gRoom.lab:null,{ax:{x:w.ux,y:w.uy},n:{x:w.nx,y:w.ny},vie:0});
}
/* generatore → collettore: il circuito primario, sempre in coppia mandata + ritorno */
function primario(P,gen,coll){
  const gp=collPorts(coll,0.16), zG=1.0, zC=IMPK.collterm.z;
  P.run.push({id:uid(),sys:'termo',circ:'primario mandata',t:'primario',zs:zG,ze:zC,
    pts:manhattan({x:gen.x,y:gen.y},gp.m)});
  P.run.push({id:uid(),sys:'termo',circ:'primario ritorno',t:'primario',zs:zG,ze:zC,
    pts:offsetPath(manhattanAlt({x:gen.x,y:gen.y},gp.r),0.07)});
  return gp;
}
function genTermoRadiatori(){
  if(!S.rooms.length) return;
  ensureImp(); const P=S.impianti.termo; P.dev=[]; P.run=[]; P.gen=null; const EM=edgeMap();
  const {gRoom,gpos}=termGen(), gc=gRoom?roomCtr(gRoom):gpos;
  const gen=addWallDev('termo','caldaia',gpos,gc,gRoom?gRoom.lab:null,{},0.02); P.gen=gen;
  const coll=termCollettore(gpos,gRoom), gp=primario(P,gen,coll);
  const zC=IMPK.collterm.z, zR=IMPK.radiatore.z;
  const rads=[];
  for(const rm of S.rooms){ if(!heatedRoom(rm))continue;
    const c=roomCtr(rm), wins=roomWins(rm), W=roomLoad(rm), n=Math.max(1,wins.length);
    /* sotto le finestre, con il numero di elementi proporzionato al fabbisogno */
    if(wins.length) wins.forEach(f=>{ const a=infAxis(f);
      rads.push(addWallDev('termo','radiatore',f.mid,c,rm.lab,
        {W:Math.round(W/n), el:clmp(Math.round(W/n/130),4,24), lb:Math.min(a.len||0.9,1.6)},0.04)); });
    else { const p=farthest(EM.get(rm.lab)||[],1)[0]||{x:c.x,y:c.y-0.2};
      rads.push(addWallDev('termo','radiatore',p,c,rm.lab,{W,el:clmp(Math.round(W/130),4,24),lb:0.9},0.04)); }
  }
  coll.meta.vie=rads.length;
  const sogg=S.rooms.find(rm=>usoOf(rm)==='soggiorno')||S.rooms[0];
  if(sogg){ const c=roomCtr(sogg), doors=roomDoors(sogg);
    const p=doors.length?besideOpening(doors[0],c,0.30,sogg.lab):(farthest(EM.get(sogg.lab)||[],1)[0]||c);
    addWallDev('termo','crono',p,c,sogg.lab,{},0); }
  /* ogni radiatore ha mandata E ritorno: due tubi che tornano entrambi al collettore */
  rads.forEach(r=>{
    P.run.push({id:uid(),sys:'termo',circ:'mandata',room:r.room,zs:zC,ze:zR,pts:manhattan(gp.m,{x:r.x,y:r.y})});
    P.run.push({id:uid(),sys:'termo',circ:'ritorno',room:r.room,zs:zC,ze:zR,
      pts:offsetPath(manhattanAlt(gp.r,{x:r.x,y:r.y}),0.07)});
  });
}
function bboxOf(pts){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const p of pts){ if(p.x<x0)x0=p.x;if(p.x>x1)x1=p.x;if(p.y<y0)y0=p.y;if(p.y>y1)y1=p.y; } return {x0,y0,x1,y1}; }
/* righe utili della serpentina: per ogni quota y il tratto continuo interno al vano */
function coilRows(lab,box,step){
  const rows=[], ins=0.14, x0=box.x0+ins, x1=box.x1-ins, sub=Math.max(0.03,step/3);
  const inRoom=(x,y)=>labAt((x-S.gx0)/S.px, S.gh-(y-S.gy0)/S.px)===lab;
  for(let y=box.y0+ins; y<=box.y1-ins+1e-9; y+=step){
    let a=null,b=null;
    for(let x=x0;x<=x1;x+=sub){ if(inRoom(x,y)){ if(a===null)a=x; b=x; } }
    if(a!==null && (b-a)>Math.max(0.3,step)) rows.push({y,a,b});
  }
  return rows;
}
/* Serpentina a corrente contraria (chiocciola stesa): l'andata percorre le righe pari,
   il ritorno si infila nelle dispari e riporta il tubo al punto di partenza.
   Così ogni circuito parte dal collettore E ci torna — come un pavimento radiante vero. */
function counterCoil(rows){
  if(!rows||rows.length<2) return null;
  const seq=[]; for(let i=0;i<rows.length;i+=2) seq.push(i);
  const back=[]; for(let i=rows.length-1;i>=1;i--) if(i%2===1) back.push(i);
  const order=seq.concat(back);
  const pts=[]; let cur=null, turn=1;
  order.forEach((i,k)=>{
    const r=rows[i]; let e0={x:r.a,y:r.y}, e1={x:r.b,y:r.y};
    if(cur && Math.abs(cur.x-r.b)<Math.abs(cur.x-r.a)){ e0={x:r.b,y:r.y}; e1={x:r.a,y:r.y}; }
    pts.push(e0,e1); cur=e1;
    if(k===seq.length-1) turn=pts.length-1;   // qui l'andata si inverte e comincia il ritorno
  });
  return {pts, turn, len:pathLen(pts), rows:rows.length};
}
function genTermoRadiante(){
  if(!S.rooms.length) return;
  ensureImp(); const P=S.impianti.termo; P.dev=[]; P.run=[]; P.gen=null; const EM=edgeMap();
  const {gRoom,gpos}=termGen(), gc=gRoom?roomCtr(gRoom):gpos;
  const gen=addWallDev('termo','pdc',gpos,gc,gRoom?gRoom.lab:null,{},0.02); P.gen=gen;
  const coll=termCollettore(gpos,gRoom), gp=primario(P,gen,coll);
  const zC=IMPK.collterm.z, passo0=clmp((+S.termPasso||15)/100,0.08,0.40), maxL=clmp(+S.termMax||90,30,150);
  let vie=0;
  for(const rm of S.rooms){ if(!heatedRoom(rm))continue;
    const edge=EM.get(rm.lab)||[]; if(!edge.length)continue;
    const box=bboxOf(edge), c=roomCtr(rm), rows=coilRows(rm.lab,box,passo0);
    if(rows.length<2) continue;
    /* un vano grande non si copre allargando il passo: si divide in più circuiti,
       ciascuno con la sua coppia mandata/ritorno sul collettore (come in cantiere) */
    const stesa=rows.reduce((a,r)=>a+(r.b-r.a),0)+passo0*rows.length;
    const dist=2*(Math.abs(coll.x-c.x)+Math.abs(coll.y-c.y));
    const nC=clmp(Math.ceil((stesa+dist)/Math.max(20,maxL-dist)),1,6);
    const per=Math.max(2,Math.ceil(rows.length/nC));
    const bande=[]; for(let i=0;i<rows.length;i+=per) bande.push(rows.slice(i,i+per));
    if(bande.length>1 && bande[bande.length-1].length<2){ const t=bande.pop(); bande[bande.length-1]=bande[bande.length-1].concat(t); }
    let tot=0;
    bande.forEach((banda,bi)=>{
      const coil=counterCoil(banda); if(!coil) return;
      const and=coil.pts.slice(0,coil.turn+1), rit=coil.pts.slice(coil.turn);
      const A=coil.pts[0], B=coil.pts[coil.pts.length-1];
      P.run.push({id:uid(),sys:'termo',circ:'serpentina',room:rm.lab,cid:'R'+(vie+1),pts:and});
      if(rit.length>1) P.run.push({id:uid(),sys:'termo',circ:'serpentina ritorno',room:rm.lab,cid:'R'+(vie+1),pts:rit});
      /* i due capi del circuito rientrano al collettore: mandata e ritorno */
      P.run.push({id:uid(),sys:'termo',circ:'mandata',room:rm.lab,cid:'R'+(vie+1),t:'distrib',zs:zC,ze:0.06,
        pts:manhattan(gp.m,A)});
      P.run.push({id:uid(),sys:'termo',circ:'ritorno',room:rm.lab,cid:'R'+(vie+1),t:'distrib',zs:zC,ze:0.06,
        pts:offsetPath(manhattanAlt(gp.r,B),0.07)});
      vie++; tot+=coil.len;
    });
    const doors=roomDoors(rm);
    const cp=doors.length?besideOpening(doors[0],c,0.30,rm.lab):(farthest(edge,1)[0]||c);
    addWallDev('termo','crono',cp,c,rm.lab,
      {W:roomLoad(rm),passo:Math.round(passo0*100),circuiti:bande.length,lung:Math.round(tot)},0);
  }
  coll.meta.vie=vie;
}

function genScarichi(){
  if(!S.rooms.length) return;
  ensureImp(); const P=S.impianti.scarichi; P.dev=[]; P.run=[]; P.gen=null; const EM=edgeMap();
  // importa i punti di scarico disegnati nel DXF

    const pts=sc.map(p=>addDev('scarichi','scarico_pt',p.x,p.y,labRoomOf(p),{}));
    const b0=S.bbox, pz0=S.impGenPos.scarichi||{x:b0.x0-0.5,y:b0.y0-0.5};
    const pz=addDev('scarichi','pozzetto',pz0.x,pz0.y,null,{}); P.gen=pz;
    /* una colonna per vano servito, poi il collettore verso il pozzetto: i punti importati
       non restano appesi, sono raccolti come in uno schema di scarico vero */
    const perRoom=new Map();
    pts.forEach(d=>{ if(d.room==null)return; const a=perRoom.get(d.room)||[]; a.push(d); perRoom.set(d.room,a); });
    const cols=[];
    perRoom.forEach((ds,lab)=>{ const rm=S.rooms.find(r=>r.lab===lab); if(!rm)return;
      const c=roomCtr(rm), p=farthest(EM.get(lab)||[],1)[0]||{x:ds[0].x,y:ds[0].y};
      const col=addWallDev('scarichi','colonna',p,c,lab,{},0.06); cols.push(col);
      ds.forEach(d=>P.run.push({id:uid(),sys:'scarichi',circ:'scarico',room:lab,zs:0.20,ze:0.06,
        pts:manhattan({x:d.x,y:d.y},{x:col.x,y:col.y})})); });
    /* punti fuori dai vani riconosciuti: vanno direttamente al pozzetto */
    pts.filter(d=>d.room==null).forEach(d=>P.run.push({id:uid(),sys:'scarichi',circ:'scarico',
      pts:manhattan({x:d.x,y:d.y},{x:pz.x,y:pz.y})}));
    cols.forEach(col=>P.run.push({id:uid(),sys:'scarichi',circ:'collettore',
      pts:manhattan({x:col.x,y:col.y},{x:pz.x,y:pz.y})}));
    if(S.m3d.roof)[[b0.x0,b0.y0],[b0.x1,b0.y0],[b0.x0,b0.y1],[b0.x1,b0.y1]].forEach(pt=>addDev('scarichi','pluviale',pt[0],pt[1],null,{}));
    return;
  }
  const wet=rm=>['bagno','cucina','lavanderia'].includes(usoOf(rm));
  const cols=[];
  for(const rm of S.rooms){ if(!wet(rm))continue; const c=roomCtr(rm);
    const p=farthest(EM.get(rm.lab)||[],1)[0]||c; cols.push(addWallDev('scarichi','colonna',p,c,rm.lab,{},0.06)); }
  const idr=(S.impianti.idrico&&S.impianti.idrico.dev)||[];
  idr.filter(d=>['wc','lavabo','bidet','doccia','vasca','lavello','lavatrice'].includes(d.kind)).forEach(d=>{
    let best=null,bd=1e9; cols.forEach(col=>{const dd=Math.hypot(col.x-d.x,col.y-d.y); if(dd<bd){bd=dd;best=col;}});
    if(best) P.run.push({id:uid(),sys:'scarichi',circ:'scarico',room:d.room,zs:d.kind==='wc'?0.10:0.30,ze:0.06,
      pts:manhattan({x:d.x,y:d.y},{x:best.x,y:best.y})}); });
  const b=S.bbox, pzp=S.impGenPos.scarichi||{x:b.x0-0.5,y:b.y0-0.5}, pz=addDev('scarichi','pozzetto',pzp.x,pzp.y,null,{}); P.gen=pz;
  cols.forEach(col=>P.run.push({id:uid(),sys:'scarichi',circ:'collettore',pts:manhattan({x:col.x,y:col.y},{x:pz.x,y:pz.y})}));
  if(S.m3d.roof) [[b.x0,b.y0],[b.x1,b.y0],[b.x0,b.y1],[b.x1,b.y1]].forEach(pt=>addDev('scarichi','pluviale',pt[0],pt[1],null,{}));
}

/* --- overlay 2D --- */
/* spessore e tratteggio del tratto secondo il ruolo: dorsali piene, calate sottili tratteggiate */
function runStyle(r,active){
  const c=r.circ, t=r.t;
  let w=1.8, dash=null;
  if(t==='drop'){ w=1.0; dash=[3,3]; }
  else if(t==='dorsale'){ w=2.0; }
  else if(t==='primario'){ w=2.8; }
  else if(c==='scarico'||c==='collettore'){ w=2.6; dash=[8,4]; }
  else if(c==='serpentina'||c==='serpentina ritorno'){ w=1.5; }
  else if(c==='mandata'||c==='ritorno'||c==='acqua calda'||c==='acqua fredda'){ w=1.9; }
  return {w:(active?w:w*0.7)*DPR, dash:dash?dash.map(v=>v*DPR):null};
}
function drawImpianti(){
  if(!S.impianti) return;
  for(const sys of SYS_ORD){
    const P=S.impianti[sys]; if(!P) continue;
    const active=sys===S.impSys;
    ctx.save(); ctx.globalAlpha=active?1:0.18;
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(const r of P.run){ if(r.pts.length<2)continue;
      const st=runStyle(r,active);
      ctx.strokeStyle=circColor(sys,r.circ); ctx.lineWidth=st.w; ctx.setLineDash(st.dash||[]);
      ctx.beginPath();
      r.pts.forEach((p,i)=>{const q=W2S(p); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);}); ctx.stroke(); }
    ctx.setLineDash([]); ctx.lineCap='butt'; ctx.lineJoin='miter';
    for(const d of P.dev){ const q=W2S({x:d.x,y:d.y}); drawSym(d,q.x,q.y,active); }
    ctx.restore();
  }
  const gp=S.impGenPos[S.impSys];
  if(gp){ const q=W2S(gp); ctx.save();
    ctx.beginPath(); ctx.arc(q.x,q.y,12*DPR,0,2*Math.PI); ctx.fillStyle='#12161Aee'; ctx.fill();
    ctx.strokeStyle=SYS[S.impSys].c; ctx.lineWidth=2.2*DPR; ctx.stroke();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5*DPR; ctx.beginPath();
    ctx.moveTo(q.x-6*DPR,q.y);ctx.lineTo(q.x+6*DPR,q.y);ctx.moveTo(q.x,q.y-6*DPR);ctx.lineTo(q.x,q.y+6*DPR); ctx.stroke();
    ctx.restore(); }
  if(S.impRunStart){ const q=W2S(S.impRunStart); ctx.save(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.5*DPR;
    ctx.beginPath(); ctx.moveTo(q.x-6*DPR,q.y);ctx.lineTo(q.x+6*DPR,q.y);ctx.moveTo(q.x,q.y-6*DPR);ctx.lineTo(q.x,q.y+6*DPR);
    ctx.stroke(); ctx.restore(); }
}
/* --- simboli 2D: disegno schematico orientato sul muro.
   Frame locale del simbolo: +x = lungo il muro, -y = verso l'interno del vano. --- */
const BG='#0C0F12';
function pgS(pts,fill){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  if(fill!==false){ ctx.closePath(); ctx.fill(); } ctx.stroke(); }
function rcS(x,y,w,h,fill){ ctx.beginPath(); ctx.rect(x,y,w,h); if(fill!==false)ctx.fill(); ctx.stroke(); }
function ciS(x,y,r,fill){ ctx.beginPath(); ctx.arc(x,y,r,0,2*Math.PI); if(fill!==false)ctx.fill(); ctx.stroke(); }
function elS(x,y,rx,ry,fill){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,2*Math.PI); if(fill!==false)ctx.fill(); ctx.stroke(); }
function lnS(x0,y0,x1,y1){ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); }
/* corpo in scala reale: larghezza lungo muro × profondità verso il vano, con minimo leggibile */
function bodyS(u,R,wm,dm,fill){
  const w=Math.max(R*2.2,wm*u), h=Math.max(R*1.2,dm*u);
  rcS(-w/2,-h,w,h,fill); return {w,h};
}
/* pettine del collettore: barra con n stacchi */
function combS(u,R,wm,n,c1,c2){
  const w=Math.max(R*2.6,wm*u), t=Math.max(1.6*DPR,0.035*u), vie=clmp(n||4,2,14);
  ctx.fillStyle=BG; rcS(-w/2,-t*2.6,w,t*2.6);
  ctx.strokeStyle=c1; ctx.fillStyle=c1; rcS(-w/2,-t*2.6,w,t);
  if(c2){ ctx.strokeStyle=c2; ctx.fillStyle=c2; rcS(-w/2,-t*1.2,w,t); }
  ctx.strokeStyle=c2||c1;
  for(let i=0;i<vie;i++){ const x=-w/2+w*(i+0.5)/vie; lnS(x,-t*0.2,x,t*1.4); }
}
const SYM2D={
  /* --- elettrico: simboli in stile CEI --- */
  presa:(d,u,R)=>{ ctx.beginPath(); ctx.arc(0,0,R,Math.PI,2*Math.PI); ctx.closePath(); ctx.fill(); ctx.stroke();
    lnS(-R*0.42,-R*0.42,-R*0.42,-R*0.95); lnS(R*0.42,-R*0.42,R*0.42,-R*0.95); lnS(-R,0,R,0); },
  fm:(d,u,R)=>{ ctx.beginPath(); ctx.arc(0,0,R*1.1,Math.PI,2*Math.PI); ctx.closePath(); ctx.fill(); ctx.stroke();
    lnS(-R*0.55,-R*0.4,-R*0.55,-R*1.0); lnS(0,-R*0.5,0,-R*1.05); lnS(R*0.55,-R*0.4,R*0.55,-R*1.0); lnS(-R*1.1,0,R*1.1,0); },
  int:(d,u,R)=>{ const n=clmp((d.meta&&d.meta.gang)||1,1,3);
    ciS(0,0,R*0.5); lnS(0,-R*0.45,R*0.95,-R*1.25);
    for(let i=1;i<n;i++) lnS(R*0.35*i,-R*0.75,R*0.95+R*0.3*i,-R*1.25); },
  luce:(d,u,R)=>{ ciS(0,0,R*0.8); const s=R*0.57; lnS(-s,-s,s,s); lnS(-s,s,s,-s); },
  faretto:(d,u,R)=>{ ciS(0,0,R*0.55); ciS(0,0,R*0.25,true); },
  derivaz:(d,u,R)=>{ rcS(-R*0.85,-R*0.85,R*1.7,R*1.7); lnS(-R*0.85,R*0.85,R*0.85,-R*0.85);
    [[-R*0.85,0],[R*0.85,0],[0,-R*0.85],[0,R*0.85]].forEach(p=>lnS(p[0],p[1],p[0]*1.45,p[1]*1.45)); },
  quadro:(d,u,R)=>{ const b=bodyS(u,R,0.42,0.10); const n=clmp((d.meta&&d.meta.circuiti)||4,2,8);
    for(let i=0;i<n;i++){ const x=-b.w/2+b.w*(i+0.5)/n; lnS(x,-b.h*0.75,x,-b.h*0.25); } },

function drawSym(d,sx,sy,active){
  const k=IMPK[d.kind]||{t:'?'}, col=SYS[d.sys].c, a=devAx(d);
  const u=S.view.sc, R=(active?8:6.5)*DPR;
  ctx.save();
  ctx.translate(sx,sy); ctx.rotate(Math.atan2(-a.y,a.x));
  ctx.lineWidth=(active?1.6:1.1)*DPR; ctx.strokeStyle=col; ctx.fillStyle=BG;
  const f=SYM2D[d.kind];
  if(f) f(d,u,R,col,active);
  else { ciS(0,0,R); ctx.fillStyle=col; ctx.font=`${7*DPR}px 'IBM Plex Mono',monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(k.t,0,0); }
  ctx.restore();
  /* sigla accanto al simbolo, solo per il sistema attivo e a zoom leggibile */
  if(active && u>26){ ctx.save(); ctx.fillStyle=col; ctx.globalAlpha=0.85;
    ctx.font=`${6.5*DPR}px 'IBM Plex Mono',monospace`; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(k.t,sx,sy+9*DPR); ctx.restore(); }
  if(d===S.impDrag){ ctx.save(); ctx.beginPath(); ctx.arc(sx,sy,14*DPR,0,2*Math.PI);
    ctx.strokeStyle='#fff'; ctx.lineWidth=DPR; ctx.stroke(); ctx.restore(); }
}

/* --- editing in pianta --- */
function impHit(w,tol){ const P=S.impianti&&S.impianti[S.impSys]; if(!P) return null;
  let best=null,bd=tol;
  for(const d of P.dev){ const dd=Math.hypot(d.x-w.x,d.y-w.y); if(dd<bd){bd=dd;best={type:'dev',obj:d};} }
  if(best) return best;
  bd=tol; for(const r of P.run){ for(let i=1;i<r.pts.length;i++){ const dd=distSeg(w,r.pts[i-1],r.pts[i]); if(dd<bd){bd=dd;best={type:'run',obj:r};} } }
  return best; }
function impDown(w){
  const sys=S.impSys; ensureImp(); const P=S.impianti[sys];
  const tol=Math.max(0.12,14*DPR/S.view.sc);
  if(S.impTool==='placegen'){ S.impGenPos[S.impPlaceSys||sys]={x:w.x,y:w.y}; S.impTool='sel'; S.impPlaceSys=null; render(); return true; }
  if(S.impTool==='add'){ const rm=S.rooms.find(x=>x.lab===labOfWorld(w));
    addDev(sys,S.impKind,w.x,w.y,rm?rm.lab:null,{}); render(); return true; }
  if(S.impTool==='del'){ const h=impHit(w,tol); if(h){ if(h.type==='dev')P.dev=P.dev.filter(d=>d!==h.obj); else P.run=P.run.filter(r=>r!==h.obj); render(); } return true; }
  if(S.impTool==='run'){ if(!S.impRunStart){ S.impRunStart=w; draw(); }
    else { P.run.push({id:uid(),sys,circ:'man',pts:manhattan(S.impRunStart,w)}); S.impRunStart=null; render(); } return true; }
  const h=impHit(w,tol); if(h&&h.type==='dev'){ S.impDrag=h.obj; return true; }
  return false;
}
function impMove(w){ if(S.impDrag){ S.impDrag.x=w.x; S.impDrag.y=w.y; draw(); } }

  const key=color+'|'+(o?JSON.stringify(o):'');
  if(MEPMAT[key]) return MEPMAT[key];
  const p=Object.assign({roughness:0.55,metalness:0.05},o||{});
  p.color=new THREE.Color(color); if(p.emissive) p.emissive=new THREE.Color(p.emissive);

}

/* modello completo di un apparecchio, posizionato e orientato sul muro che lo ospita */
function devModel(d,L){
  const g=new THREE.Group(), k=IMPK[d.kind]||{z:0.3}, H=Math.max(2.0,L.h||2.7);
  const f=MEP3D[d.kind];
  if(f) f(g,d,{H,col:SYS[d.sys].c});
  else { const c=SYS[d.sys].c; mepB(g,0.12,0.12,0.06,mepM(c,{emissive:c,emissiveIntensity:0.3}),0,0,0.03); }
  g.position.set(d.x, k.z==='soff'? L.quota+H-0.02 : L.quota+(+k.z||0), -d.y);
  const n=d.meta&&d.meta.n;
  if(n) g.rotation.y=Math.atan2(n.x,-n.y);
  return g;
}
/* fallback leggero: un segnaposto colorato, per piante molto grandi o modalità schema */
function devMark(d,L){
  const c=SYS[d.sys].c, k=IMPK[d.kind]||{z:0.3}, H=Math.max(2.0,L.h||2.7);
  const sz=(d.kind==='quadro'||d.kind==='collterm')?0.22:0.14;
  const m=new THREE.Mesh(new THREE.BoxGeometry(sz,sz,sz),mepM(c,{emissive:c,emissiveIntensity:0.4}));
  m.position.set(d.x, k.z==='soff'? L.quota+H-0.1 : L.quota+(+k.z||0.2)+sz/2, -d.y);
  return m;
}
/* percorso 3D di un tratto: risalita dal punto di partenza, corsa alla quota di posa, calata all'arrivo */
function runPts3(r,Lq,zRun){
  const v=[], p0=r.pts[0], pn=r.pts[r.pts.length-1];
  if(r.zs!=null && Math.abs(Lq+r.zs-zRun)>0.03) v.push(new THREE.Vector3(p0.x,Lq+r.zs,-p0.y));
  r.pts.forEach(p=>v.push(new THREE.Vector3(p.x,zRun,-p.y)));
  if(r.ze!=null && Math.abs(Lq+r.ze-zRun)>0.03) v.push(new THREE.Vector3(pn.x,Lq+r.ze,-pn.y));
  return v;
}
/* tubazione vera: solido estruso lungo la polilinea, non una semplice linea */
function runTube(v,rad,color,lg){
  const path=new THREE.CurvePath();
  for(let i=1;i<v.length;i++){ if(v[i].distanceTo(v[i-1])>1e-4) path.add(new THREE.LineCurve3(v[i-1],v[i])); }
  if(!path.curves.length) return;
  const L=path.getLength(), seg=clmp(Math.round(L/0.10),8,700);
  lg.add(new THREE.Mesh(new THREE.TubeGeometry(path,seg,rad,7,false),
    mepM(color,{roughness:0.35,metalness:0.2})));
}
function buildImpianti3D(levels){
  if(!S.impianti||!MOD3D.model) return;
  let mode=S.m3d.mep||'model'; if(mode==='off') return;
  MEPMAT={};
  const clip=MOD3D.clip;
  /* su piante molto popolate si passa allo schema per non appesantire la scena */
  let nDev=0; SYS_ORD.forEach(s=>{ const P=S.impianti[s]; if(P) nDev+=P.dev.length; });
  if(nDev>500) mode='schema';
  const levOf=lab=>{ const rm=S.rooms.find(r=>r.lab===lab); const L=rm?livOf(rm):null; return L||levels[0]; };
  const L0=levels[0]||{quota:0,h:3};
  for(const sys of SYS_ORD){ const P=S.impianti[sys]; if(!P)continue;
    for(const d of P.dev){ const L=levOf(d.room)||L0; if(!L)continue;
      const lg=lvPart(L.id,'mep');
      lg.add(mode==='model'? devModel(d,L) : devMark(d,L)); }
    for(const r of P.run){ if(!r.pts||r.pts.length<2)continue;
      const Lr=(r.room?levOf(r.room):L0)||L0, lgr=lvPart(Lr.id,'mep');
      const H=Math.max(0.4,Lr.h), col=circColor(sys,r.circ);
      /* elettrico sotto il solaio, tubazioni e scarichi a pavimento */
      const zRun=sys==='elettrico'? Lr.quota+H-0.12 : Lr.quota+(r.circ==='scarico'||r.circ==='collettore'?0.04:0.06);
      const v=runPts3(r,Lr.quota,zRun);
      if(mode==='model') runTube(v,RUN_R[r.circ]||0.010,col,lgr);
      else lgr.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(v),
        new THREE.LineBasicMaterial({color:new THREE.Color(col),clippingPlanes:[clip]})));
    }
  }
}

/* --- conteggi / export --- */
function impCounts(sys){ const P=S.impianti&&S.impianti[sys]; const c={}; let runLen=0;
  if(P){ P.dev.forEach(d=>c[d.kind]=(c[d.kind]||0)+1);
    P.run.forEach(r=>{ for(let i=1;i<r.pts.length;i++) runLen+=Math.hypot(r.pts[i].x-r.pts[i-1].x,r.pts[i].y-r.pts[i-1].y); }); }
  return {c,runLen}; }
/* nota tecnica del pezzo: elementi del radiatore, vie del collettore, passo del circuito… */
function devNote(d){
  const m=d.meta||{}, out=[];
  if(m.el) out.push(m.el+' elementi'); if(m.W) out.push(m.W+' W');
  if(m.vie) out.push(m.vie+' vie'); if(m.circuiti) out.push(m.circuiti+' circuiti');
  if(m.gang) out.push(m.gang+' comandi'); if(m.passo) out.push('passo '+m.passo+' cm');
  if(m.lung) out.push('circuito '+m.lung+' m');
  return out.join(' · ');
}
function expImpianti(){
  ensureImp(); const R=[['Sistema','Vano','Uso','Elemento','Sigla','Dati','X m','Y m']];
  for(const sys of SYS_ORD){ const P=S.impianti[sys];
    P.dev.forEach(d=>{ const rm=S.rooms.find(x=>x.lab===d.room), k=IMPK[d.kind]||{l:d.kind,t:''};
      R.push([SYS[sys].lbl, rm?rm.nome:'', rm?((USI[usoOf(rm)]||{}).lbl||''):'', k.l, k.t, devNote(d), nf(d.x,2), nf(d.y,2)]); }); }
  R.push([]); R.push(['Sistema','Circuito','Tratto','Sviluppo m']);
  for(const sys of SYS_ORD){ const P=S.impianti[sys], byc={};

      R.push([SYS[sys].lbl,p[0],p[1],nf(byc[kk],2)]); }); }
  dl('impianti-modulo.csv',csv(R));
}

/* ==================== TELAIO SPAZIALE — solutore agli elementi finiti ====================
   Elemento trave/pilastro di Eulero-Bernoulli a 12 gradi di libertà, rigidezza assemblata
   in coordinate globali (x,y in pianta, z quota). Serve per il calcolo sismico: senza un
   modello 3D vero non si distribuiscono le azioni orizzontali fra i telai. */
const FEM={};
/* --- algebra minima --- */
function mZeros(n,m){ const A=new Array(n); for(let i=0;i<n;i++) A[i]=new Float64Array(m); return A; }
function v3(a,b,c){ return {x:a,y:b,z:c}; }
function vSub(a,b){ return v3(a.x-b.x,a.y-b.y,a.z-b.z); }
function vCross(a,b){ return v3(a.y*b.z-a.z*b.y, a.z*b.x-a.x*b.z, a.x*b.y-a.y*b.x); }
function vLen(a){ return Math.hypot(a.x,a.y,a.z); }
function vNorm(a){ const l=vLen(a)||1; return v3(a.x/l,a.y/l,a.z/l); }
/* terna locale: ex lungo l'asta, ez nella direzione "forte" della sezione */
function localAxes(p0,p1,refDir){
  const ex=vNorm(vSub(p1,p0));
  let ref = refDir || (Math.abs(ex.z)>0.99? v3(1,0,0) : v3(0,0,1));
  if(Math.abs(ex.x*ref.x+ex.y*ref.y+ex.z*ref.z)>0.99) ref=v3(0,1,0);
  const ey=vNorm(vCross(ref,ex)), ez=vCross(ex,ey);
  return [ex,ey,ez];
}
/* matrice di rigidezza locale 12x12 */
function kLocal(E,G,A,Iy,Iz,J,L){
  const k=mZeros(12,12);
  const ea=E*A/L, gj=G*J/L;
  const z1=12*E*Iz/(L*L*L), z2=6*E*Iz/(L*L), z3=4*E*Iz/L, z4=2*E*Iz/L;
  const y1=12*E*Iy/(L*L*L), y2=6*E*Iy/(L*L), y3=4*E*Iy/L, y4=2*E*Iy/L;
  const put=(i,j,v)=>{ k[i][j]+=v; if(i!==j) k[j][i]+=v; };
  put(0,0,ea); put(6,6,ea); put(0,6,-ea);
  put(3,3,gj); put(9,9,gj); put(3,9,-gj);
  /* flessione nel piano locale x-y (inerzia Iz, taglio lungo y, rotazione attorno a z) */
  put(1,1,z1); put(7,7,z1); put(1,7,-z1);
  put(5,5,z3); put(11,11,z3); put(5,11,z4);
  put(1,5,z2); put(1,11,z2); put(7,5,-z2); put(7,11,-z2);
  /* flessione nel piano locale x-z (inerzia Iy, taglio lungo z, rotazione attorno a y) */
  put(2,2,y1); put(8,8,y1); put(2,8,-y1);
  put(4,4,y3); put(10,10,y3); put(4,10,y4);
  put(2,4,-y2); put(2,10,-y2); put(8,4,y2); put(8,10,y2);
  return k;
}
/* matrice di rotazione 12x12 a blocchi */
function rotMat(ax){
  const R=mZeros(12,12);
  const L3=[[ax[0].x,ax[0].y,ax[0].z],[ax[1].x,ax[1].y,ax[1].z],[ax[2].x,ax[2].y,ax[2].z]];
  for(let b=0;b<4;b++) for(let i=0;i<3;i++) for(let j=0;j<3;j++) R[b*3+i][b*3+j]=L3[i][j];
  return R;
}
/* K_glob = Rᵀ k R */
function kGlobal(k,R){
  const t=mZeros(12,12), out=mZeros(12,12);
  for(let i=0;i<12;i++) for(let j=0;j<12;j++){ let s=0;
    for(let m=0;m<12;m++) s+=R[m][i]*k[m][j]; t[i][j]=s; }
  for(let i=0;i<12;i++) for(let j=0;j<12;j++){ let s=0;
    for(let m=0;m<12;m++) s+=t[i][m]*R[m][j]; out[i][j]=s; }
  return out;
}
/* forze di incastro perfetto per carico uniforme w (kN/m) diretto lungo -z globale */
function fefUniform(w,L,ax){
  /* componenti del carico nella terna locale */
  const q=v3(0,0,-w);
  const qy=q.x*ax[1].x+q.y*ax[1].y+q.z*ax[1].z;
  const qz=q.x*ax[2].x+q.y*ax[2].y+q.z*ax[2].z;
  const qx=q.x*ax[0].x+q.y*ax[0].y+q.z*ax[0].z;
  const f=new Float64Array(12);
  f[0]=qx*L/2; f[6]=qx*L/2;
  f[1]=qy*L/2; f[7]=qy*L/2; f[5]=qy*L*L/12; f[11]=-qy*L*L/12;
  f[2]=qz*L/2; f[8]=qz*L/2; f[4]=-qz*L*L/12; f[10]=qz*L*L/12;
  return f;
}
/* risoluzione di un sistema simmetrico definito positivo (Cholesky con fallback a Gauss) */
function solveSPD(K,F){
  const n=F.length, A=mZeros(n,n);
  for(let i=0;i<n;i++) for(let j=0;j<n;j++) A[i][j]=K[i][j];
  const L=mZeros(n,n);
  for(let i=0;i<n;i++){
    for(let j=0;j<=i;j++){
      let s=A[i][j];
      for(let k=0;k<j;k++) s-=L[i][k]*L[j][k];
      if(i===j){ if(s<=1e-12) return solveGauss(K,F); L[i][i]=Math.sqrt(s); }
      else L[i][j]=s/L[j][j];
    }
  }
  const y=new Float64Array(n), x=new Float64Array(n);
  for(let i=0;i<n;i++){ let s=F[i]; for(let k=0;k<i;k++) s-=L[i][k]*y[k]; y[i]=s/L[i][i]; }
  for(let i=n-1;i>=0;i--){ let s=y[i]; for(let k=i+1;k<n;k++) s-=L[k][i]*x[k]; x[i]=s/L[i][i]; }
  return x;
}
function solveGauss(K,F){
  const n=F.length, M=mZeros(n,n+1);
  for(let i=0;i<n;i++){ for(let j=0;j<n;j++) M[i][j]=K[i][j]; M[i][n]=F[i]; }
  for(let c=0;c<n;c++){
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    if(Math.abs(M[p][c])<1e-10) return null;
    if(p!==c){ const t=M[c]; M[c]=M[p]; M[p]=t; }
    for(let r=0;r<n;r++){ if(r===c) continue; const f=M[r][c]/M[c][c]; if(!f) continue;
      for(let k=c;k<=n;k++) M[r][k]-=f*M[c][k]; }
  }
  const x=new Float64Array(n); for(let i=0;i<n;i++) x[i]=M[i][n]/M[i][i];
  return x;
}
/* --- modello --- */
function femModel(){
  return {nodes:[], elems:[], nodeAt(x,y,z){
    const k=Math.round(x*100)+'_'+Math.round(y*100)+'_'+Math.round(z*100);
    if(this._m===undefined) this._m={};
    if(this._m[k]!==undefined) return this._m[k];
    const id=this.nodes.length; this.nodes.push({id,x,y,z,fix:false,dia:null});
    this._m[k]=id; return id;
  }};
}
function femAdd(M,n0,n1,sec){
  const a=M.nodes[n0], b=M.nodes[n1];
  const L=Math.hypot(b.x-a.x,b.y-a.y,b.z-a.z);
  if(L<1e-6) return null;
  const e={n0,n1,L,sec,w:{}};
  M.elems.push(e); return e;
}
/* assembla e risolve per un insieme di casi di carico; restituisce spostamenti e
   sollecitazioni di estremità per ogni elemento e per ogni caso */
function femSolve(M,cases){
  const nn=M.nodes.length, nd=nn*6;
  /* --- vincoli di piano rigido: i nodi di un impalcato condividono ux, uy, rz --- */
  const map=new Array(nd).fill(-1);         // dof globale -> dof ridotto
  const dia={};                              // id impalcato -> {dofs:[Ux,Uy,Rz], x0,y0}
  let nr=0;
  M.nodes.forEach(n=>{ if(n.dia==null) return;
    if(!dia[n.dia]) dia[n.dia]={nodes:[],x0:0,y0:0,dofs:null};
    dia[n.dia].nodes.push(n); });
  Object.values(dia).forEach(d=>{
    d.x0=d.nodes.reduce((s,n)=>s+n.x,0)/d.nodes.length;
    d.y0=d.nodes.reduce((s,n)=>s+n.y,0)/d.nodes.length;
    d.dofs=[nr++,nr++,nr++];
  });
  M.nodes.forEach(n=>{
    for(let k=0;k<6;k++){
      const g=n.id*6+k;
      if(n.fix){ map[g]=-1; continue; }
      if(n.dia!=null && (k===0||k===1||k===5)){ map[g]=-2; continue; }  // gestito dal diaframma
      map[g]=nr++;
    }
  });
  /* matrice di trasformazione: dof globali = T · dof ridotti (solo righe non vincolate) */
  const T=[];   // per ogni dof globale: lista [dofRidotto, coeff]
  M.nodes.forEach(n=>{
    for(let k=0;k<6;k++){
      const g=n.id*6+k;
      if(n.fix){ T[g]=[]; continue; }
      if(n.dia!=null && (k===0||k===1||k===5)){
        const d=dia[n.dia], dx=n.x-d.x0, dy=n.y-d.y0;
        if(k===0) T[g]=[[d.dofs[0],1],[d.dofs[2],-dy]];      // ux = Ux - dy·Rz
        else if(k===1) T[g]=[[d.dofs[1],1],[d.dofs[2],dx]];  // uy = Uy + dx·Rz
        else T[g]=[[d.dofs[2],1]];                            // rz = Rz
      } else T[g]=[[map[g],1]];
    }
  });
  const K=mZeros(nr,nr);
  const Fc=cases.map(()=>new Float64Array(nr));
  /* assemblaggio */
  M.elems.forEach(e=>{
    const a=M.nodes[e.n0], b=M.nodes[e.n1], s=e.sec;
    const ax=localAxes(a,b,s.ref);
    const R=rotMat(ax);
    const kl=kLocal(s.E,s.G,s.A,s.Iy,s.Iz,s.J,e.L);
    const kg=kGlobal(kl,R);
    e._ax=ax; e._R=R; e._kl=kl;
    const gd=[]; for(let k=0;k<6;k++) gd.push(e.n0*6+k); for(let k=0;k<6;k++) gd.push(e.n1*6+k);
    for(let i=0;i<12;i++){ const Ti=T[gd[i]]||[]; if(!Ti.length) continue;
      for(let j=0;j<12;j++){ const Tj=T[gd[j]]||[]; if(!Tj.length) continue;
        const v=kg[i][j]; if(!v) continue;
        for(const[ri,ci]of Ti) for(const[rj,cj]of Tj) K[ri][rj]+=v*ci*cj;
      } }
    /* carichi distribuiti per caso */
    e._fef={};
    cases.forEach((cs,ci2)=>{
      const w=e.w[cs.name]||0; if(!w) return;
      const f=fefUniform(w,e.L,ax);
      e._fef[cs.name]=f;
      /* f è il vettore dei carichi nodali equivalenti (consistent load): va sommato */
      for(let i=0;i<12;i++){
        let fg=0; for(let m=0;m<12;m++) fg+=R[m][i]*f[m];
        const Ti=T[gd[i]]||[];
        for(const[ri,ciX]of Ti) Fc[ci2][ri]+=fg*ciX;
      }
    });
  });
  /* carichi nodali */
  cases.forEach((cs,ci2)=>{
    (cs.nodal||[]).forEach(nl=>{
      const g=nl.node*6+nl.dof, Ti=T[g]||[];
      for(const[ri,ciX]of Ti) Fc[ci2][ri]+=nl.f*ciX;
    });
  });
  /* soluzione */
  const res=[];
  for(let c=0;c<cases.length;c++){
    const x=solveSPD(K,Fc[c]);
    if(!x) return null;
    const u=new Float64Array(nd);
    M.nodes.forEach(n=>{ for(let k=0;k<6;k++){ const g=n.id*6+k; let s=0;
      for(const[ri,ciX]of (T[g]||[])) s+=x[ri]*ciX; u[g]=s; } });
    /* sollecitazioni di estremità in coordinate locali */
    const forces=M.elems.map(e=>{
      const gd=[]; for(let k=0;k<6;k++) gd.push(e.n0*6+k); for(let k=0;k<6;k++) gd.push(e.n1*6+k);
      const ul=new Float64Array(12);
      for(let i=0;i<12;i++){ let s=0; for(let m=0;m<12;m++) s+=e._R[i][m]*u[gd[m]]; ul[i]=s; }
      const f=new Float64Array(12);
      for(let i=0;i<12;i++){ let s=0; for(let m=0;m<12;m++) s+=e._kl[i][m]*ul[m]; f[i]=s; }
      /* sollecitazioni di estremità = k·u − carichi nodali equivalenti */
      const fe=e._fef[cases[c].name];
      if(fe) for(let i=0;i<12;i++) f[i]-=fe[i];
      return f;
    });
    res.push({u,forces,dia,map:T});
  }
  return {res,dia,nr};
}

/* ==================== AZIONE SISMICA — NTC 2018 ==================== */
/* Zone sismiche: valori orientativi di partenza, da sostituire con quelli del sito
   (ag, F0, Tc* si leggono dalla pericolosità sismica di riferimento per le coordinate). */
const ZONE_SISM={
  '1':{agSLV:0.28,agSLD:0.10,F0:2.45,Tc:0.32,l:'Zona 1 — alta sismicità'},
  '2':{agSLV:0.20,agSLD:0.075,F0:2.42,Tc:0.30,l:'Zona 2'},
  '3':{agSLV:0.12,agSLD:0.048,F0:2.50,Tc:0.28,l:'Zona 3'},
  '4':{agSLV:0.05,agSLD:0.022,F0:2.60,Tc:0.26,l:'Zona 4 — bassa sismicità'}};
const SUOLO={A:'A — rocce',B:'B — terreni molto addensati',C:'C — terreni mediamente addensati',
  D:'D — terreni sciolti',E:'E — coltri alluvionali'};
const TOPO={T1:'T1 — pianeggiante',T2:'T2 — pendio > 15°',T3:'T3 — cresta larga',T4:'T4 — cresta stretta'};
const ST_TOPO={T1:1.0,T2:1.2,T3:1.2,T4:1.4};
/* Tab. 3.2.V — amplificazione stratigrafica */
function ssOf(cat,ag,F0){
  const x=F0*ag;                                    // ag in g
  if(cat==='A') return 1.00;
  if(cat==='B') return clmp(1.40-0.40*x,1.00,1.20);
  if(cat==='C') return clmp(1.70-0.60*x,1.00,1.50);
  if(cat==='D') return clmp(2.40-1.50*x,0.90,1.80);
  return clmp(2.00-1.10*x,1.00,1.60);               // E
}
function ccOf(cat,Tc){
  if(cat==='A') return 1.00;
  if(cat==='B') return 1.10*Math.pow(Tc,-0.20);
  if(cat==='C') return 1.05*Math.pow(Tc,-0.33);
  if(cat==='D') return 1.25*Math.pow(Tc,-0.50);
  return 1.15*Math.pow(Tc,-0.40);
}
/* parametri dello spettro per uno stato limite */
function spettroPar(ag,F0,TcStar,cat,topo){
  const Ss=ssOf(cat,ag,F0), St=ST_TOPO[topo]||1.0, S=Ss*St;
  const Cc=ccOf(cat,TcStar), TC=Cc*TcStar, TB=TC/3, TD=4.0*ag+1.6;
  return {ag,F0,S,Ss,St,Cc,TB,TC,TD};
}
/* ordinata dello spettro di progetto (§3.2.3.5); q=1 dà lo spettro elastico */
function spettro(P,T,q){
  const eta=1/Math.max(1,q||1), ag=P.ag, S=P.S, F0=P.F0;
  let Se;
  if(T<P.TB) Se=ag*S*eta*F0*(T/P.TB+(1/(eta*F0))*(1-T/P.TB));
  else if(T<P.TC) Se=ag*S*eta*F0;
  else if(T<P.TD) Se=ag*S*eta*F0*(P.TC/T);
  else Se=ag*S*eta*F0*(P.TC*P.TD/(T*T));
  return Math.max(Se, (q&&q>1)? 0.20*ag*S : 0);      // limite inferiore per lo spettro di progetto
}
/* fattore di comportamento — §7.3.1 e Tab. 7.3.II, telai in c.a. */
function qFattore(cfg,nPiani,nCampate){
  if(cfg.duttilita==='nd') return {q:1.5,q0:1.5,au:1,Kr:1};
  const au = nPiani<=1 ? 1.1 : (nCampate<=1 ? 1.2 : 1.3);
  const q0 = cfg.duttilita==='A' ? 4.5*au : 3.0*au;
  const Kr = cfg.regolare===false ? 0.8 : 1.0;
  return {q:q0*Kr, q0, au, Kr};
}

/* ==================== MODELLO A TELAIO DALLA CARPENTERIA ==================== */
function sezRett(b,h,ref){
  const E=EcmOf()*1000, nu=0.2, G=E/(2*(1+nu));      // kN/m2
  const a=Math.max(b,h), t=Math.min(b,h);
  const J=a*t*t*t*(1/3-0.21*(t/a)*(1-Math.pow(t/a,4)/12));   // torsione sezione rettangolare
  /* fessurazione: NTC §7.2.6 consente di dimezzare la rigidezza flessionale */
  const f=S.strCfg.fessurato===false?1:0.5;
  return {E,G,A:b*h,Iy:f*b*h*h*h/12,Iz:f*h*b*b*b/12,J:f*J,b,h,ref};
}
function buildFrame(){
  const ST=S.strutt; if(!ST||!ST.pil.length) return null;
  const levels=strLevels(), M=femModel();
  const zBase=levels[0].quota;
  /* nodi: base + sommità di ogni livello, in corrispondenza di ogni pilastro */
  ST.pil.forEach(p=>{
    const L=levels.find(l=>l.id===p.liv); if(!L) return;
    const n0=M.nodeAt(p.x,p.y,L.quota), n1=M.nodeAt(p.x,p.y,L.quota+Math.max(0.4,L.h));
    if(L.quota<=zBase+1e-6) M.nodes[n0].fix=true;
    const ang=p.ang||0;
    /* h è la dimensione trasversale al muro, quella che in pianta si vede in verticale:
       la terna locale deve avere ez in quella direzione perché Iy = b·h³/12 la usi */
    const e=femAdd(M,n0,n1,sezRett(p.b,p.h,v3(-Math.sin(ang),Math.cos(ang),0)));
    if(e){ e.kind='pil'; e.ref=p; e.liv=L.id; }
  });
  /* travi alla quota di sommità del proprio livello, nodi di impalcato solidali */
  levels.forEach(L=>{
    const zt=L.quota+Math.max(0.4,L.h);
    ST.trave.filter(t=>t.liv===L.id).forEach(t=>{
      const n0=M.nodeAt(t.a.x,t.a.y,zt), n1=M.nodeAt(t.b.x,t.b.y,zt);
      const e=femAdd(M,n0,n1,sezRett(t.b_,t.h,v3(0,0,1)));
      if(e){ e.kind='trave'; e.ref=t; e.liv=L.id; }
    });
  });
  /* impalcato rigido: tutti i nodi alla quota di sommità di un livello */
  levels.forEach((L,i)=>{
    const zt=L.quota+Math.max(0.4,L.h);
    M.nodes.forEach(n=>{ if(Math.abs(n.z-zt)<1e-6 && !n.fix) n.dia=L.id; });
  });
  M.levels=levels;
  return M;
}
/* pesi sismici nodali: W = G1 + G2 + ψ2·Qk, ripartiti dai carichi delle travi */
function pesiSismici(M){
  const ST=S.strutt, levels=M.levels, psi2=0.30;
  const wN={};                                       // idNodo -> peso (kN)
  const add=(n,w)=>{ wN[n]=(wN[n]||0)+w; };
  M.elems.forEach(e=>{
    if(e.kind!=='trave') return;
    const t=e.ref;
    const q=(t.qSis!=null)?t.qSis:((t.qPp||0)+(t.qMuro||0)+(t.qSolK||0));   // G1+G2+ψ2·Qk
    add(e.n0,q*e.L/2); add(e.n1,q*e.L/2);
  });
  M.elems.forEach(e=>{
    if(e.kind!=='pil') return;
    const p=e.ref, w=GAMMA_CA*p.b*p.h*e.L;
    add(e.n0,w/2); add(e.n1,w/2);
  });
  /* pesi di piano e centro delle masse */
  const piani=[];
  levels.forEach(L=>{
    const zt=L.quota+Math.max(0.4,L.h);
    const nodi=M.nodes.filter(n=>n.dia===L.id);
    let W=0,cx=0,cy=0;
    nodi.forEach(n=>{ const w=wN[n.id]||0; W+=w; cx+=w*n.x; cy+=w*n.y; });
    if(W>0){ cx/=W; cy/=W; }
    piani.push({liv:L.id,z:zt,h:Math.max(0.4,L.h),W,cx,cy,nodi,wN});
  });
  return {wN,piani};
}
/* analisi statica lineare — §7.3.3.2 */
function forzeSismiche(M,PS,Sd,lambda){
  const den=PS.piani.reduce((s,p)=>s+p.z*p.W,0)||1;
  const Wtot=PS.piani.reduce((s,p)=>s+p.W,0);
  const Fh=Sd*Wtot*lambda;                            // Sd in g -> kN
  return PS.piani.map(p=>({piano:p, F:Fh*p.z*p.W/den}));
}
/* periodo con il quoziente di Rayleigh, dal modello reale */
function periodoRayleigh(M,PS,dir){
  const g=9.81;
  const nodal=[];
  PS.piani.forEach(p=>{ p.nodi.forEach(n=>{
    const w=p.wN[n.id]||0; if(w>0) nodal.push({node:n.id,dof:dir==='x'?0:1,f:w*p.z}); }); });
  if(!nodal.length) return null;
  const out=femSolve(M,[{name:'ray',nodal}]);
  if(!out) return null;
  const u=out.res[0].u;
  let num=0,den=0;
  PS.piani.forEach(p=>{ p.nodi.forEach(n=>{
    const w=p.wN[n.id]||0; if(!w) return;
    const d=u[n.id*6+(dir==='x'?0:1)], F=w*p.z;
    num+=w*d*d; den+=F*d; }); });
  if(den<=0) return null;
  return 2*Math.PI*Math.sqrt(num/(g*den));
}

/* ==================== DOMINIO M-N DELLA SEZIONE RETTANGOLARE ==================== */
/* Sezione b x h, armatura As1 sul lembo compresso (copriferro c) e As2 su quello teso.
   Calcestruzzo: stress block 0,8x con fcd. Acciaio: elastico-perfettamente plastico.
   Convenzione: N positivo di compressione, M positivo con compressione sul lembo superiore. */
function mnSezione(b,h,As1,As2,x){
  const fcd=fcdOf()*1000, fyd=fydOf()*1000, Es=210e6, ecu=0.0035, c=0.04;
  const d=Math.max(c+0.01,h-c), dp=c;
  const yc=h/2;                                       // baricentro geometrico
  let N=0,Mm=0;
  /* calcestruzzo compresso */
  const a=Math.min(0.8*Math.max(0,x),h);
  if(a>0){ const Nc=fcd*b*a, zc=a/2;
    N+=Nc; Mm+=Nc*(yc-zc); }
  /* acciaio: deformazioni da conservazione delle sezioni piane */
  const eps=(y)=> x>1e-9 ? ecu*(x-y)/x : -0.010;
  const sig=e=>clmp(e*Es,-fyd,fyd);
  const s1=sig(eps(dp)), s2=sig(eps(d));
  N+=As1*s1+As2*s2;
  Mm+=As1*s1*(yc-dp)+As2*s2*(yc-d);
  return {N,M:Mm};
}
/* momento resistente per un dato sforzo normale (bisezione sull'asse neutro) */
function mrdOf(b,h,As1,As2,Ned){
  let lo=1e-5, hi=4*h;
  for(let i=0;i<45;i++){
    const x=(lo+hi)/2, r=mnSezione(b,h,As1,As2,x);
    if(r.N<Ned) lo=x; else hi=x;
  }
  const x=(lo+hi)/2, r=mnSezione(b,h,As1,As2,x);
  return {MRd:Math.abs(r.M), M:r.M, x, N:r.N};
}
/* massimo sforzo normale resistente (compressione semplice) */
function nrdMax(b,h,As){ return fcdOf()*1000*b*h+2*As*fydOf()*1000; }
/* verifica a pressoflessione deviata — EC2 §5.8.9 / NTC §4.1.2.3.4.2.
   As = armatura su ciascuna delle due facce (m²). */
function pressoDeviata(b,h,As,N,My,Mz){
  const r1=mrdOf(b,h,As,As,N), MRdy=r1.MRd;
  const r2=mrdOf(h,b,As,As,N), MRdz=r2.MRd;
  const nu=Math.max(0,Math.min(1,N/Math.max(1,nrdMax(b,h,As))));
  const aE=nu<=0.1?1.0:(nu<=0.7?1.0+(nu-0.1)/0.6:2.0);
  const r=(MRdy>0?Math.pow(Math.abs(My)/MRdy,aE):9)+(MRdz>0?Math.pow(Math.abs(Mz)/MRdz,aE):9);
  return {ok:r<=1.0, r, MRdy, MRdz, a:aE, nu};
}

/* ==================== STRUTTURE — carpenteria e calcolo (NTC 2018) ====================
   La carpenteria si ricava dai muri portanti già presenti in pianta; poi tutto è
   modificabile a mano. Il calcolo è un PREDIMENSIONAMENTO per carichi verticali:
   analisi dei carichi, discesa ai pilastri, trave continua risolta col metodo degli
   spostamenti, verifiche a flessione e taglio. Non sostituisce l'analisi sismica. */
const CLS_CA={'C20/25':{fck:20},'C25/30':{fck:25},'C28/35':{fck:28},
  'C30/37':{fck:30},'C32/40':{fck:32},'C35/45':{fck:35}};
const ACC_CA={'B450C':{fyk:450},'B450A':{fyk:450}};
const GAMMA_C=1.5, GAMMA_S=1.15, ALFA_CC=0.85, GAMMA_CA=25.0;
const fcdOf=()=>ALFA_CC*(CLS_CA[S.strCfg.cls]||CLS_CA['C25/30']).fck/GAMMA_C;
const fckOf=()=>(CLS_CA[S.strCfg.cls]||CLS_CA['C25/30']).fck;
const fydOf=()=>(ACC_CA[S.strCfg.acc]||ACC_CA['B450C']).fyk/GAMMA_S;
const fctmOf=()=>0.30*Math.pow(fckOf(),2/3);
/* EC2 §3.1.3 Tab. 3.1: Ecm = 22000·(f_cm/10)^0,3 con f_cm = f_ck + 8 in MPa.
   Senza il /10 il modulo esce esattamente il doppio (62 800 invece di 31 500 MPa). */
const EcmOf=()=>22000*Math.pow((fckOf()+8)/10,0.3);   // MPa
/* NTC 2018 Tab. 3.1.II — carichi variabili per destinazione d'uso */
const QK_USO={soggiorno:2.0,cucina:2.0,camera:2.0,cameretta:2.0,bagno:2.0,antibagno:2.0,
  corridoio:2.0,ingresso:2.0,studio:2.0,ripostiglio:2.0,lavanderia:2.0,
  balcone:4.0,scala:4.0,garage:2.5,altro:2.0};
const qkUso=u=>QK_USO[u]!=null?QK_USO[u]:2.0;
/* NTC 2018 §3.4.2 — valore caratteristico del carico neve al suolo */
function qskNeve(zona,as){
  const a=Math.max(0,+as||0);
  if(zona==='I-A') return a<=200?1.50:1.39*(1+Math.pow(a/728,2));
  if(zona==='I-M') return a<=200?1.50:1.35*(1+Math.pow(a/602,2));
  if(zona==='II')  return a<=200?1.00:0.85*(1+Math.pow(a/481,2));
  return a<=200?0.60:0.51*(1+Math.pow(a/481,2));            // zona III
}
/* incidenza dei tramezzi come carico permanente distribuito — NTC 2018 §3.1.3.1 */
function incTramezzi(gPerM){ const g=+gPerM||0;
  if(g<=1.0) return 0.40; if(g<=2.0) return 0.80; if(g<=3.0) return 1.20;
  if(g<=4.0) return 1.60; return 2.00; }

/* ---------- assi portanti ricavati dai muri ---------- */
/* segmenti di una polilinea chiusa, scartando i tratti insignificanti */
function polySegs(g){
  const p=g.pts, out=[];
  let n=p.length;
  if(n>1 && Math.hypot(p[0].x-p[n-1].x,p[0].y-p[n-1].y)<1e-6) n--;
  const m=g.closed?n:n-1;
  for(let i=0;i<m;i++){
    const a=p[i], b=p[(i+1)%n], L=Math.hypot(b.x-a.x,b.y-a.y);
    if(L>0.15) out.push({a,b,L,ux:(b.x-a.x)/L,uy:(b.y-a.y)/L});
  }
  return out;
}
/* Un muro è disegnato come poligono chiuso: le due facce di uno stesso tratto sono
   segmenti paralleli e di verso opposto. Accoppiandole si ottiene la mezzeria (l'asse)
   e la loro distanza (lo spessore). Funziona anche sui muri a L, T o U. */
function axesFromPoly(g,thkMax){
  const SG=polySegs(g), out=[];
  for(let i=0;i<SG.length;i++) for(let j=i+1;j<SG.length;j++){
    const A=SG[i], B=SG[j];
    if(Math.abs(A.ux*B.uy-A.uy*B.ux)>0.10) continue;      // non paralleli
    if(A.ux*B.ux+A.uy*B.uy>-0.5) continue;                // devono essere facce opposte
    let nx=-A.uy, ny=A.ux;
    let d=(B.a.x-A.a.x)*nx+(B.a.y-A.a.y)*ny;
    if(d<0){ nx=-nx; ny=-ny; d=-d; }
    if(d<0.06||d>thkMax) continue;
    const tOf=p=>(p.x-A.a.x)*A.ux+(p.y-A.a.y)*A.uy;
    const tb0=tOf(B.a), tb1=tOf(B.b);
    const lo=Math.max(0,Math.min(tb0,tb1)), hi=Math.min(A.L,Math.max(tb0,tb1));
    if(hi-lo<0.35) continue;                              // sovrapposizione troppo corta
    const o=d/2;
    out.push({p0:{x:A.a.x+A.ux*lo+nx*o, y:A.a.y+A.uy*lo+ny*o},
              p1:{x:A.a.x+A.ux*hi+nx*o, y:A.a.y+A.uy*hi+ny*o},
              thk:d, len:hi-lo});
  }
  return out;
}
/* ---------- sagoma dell'edificio ---------- */
/* Celle occupate dall'edificio: i vani rilevati PIÙ i muri veri, dilatati di poco.
   Dilatare solo i vani di mezzo metro lasciava passare pilastri fuori dalla sagoma,
   negli angoli rientranti e oltre le pareti perimetrali. */
let SAG=null;
function buildSagoma(marg){
  SAG=null;
  if(!S.bbox) return null;
  const cs=0.15, b=S.bbox;
  const nx=Math.ceil(b.w/cs)+12, ny=Math.ceil(b.h/cs)+12;
  const x0=b.x0-6*cs, y0=b.y0-6*cs;
  let m=new Uint8Array(nx*ny);
  const set=(wx,wy)=>{ const ix=Math.floor((wx-x0)/cs), iy=Math.floor((wy-y0)/cs);
    if(ix>=0&&iy>=0&&ix<nx&&iy<ny) m[iy*nx+ix]=1; };
  /* i vani */
  if(S.labels&&S.gw){ const gw=S.gw, gh=S.gh, px=S.px;
    for(let y=0;y<gh;y++){ const row=y*gw;
      for(let x=0;x<gw;x++) if(S.labels[row+x]>0) set(S.gx0+x*px, S.gy0+(gh-y)*px); } }
  /* i muri, campionati lungo i bordi dei poligoni */
  for(const g of S.polys){ const role=S.layerMap[g.layer];
    if(role!=='MUR_EST'&&role!=='MUR_INT'&&role!=='PIL') continue;
    const p=g.pts, n=p.length;
    for(let i=0;i<n;i++){
      const a=p[i], b2=p[(i+1)%n];
      if(!g.closed&&i===n-1) break;
      const L=Math.hypot(b2.x-a.x,b2.y-a.y), k=Math.max(1,Math.ceil(L/(cs*0.7)));
      for(let q=0;q<=k;q++) set(a.x+(b2.x-a.x)*q/k, a.y+(b2.y-a.y)*q/k);
    }
  }
  /* dilatazione separabile, quel tanto che basta a chiudere i buchi del campionamento */
  const r=Math.max(1,Math.round((marg==null?0.25:marg)/cs));
  const dil=(src,horiz)=>{ const out=new Uint8Array(nx*ny);
    for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
      let v=0;
      for(let k=-r;k<=r;k++){
        const ii=horiz?i+k:i, jj=horiz?j:j+k;
        if(ii<0||jj<0||ii>=nx||jj>=ny) continue;
        if(src[jj*nx+ii]){ v=1; break; }
      }
      out[j*nx+i]=v; }
    return out; };
  m=dil(m,true); m=dil(m,false);
  SAG={m,nx,ny,cs,x0,y0};
  return SAG;
}
function inSag(x,y){
  if(!SAG) return true;
  const ix=Math.floor((x-SAG.x0)/SAG.cs), iy=Math.floor((y-SAG.y0)/SAG.cs);
  if(ix<0||iy<0||ix>=SAG.nx||iy>=SAG.ny) return false;
  return !!SAG.m[iy*SAG.nx+ix];
}
/* un tratto è interno se lo è quasi ovunque: qualche cella di bordo non conta */
function segInSag(a,b,frac){
  if(!SAG) return true;
  const n=Math.max(2,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/0.15));
  let ok=0;
  for(let i=0;i<=n;i++){ const t=i/n;
    if(inSag(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t)) ok++; }
  return ok/(n+1) >= (frac==null?0.90:frac);
}
/* aperture: segmento occupato da una porta o da una finestra lungo il proprio muro */
function aperture(){
  return S.infissi.map(f=>{ if(!f.mid) return null;
    const ax=infAxis(f), L=Math.max(0.5,ax.len||infW(f));
    return {f,ax,mid:f.mid,L,thk:ax.thk};
  }).filter(Boolean);
}
/* Sposta un punto fuori da un'apertura scorrendo lungo il muro fino a superare una
   delle due spalle. Prova prima la più vicina; se anche lì c'è un'apertura, l'altra.
   Restituisce null se non c'è posto: allora il pilastro lì non ci sta. */
function scansaApertura(x,y,AP){
  for(let it=0;it<4;it++){
    const d=dentroApertura(x,y,AP);
    if(!d) return inSag(x,y)?{x,y}:null;
    const vicino=(d.t>=0?1:-1), prove=[vicino,-vicino];
    let mosso=false;
    for(const sg of prove){
      /* si trasla il punto lungo l'asse dell'apertura: riposizionarlo sulla mezzeria
         del muro lo sposterebbe anche in senso trasversale */
      const dt=sg*(d.ap.L/2+0.20)-d.t;
      const nx=x+d.ap.ax.ux*dt, ny=y+d.ap.ax.uy*dt;
      if(!inSag(nx,ny)) continue;
      x=nx; y=ny; mosso=true; break;
    }
    if(!mosso) return null;
  }
  return dentroApertura(x,y,AP)?null:{x,y};
}
function dentroApertura(x,y,AP){
  for(const a of AP){
    const dx=x-a.mid.x, dy=y-a.mid.y;
    const t=dx*a.ax.ux+dy*a.ax.uy, n=Math.abs(-dx*a.ax.uy+dy*a.ax.ux);
    if(Math.abs(t)<=a.L/2+0.10 && n<=Math.max(0.35,a.thk)) return {ap:a,t};
  }
  return null;
}

/* ---------- MAGLIA STRUTTURALE ----------
   I muri di un rilievo non sono mai perfettamente allineati: due tratti che in pianta
   sembrano la stessa fila di pilastri stanno a 10-15 cm l'uno dall'altro. Collegando i
   pilastri dov'erano si ottengono travi sghembe. Qui invece si costruisce una maglia
   ortogonale vera: le rette portanti vengono raggruppate e mediate, i pilastri nascono
   sulle loro intersezioni, e le travi risultano diritte per costruzione. */
function direzioniMaglia(axes){
  const bin={};
  axes.forEach(a=>{ const L=Math.hypot(a.p1.x-a.p0.x,a.p1.y-a.p0.y)||1;
    let ang=Math.atan2(a.p1.y-a.p0.y,a.p1.x-a.p0.x);
    ang=((ang%Math.PI)+Math.PI)%Math.PI;                 // mod 180°
    if(ang>=Math.PI/2) ang-=Math.PI/2;                   // mod 90°: le due direzioni sono legate
    const k=Math.round(ang/(Math.PI/180));
    bin[k]=(bin[k]||0)+L; });
  let best=0,bv=-1;
  for(const k in bin) if(bin[k]>bv){ bv=bin[k]; best=+k; }
  const a0=best*Math.PI/180;
  return [{ux:Math.cos(a0),uy:Math.sin(a0)},{ux:-Math.sin(a0),uy:Math.cos(a0)}];
}
const TOL_MAGLIA=0.40;                                   // quanto due muri possono disallinearsi
function maglia(axes,maxL){
  const dirs=direzioniMaglia(axes), u=dirs[0], v=dirs[1];
  const pu=p=>p.x*u.ux+p.y*u.uy, pv=p=>p.x*v.ux+p.y*v.uy;
  const fu=[], fv=[], sghembi=[];
  axes.forEach(a=>{
    const L=Math.hypot(a.p1.x-a.p0.x,a.p1.y-a.p0.y)||1;
    const dx=(a.p1.x-a.p0.x)/L, dy=(a.p1.y-a.p0.y)/L;
    const cu=Math.abs(dx*u.ux+dy*u.uy), cv=Math.abs(dx*v.ux+dy*v.uy);
    if(cu>=0.966) fu.push({s:(pv(a.p0)+pv(a.p1))/2,
      t0:Math.min(pu(a.p0),pu(a.p1)),t1:Math.max(pu(a.p0),pu(a.p1)),L,thk:a.thk});
    else if(cv>=0.966) fv.push({s:(pu(a.p0)+pu(a.p1))/2,
      t0:Math.min(pv(a.p0),pv(a.p1)),t1:Math.max(pv(a.p0),pv(a.p1)),L,thk:a.thk});
    else sghembi.push(a);
  });
  /* raggruppa le rette quasi coincidenti e le media pesando sulla lunghezza del muro:
     la retta finisce sul muro principale, non a metà fra due */
  const raggruppa=list=>{
    const ord=list.slice().sort((p,q)=>p.s-q.s), gr=[];
    ord.forEach(o=>{ const g=gr[gr.length-1];
      if(g && o.s-g.smax<=TOL_MAGLIA){ g.it.push(o); g.smax=Math.max(g.smax,o.s); }
      else gr.push({it:[o],smax:o.s}); });
    return gr.map(g=>{ const W=g.it.reduce((a,o)=>a+o.L,0)||1;
      return {s:g.it.reduce((a,o)=>a+o.s*o.L,0)/W,
              t0:Math.min.apply(null,g.it.map(o=>o.t0)),
              t1:Math.max.apply(null,g.it.map(o=>o.t1)),
              thk:Math.max.apply(null,g.it.map(o=>o.thk)),
              L:W, muro:true}; });
  };
  let LU=raggruppa(fu), LV=raggruppa(fv);
  /* rette in più dove la maglia sarebbe troppo rada: è così che nascono i pilastri
     e le travi in mezzo all'edificio, dove i muri non arrivano */
  const infittisci=(LL,ext)=>{
    if(LL.length<2) return LL;
    const out=[LL[0]];
    for(let k=1;k<LL.length;k++){
      const base=out[out.length-1].s, d=LL[k].s-base;
      const n=Math.max(1,Math.ceil(d/maxL));
      for(let q=1;q<n;q++) out.push({s:base+d*q/n,t0:ext.t0,t1:ext.t1,
        thk:Math.max(0.24,+S.strCfg.thkMin||0.24),L:0,muro:false});
      out.push(LL[k]);
    }
    return out;
  };
  const estU={t0:Math.min.apply(null,LU.map(l=>l.t0).concat(LV.map(l=>l.s))),
              t1:Math.max.apply(null,LU.map(l=>l.t1).concat(LV.map(l=>l.s)))};
  const estV={t0:Math.min.apply(null,LV.map(l=>l.t0).concat(LU.map(l=>l.s))),
              t1:Math.max.apply(null,LV.map(l=>l.t1).concat(LU.map(l=>l.s)))};
  LU=infittisci(LU,estU); LV=infittisci(LV,estV);
  /* una retta aggiunta che cade dentro una porta o una finestra si sposta di poco:
     spostare la retta tiene la maglia ortogonale, spostare il singolo pilastro no */
  const AP=aperture();
  const scosta=(LL,ALTRE,asseU)=>LL.forEach(l=>{
    if(l.muro) return;
    const collide=d=>ALTRE.some(o=>{
      const P=asseU? {x:u.ux*(l.s+d)+v.ux*o.s, y:u.uy*(l.s+d)+v.uy*o.s}
                   : {x:u.ux*o.s+v.ux*(l.s+d), y:u.uy*o.s+v.uy*(l.s+d)};
      return !!dentroApertura(P.x,P.y,AP);
    });
    if(!collide(0)) return;
    for(const d of [0.25,-0.25,0.5,-0.5,0.75,-0.75,1.0,-1.0])
      if(!collide(d)){ l.s+=d; return; }
  });
  scosta(LV,LU,false); scosta(LU,LV,true);
  LU.sort((a,b)=>a.s-b.s); LV.sort((a,b)=>a.s-b.s);
  return {u,v,LU,LV,sghembi,pu,pv};
}
/* fonde gli assi che stanno sulla stessa retta. I vuoti brevi non spezzano l'asse:
   una porta o una finestra interrompe il muro ma non la trave che ci passa sopra,
   altrimenti nascerebbero due pilastri ai lati di ogni apertura. */
function mergeAxes(list,tol,maxGap){
  const gap0=(maxGap==null?0:maxGap);
  const grp=[];
  list.slice().sort((a,b)=>b.len-a.len).forEach(a=>{
    const al=Math.hypot(a.p1.x-a.p0.x,a.p1.y-a.p0.y)||1;
    const ux=(a.p1.x-a.p0.x)/al, uy=(a.p1.y-a.p0.y)/al;
    for(const g of grp){
      if(Math.abs(ux*g.uy-uy*g.ux)>0.06) continue;                      // direzioni diverse
      const perp=p=>Math.abs((p.x-g.o.x)*(-g.uy)+(p.y-g.o.y)*g.ux);
      if(perp(a.p0)>tol||perp(a.p1)>tol) continue;                      // rette diverse
      const t=p=>(p.x-g.o.x)*g.ux+(p.y-g.o.y)*g.uy;
      g.iv.push({a:Math.min(t(a.p0),t(a.p1)),b:Math.max(t(a.p0),t(a.p1)),thk:a.thk});
      return;
    }
    grp.push({o:{x:a.p0.x,y:a.p0.y},ux,uy,
      iv:[{a:0,b:al,thk:a.thk}]});
  });
  const out=[];
  grp.forEach(g=>{
    g.iv.sort((p,q)=>p.a-q.a);
    let cur=null;
    const pt=t=>({x:g.o.x+g.ux*t, y:g.o.y+g.uy*t});
    const push=()=>{ if(!cur) return;
      out.push({p0:pt(cur.a),p1:pt(cur.b),thk:cur.thk,len:cur.b-cur.a,vuoti:cur.vuoti}); cur=null; };
    g.iv.forEach(v=>{
      if(!cur){ cur={a:v.a,b:v.b,thk:v.thk,vuoti:[]}; return; }
      if(v.b<=cur.b+tol){ cur.thk=Math.max(cur.thk,v.thk); cur.b=Math.max(cur.b,v.b); return; }
      const gp=v.a-cur.b;
      if(gp<=tol){ cur.b=v.b; cur.thk=Math.max(cur.thk,v.thk); return; }
      if(gp<=gap0 && segInSag(pt(cur.b),pt(v.a),0.85)){
        cur.vuoti.push({t0:cur.b,t1:v.a});
        cur.b=v.b; cur.thk=Math.max(cur.thk,v.thk); return;
      }
      push(); cur={a:v.a,b:v.b,thk:v.thk,vuoti:[]};
    });
    push();
  });
  return out;
}
/* assi dei muri PORTANTI: sopra lo spessore minimo impostato (i tramezzi non portano) */
function structAxes(){
  const thkMin=+S.strCfg.thkMin||0.20, raw=[];
  for(const g of S.polys){ const role=S.layerMap[g.layer];
    if(role!=='MUR_EST'&&role!=='MUR_INT') continue;
    const ax=rectAxis(g.pts);
    if(ax && ax.thk>=thkMin-1e-9 && ax.len>0.4) raw.push({p0:ax.p0,p1:ax.p1,thk:ax.thk,len:ax.len});
    else axesFromPoly(g,0.80).forEach(a=>{ if(a.thk>=thkMin-1e-9) raw.push(a); });
  }
  return mergeAxes(raw,0.12,2.60).filter(a=>a.len>=0.6);
}

/* ---------- generazione della carpenteria ---------- */
function ensureStr(){ if(!S.strutt) S.strutt={pil:[],trave:[],solaio:[],plinto:[],cordolo:[],architrave:[]};
  ['cordolo','architrave','strisce'].forEach(k=>{ if(!S.strutt[k]) S.strutt[k]=[]; });
  return S.strutt; }
const strLevels=()=>S.livelli.slice().sort((a,b)=>a.quota-b.quota);
function segInt(a,b){          // intersezione fra due segmenti (anche prolungati di poco)
  const r={x:a.p1.x-a.p0.x,y:a.p1.y-a.p0.y}, s={x:b.p1.x-b.p0.x,y:b.p1.y-b.p0.y};
  const den=r.x*s.y-r.y*s.x; if(Math.abs(den)<1e-9) return null;
  const qp={x:b.p0.x-a.p0.x,y:b.p0.y-a.p0.y};
  const t=(qp.x*s.y-qp.y*s.x)/den, u=(qp.x*r.y-qp.y*r.x)/den;
  const m=0.25/Math.max(0.5,Math.hypot(r.x,r.y)), m2=0.25/Math.max(0.5,Math.hypot(s.x,s.y));
  if(t<-m||t>1+m||u<-m2||u>1+m2) return null;
  return {x:a.p0.x+r.x*t, y:a.p0.y+r.y*t};
}
/* direzioni principali della maglia: quella più ricorrente fra gli assi, e la sua normale */
function direzioniMaglia(axes){
  const bin={};
  axes.forEach(a=>{ const L=Math.hypot(a.p1.x-a.p0.x,a.p1.y-a.p0.y)||1;
    let ang=Math.atan2(a.p1.y-a.p0.y,a.p1.x-a.p0.x);
    ang=((ang%Math.PI)+Math.PI)%Math.PI;                 // mod 180°
    if(ang>=Math.PI/2) ang-=Math.PI/2;                   // mod 90°: le due direzioni sono legate
    const k=Math.round(ang/(Math.PI/180));
    bin[k]=(bin[k]||0)+L; });
  let best=0,bv=-1;
  for(const k in bin) if(bin[k]>bv){ bv=bin[k]; best=+k; }
  const a0=best*Math.PI/180;
  return [{ux:Math.cos(a0),uy:Math.sin(a0)},{ux:-Math.sin(a0),uy:Math.cos(a0)}];
}
function genStrutture(){
  if(!S.polys.length) return;
  const ST=ensureStr();
  STR_AXES=null;
  ST.pil=[]; ST.trave=[]; ST.solaio=[]; ST.plinto=[]; ST.cordolo=[]; ST.architrave=[];
  ST.strisce=[]; ST.platea=null;
  buildSagoma(0.25);
  const AP=aperture();
  const axes=structAxes();
  const maxL=clmp(+S.strCfg.maxLuce||4.5,2,9);
  const levels=strLevels();
  const G=maglia(axes,maxL), u=G.u, v=G.v, LU=G.LU, LV=G.LV;
  const bP=clmp(+S.strCfg.pilB||0.30,0.20,1.2), hP=clmp(+S.strCfg.pilH||0.30,0.20,1.2);
  const angG=Math.atan2(u.uy,u.ux);
  /* --- pilastri sulle intersezioni della maglia --- */
  const pilAt=[], nodo={};
  const dentro=(l,s)=>s>=l.t0-0.70&&s<=l.t1+0.70;
  const mk=(i,j)=>{
    const k=i+':'+j; if(nodo[k]!==undefined) return nodo[k];
    const lu=LU[i], lv=LV[j];
    const P={x:u.ux*lv.s+v.ux*lu.s, y:u.uy*lv.s+v.uy*lu.s, i,j};
    /* Basta che UNA delle due rette arrivi fin qui: lungo un muro lungo servono
       pilastri anche dove non incrocia nessun altro muro, altrimenti restano campate
       da nove metri. Il punto deve però stare dentro la sagoma dell'edificio. */
    let ok=(dentro(lu,lv.s)||dentro(lv,lu.s))&&inSag(P.x,P.y);
    /* Mai un pilastro dentro una porta o una finestra: lì ci va l'architrave. Invece di
       rinunciare al nodo — lasciando una campata da cinque metri — lo si fa scorrere
       lungo il muro fino a superare la spalla. Resta sulla retta del muro, quindi le
       travi che corrono lungo quel muro restano diritte. */
    if(ok){
      const q=scansaApertura(P.x,P.y,AP);
      if(!q) ok=false;
      else {
        /* L'asse dell'apertura non è mai perfettamente parallelo al muro: scorrendoci
           sopra il punto esce di qualche centimetro dalla retta. Va rimesso esattamente
           sulla retta, altrimenti quei pochi centimetri storcono tutta la trave. */
        let a2=G.pu(q), b2=G.pv(q);
        if(Math.abs(b2-lu.s)<=Math.abs(a2-lv.s)) b2=lu.s; else a2=lv.s;
        P.x=u.ux*a2+v.ux*b2; P.y=u.uy*a2+v.uy*b2;
        if(!inSag(P.x,P.y)||dentroApertura(P.x,P.y,AP)) ok=false;
      }
    }
    const P2=ok?{x:P.x,y:P.y,ang:angG,i,j,b:bP,h:hP}:null;
    if(P2) pilAt.push(P2);
    nodo[k]=P2; return P2;
  };
  for(let i=0;i<LU.length;i++) for(let j=0;j<LV.length;j++) mk(i,j);
  /* --- travi lungo le rette della maglia --- */
  const campate=[], vis=new Set();
  const kk=(A,B)=>{ const a=pilAt.indexOf(A), b=pilAt.indexOf(B);
    return Math.min(a,b)+'-'+Math.max(a,b); };
  const addCampata=(A,B,thk,ai,muro)=>{
    if(!A||!B||A===B) return false;
    const len=Math.hypot(B.x-A.x,B.y-A.y);
    if(len<0.60) return false;
    const k=kk(A,B); if(vis.has(k)) return false;
    if(!segInSag(A,B,0.85)) return false;              // passerebbe fuori dall'edificio
    vis.add(k); campate.push({A,B,len,thk,ai,muro:muro!==false});
    return true;
  };
  let nax=0;
  /* un nodo spostato per schivare un'apertura non appartiene più alla retta trasversale:
     entra solo nelle travi della retta su cui è rimasto, le altre lo saltano */
  const suRetta=(P,s,asseU)=>Math.abs((asseU?G.pv(P):G.pu(P))-s)<0.12;
  LU.forEach((lu,i)=>{
    const cols=[];
    for(let j=0;j<LV.length;j++){ const P=nodo[i+':'+j];
      if(P&&suRetta(P,lu.s,true)) cols.push({P,s:G.pu(P)}); }
    cols.sort((a,b)=>a.s-b.s);
    const ai=nax++;
    for(let k=1;k<cols.length;k++) addCampata(cols[k-1].P,cols[k].P,lu.thk,ai,lu.muro);
  });
  LV.forEach((lv,j)=>{
    const cols=[];
    for(let i=0;i<LU.length;i++){ const P=nodo[i+':'+j];
      if(P&&suRetta(P,lv.s,false)) cols.push({P,s:G.pv(P)}); }
    cols.sort((a,b)=>a.s-b.s);
    const ai=nax++;
    for(let k=1;k<cols.length;k++) addCampata(cols[k-1].P,cols[k].P,lv.thk,ai,lv.muro);
  });
  /* --- muri sghembi: restano com'erano, con pilastri agli estremi --- */
  const vicino=(x,y)=>pilAt.find(p=>Math.hypot(p.x-x,p.y-y)<TOL_MAGLIA);
  /* come sopra, ma solo se il pilastro sta davvero sull'asse del tratto:
     agganciarne uno fuori asse è ciò che rende le travi storte */
  const vicinoInAsse=(x,y,A,B)=>{
    const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy)||1;
    return pilAt.find(p=>{
      if(Math.hypot(p.x-x,p.y-y)>=TOL_MAGLIA) return false;
      return Math.abs((p.x-A.x)*(-dy/L)+(p.y-A.y)*(dx/L))<0.12;
    });
  };
  G.sghembi.forEach(a=>{
    const L=Math.hypot(a.p1.x-a.p0.x,a.p1.y-a.p0.y)||1;
    const ang=Math.atan2(a.p1.y-a.p0.y,a.p1.x-a.p0.x);
    const n=Math.max(1,Math.ceil(L/maxL));
    const pts=[];
    for(let q=0;q<=n;q++){
      const t=q/n, x=a.p0.x+(a.p1.x-a.p0.x)*t, y=a.p0.y+(a.p1.y-a.p0.y)*t;
      let P=vicinoInAsse(x,y,a.p0,a.p1);
      if(!P){ if(!inSag(x,y)||dentroApertura(x,y,AP)) { pts.push(null); continue; }
        P={x,y,ang,b:bP,h:hP}; pilAt.push(P); }
      pts.push(P);
    }
    const ai=nax++;
    for(let q=1;q<pts.length;q++) addCampata(pts[q-1],pts[q],a.thk,ai,true);
  });
  /* --- nessuna campata oltre la luce massima --- */
  const finali=[];
  campate.forEach(c=>{
    if(c.len<=maxL*1.02){ finali.push(c); return; }
    const n=Math.ceil(c.len/maxL), cat=[c.A];
    for(let q=1;q<n;q++){
      const t=q/n;
      const w=scansaApertura(c.A.x+(c.B.x-c.A.x)*t, c.A.y+(c.B.y-c.A.y)*t, AP);
      if(!w) continue;
      const x=w.x, y=w.y;
      /* schivando l'apertura il punto può essere uscito dall'asse della campata:
         accettarlo storcerebbe la trave, meglio lasciare la campata lunga */
      { const dx=c.B.x-c.A.x, dy=c.B.y-c.A.y, LL=Math.hypot(dx,dy)||1;
        if(Math.abs((x-c.A.x)*(-dy/LL)+(y-c.A.y)*(dx/LL))>0.12) continue; }
      let P=vicinoInAsse(x,y,c.A,c.B); if(P===c.A||P===c.B) P=null;
      if(!P){ P={x,y,ang:c.A.ang,b:bP,h:hP}; pilAt.push(P); }
      if(P!==cat[cat.length-1]) cat.push(P);
    }
    if(cat.length<2){ finali.push(c); return; }
    cat.push(c.B);
    for(let q=1;q<cat.length;q++){
      const A=cat[q-1], B=cat[q], len=Math.hypot(B.x-A.x,B.y-A.y);
      if(len>=0.60) finali.push({A,B,len,thk:c.thk,ai:c.ai,muro:c.muro});
    }
  });
  campate.length=0; campate.push.apply(campate,finali);
  /* scarta i pilastri che non reggono alcuna trave */
  const usati=new Set(); campate.forEach(c=>{ usati.add(c.A); usati.add(c.B); });
  const pilOk=pilAt.filter(p=>usati.has(p));
  if(!pilOk.length) pilOk.push.apply(pilOk,pilAt);
  levels.forEach(L=>{
    pilOk.forEach((p,i)=>ST.pil.push({id:uid(),liv:L.id,x:p.x,y:p.y,ang:p.ang,
      b:p.b,h:p.h,sig:'P'+(i+1),N:0,ver:null}));
  });
  let nt=0;
  levels.forEach(L=>{
    campate.forEach(c=>{
      const bT=clmp(Math.max(0.24,Math.min(c.thk,0.60)),0.20,0.80);
      const hT=clmp(Math.ceil(c.len/9/0.05)*0.05,0.30,0.80);
      ST.trave.push({id:uid(),liv:L.id,a:{x:c.A.x,y:c.A.y},b:{x:c.B.x,y:c.B.y},
        len:c.len,b_:bT,h:hT,sig:'T'+(++nt),ax:c.ai,suMuro:c.muro,q:0,M:0,V:0,ver:null});
    });
  });

  /* --- solai: uno per vano, orditi nella direzione più corta --- */
  const EM=edgeMap();
  levels.forEach(L=>{
    S.rooms.forEach(rm=>{
      const em=EM.get(rm.lab)||[]; if(!em.length) return;
      const bb=bboxOf(em), w=bb.x1-bb.x0, h=bb.y1-bb.y0;
      const dir=w<=h?'x':'y';                     // ordito nella direzione della luce minore
      const luce=Math.min(w,h);
      ST.solaio.push({id:uid(),liv:L.id,room:rm.lab,bb,dir,luce,
        tipo:S.strCfg.tipoSol,h:+S.strCfg.hSolaio||0.24,
        area:rm.area,uso:usoOf(rm),g1:0,g2:0,qk:0,ver:null});
    });
  });
  /* --- plinti sotto i pilastri del livello più basso --- */
  const L0=levels[0];
  if(L0) ST.pil.filter(p=>p.liv===L0.id).forEach(p=>{
    ST.plinto.push({id:uid(),pil:p.id,x:p.x,y:p.y,b:0.9,h:0.9,sp:0.5,N:0,sigma:0,ver:null});
  });
  genArchitravi(ST,levels,AP);
  if(S.strCfg.autoDim!==false) dimensionaAuto(); else calcStrutture();
}
/* ---------- architravi sopra porte e finestre ----------
   Sopra ogni apertura c'è muratura fino all'intradosso della trave di piano: la porta
   la regge un'architrave, non due pilastri ai lati. Se l'apertura arriva già sotto la
   trave, l'architrave coincide con la trave e non si genera. */
function genArchitravi(ST,levels,AP){
  ST.architrave=[];
  const app=0.25;                                   // appoggio per lato
  let na=0;
  (AP||aperture()).forEach(a=>{
    const f=a.f;
    const rm=S.rooms.find(r=>r.lab===f.room);
    const L=(rm?livOf(rm):null)||levels[0]; if(!L) return;
    const luce=a.L, tot=luce+2*app;
    const b=clmp(a.thk||0.30,0.10,0.60);
    ST.architrave.push({id:uid(),liv:L.id,inf:f.id,kind:f.kind,num:f.num||'',
      x:a.mid.x,y:a.mid.y,ux:a.ax.ux,uy:a.ax.uy,z:infSill(f)+infH(f),
      luce,len:tot,b_:b,h:clmp(Math.ceil(Math.max(0.20,tot/12)/0.05)*0.05,0.20,0.50),
      sig:'A'+(++na),ver:null});
  });
}
/* Carico e verifica: la muratura sopra l'apertura, fino all'intradosso della trave di
   piano. Se l'apertura arriva già sotto la trave, l'architrave è la trave stessa. */
function verificaArchitravi(ST,levels){
  const gMuro=+S.strCfg.gMuro||8.0;
  (ST.architrave||[]).forEach(a=>{
    const L=levels.find(l=>l.id===a.liv)||levels[0];
    let hT=0.40, best=1e9;
    ST.trave.filter(t=>t.liv===a.liv).forEach(t=>{
      const d=Math.hypot((t.a.x+t.b.x)/2-a.x,(t.a.y+t.b.y)/2-a.y);
      if(d<best){ best=d; hT=t.h; } });
    a.hMuro=Math.max(0,Math.max(0.4,L?L.h:3)-hT-a.z);
    if(a.hMuro<0.15){
      a.assorbita=true; a.ver=true; a.q=0; a.M=0; a.V=0; a.As=0; a.barre=null;
      a.nota='assorbita dalla trave di piano'; return;
    }
    a.assorbita=false;
    const qd=1.3*(a.hMuro*a.b_*gMuro+GAMMA_CA*a.b_*a.h);
    a.q=qd; a.M=qd*a.len*a.len/8; a.V=qd*a.len/2;
    const fl=armaFlex(a.M,a.b_,a.h);
    a.As=fl.As; a.barre=scegliBarre(fl.As);
    a.taglio=verTaglio(a.V,a.b_,a.h,fl.As);
    a.ver=fl.ok&&a.taglio.ok;
    a.nota=!fl.ok?'sezione insufficiente: alza l\'architrave'
      :(!a.taglio.ok?'taglio insufficiente':'');
  });
}
/* ---------- dimensionamento automatico delle sezioni ----------
   Si parte da un predimensionamento e si cresce solo dove la verifica non passa,
   rifacendo ogni volta l'analisi completa. Le sezioni non tornano mai indietro,
   quindi il ciclo termina. */
function predimensiona(ST,levels){
  const fcd=fcdOf()*1000;
  const bMin=clmp(+S.strCfg.pilB||0.30,0.20,1.2), hMin=clmp(+S.strCfg.pilH||0.30,0.20,1.2);
  const nPiani=levels.length;
  const area=S.rooms.reduce((s,r)=>s+r.area,0)||100;
  const nPil=Math.max(1,ST.pil.filter(p=>p.liv===levels[0].id).length);
  const qMedio=11.0;                                 // kN/m² di stima allo SLU
  levels.forEach((L,i)=>{
    const sopra=nPiani-i;                            // piani portati da questo livello
    const N=area/nPil*qMedio*sopra;
    /* metà della sezione lavora a flessione: si tiene f_cd ridotto */
    let lato=Math.sqrt(Math.max(0.09,N/(0.38*fcd)));
    lato=clmp(Math.ceil(lato/0.05)*0.05,Math.max(bMin,0.30),0.80);
    ST.pil.filter(p=>p.liv===L.id&&!p.man).forEach(p=>{
      p.b=Math.max(bMin,lato); p.h=Math.max(hMin,lato); });
  });
  ST.trave.forEach(t=>{ if(t.man) return;
    t.h=clmp(Math.ceil(t.len/9/0.05)*0.05,0.30,0.80);
  });
}
function dimensionaAuto(){
  const ST=ensureStr(), levels=strLevels();
  if(!ST.trave.length&&!ST.solaio.length) return;
  predimensiona(ST,levels);
  /* Prima analisi con le sezioni minime: serve a conoscere lo sforzo normale di ogni
     pilastro. Poi ciascuno riparte dalla sezione che il proprio carico richiede,
     tenendo lo sforzo normale adimensionale sotto 0,30 come vuole la duttilità. */
  calcStrutture();
  { const fcd=fcdOf()*1000;
    const bMin=clmp(+S.strCfg.pilB||0.30,0.20,1.2), hMin=clmp(+S.strCfg.pilH||0.30,0.20,1.2);
    ST.pil.forEach(p=>{ if(p.man) return;
      const lato=Math.sqrt(Math.max(0.04,(p.N||0)/(0.30*fcd)));
      const q=clmp(Math.ceil(lato/0.05)*0.05,0.25,0.80);
      p.b=Math.max(bMin,q); p.h=Math.max(hMin,q);
    }); }
  const MAXIT=9;
  let it=0;
  for(;it<MAXIT;it++){
    calcStrutture();
    let cresciuto=0;
    ST.trave.forEach(t=>{
      if(t.man||t.ver!==false||/non collegata/.test(t.nota||'')) return;
      if(t.h<0.795){ t.h=+(t.h+0.05).toFixed(2); cresciuto++; }
      else if(t.b_<0.595){ t.b_=+(t.b_+0.05).toFixed(2); cresciuto++; }
    });
    /* Ogni pilastro cresce per conto suo, secondo il proprio carico: farli crescere
       tutti insieme li rende inutilmente uguali. Si allarga anche quando l'armatura
       richiesta supera il 2 %: oltre quella soglia conviene la sezione, non l'acciaio. */
    const nodiKO=new Set();
    if(ANA&&ANA.nodi) ANA.nodi.filter(n=>!n.ok).forEach(n=>nodiKO.add(n.pil));
    ST.pil.forEach(p=>{
      if(p.man) return;                                  // sezione imposta a mano
      const serve = p.ver===false || nodiKO.has(p.sig) || (p.rho||0)>0.020;
      if(!serve || /snellezza/.test(p.nota||'')) return;
      /* oltre il doppio della sezione minima non è più un pilastro ma un setto:
         meglio fermarsi e segnalarlo che gonfiarlo all'infinito */
      if(Math.max(p.b,p.h)>=2.2*Math.max(0.30,+S.strCfg.pilB||0.30)) return;
      const My=p.My||0, Mz=p.Mz||0;
      let f=false;
      if(My>Mz*1.3 && p.h<0.795){ p.h=+(p.h+0.05).toFixed(2); f=true; }
      else if(Mz>My*1.3 && p.b<0.795){ p.b=+(p.b+0.05).toFixed(2); f=true; }
      else { if(p.b<0.795){ p.b=+(p.b+0.05).toFixed(2); f=true; }
             if(p.h<0.795){ p.h=+(p.h+0.05).toFixed(2); f=true; } }
      if(f) cresciuto++;
    });
    ST.architrave.forEach(a=>{
      if(a.man||a.ver!==false) return;
      if(a.h<0.495){ a.h=+(a.h+0.05).toFixed(2); cresciuto++; }
    });
    if(!cresciuto) break;
  }
  /* nessun pilastro può essere più piccolo di quello che porta: le sezioni si
     propagano verso il basso, come si costruisce davvero */
  const giu=strLevels().slice().reverse();
  const perPos={};
  giu.forEach(L=>ST.pil.filter(p=>p.liv===L.id).forEach(p=>{
    const k=Math.round(p.x*10)+'_'+Math.round(p.y*10);
    const s0=perPos[k];
    if(s0&&!p.man){ p.b=Math.max(p.b,s0.b); p.h=Math.max(p.h,s0.h); }
    perPos[k]={b:p.b,h:p.h};
  }));
  calcStrutture();
  ST.iterDim=it+1;
}

/* ---------- analisi dei carichi ---------- */
/* peso di una stratigrafia salvata (kN/m²), dalle densità dei materiali già inserite */
function pesoStrat(id){
  const st=S.strati.find(x=>x.id===id); if(!st) return null;
  let g=0;
  (st.strati||[]).forEach(l=>{ const m=S.materiali.find(x=>x.id===l.mat);
    if(m&&m.rho) g+=m.rho*(+l.s||0)*9.81/1000; });
  return g;
}
/* peso proprio del solaio (kN/m²) */
function g1Solaio(s){
  const h=+s.h||0.24;
  if(s.tipo==='ca') return GAMMA_CA*h;
  const sol=clmp(h*0.18,0.04,0.06), hp=Math.max(0.08,h-sol);
  const travetti=2*0.10*hp*GAMMA_CA;              // due travetti al metro, base 10 cm
  const pignatte=(1-2*0.10)*hp*8.0;               // laterizio alleggerito
  return GAMMA_CA*sol+travetti+pignatte;
}
function analisiCarichi(){
  const C=S.strCfg;
  const g2Base=(C.stratPav?pesoStrat(C.stratPav):null);
  const perm=(g2Base!=null?g2Base:(+C.g2Fin||1.60))+(+C.g2Int||0.30)
            +incTramezzi(+C.gTramezzo||2.0);
  const qs=0.8*qskNeve(C.zonaNeve,C.altitudine);
  return {g2:perm, g2fin:(g2Base!=null?g2Base:(+C.g2Fin||1.60)), qs,
          qsk:qskNeve(C.zonaNeve,C.altitudine)};
}
/* combinazione fondamentale SLU — NTC 2018 §2.5.3 */
const slu=(g1,g2,qk)=>1.3*g1+1.5*g2+1.5*qk;
const sleQp=(g1,g2,qk)=>g1+g2+0.3*qk;

/* ---------- solutore di trave continua (metodo degli spostamenti) ---------- */
/* campate = luci in m, w = carico distribuito per campata (kN/m), EI costante.
   Incognite: rotazioni ai nodi. Appoggi semplici: nessun cedimento verticale. */
function contBeam(spans,w,EI){
  const n=spans.length, nd=n+1;
  if(!n) return null;
  const K=[], F=[];
  for(let i=0;i<nd;i++){ K.push(new Array(nd).fill(0)); F.push(0); }
  const FEM=[];
  for(let i=0;i<n;i++){
    const L=Math.max(0.1,spans[i]), k=EI/L, wi=w[i]||0;
    K[i][i]+=4*k; K[i][i+1]+=2*k; K[i+1][i]+=2*k; K[i+1][i+1]+=4*k;
    const m0=-wi*L*L/12, m1=+wi*L*L/12;   // momenti di incastro perfetto
    FEM.push([m0,m1]);
    F[i]-=m0; F[i+1]-=m1;
  }
  /* estremi su appoggio semplice: rotazione libera, nessun vincolo da imporre */
  const th=solveLin(K,F)||new Array(nd).fill(0);
  const out=[];
  for(let i=0;i<n;i++){
    const L=Math.max(0.1,spans[i]), k=EI/L, wi=w[i]||0;
    const Mi=FEM[i][0]+k*(4*th[i]+2*th[i+1]);
    const Mj=FEM[i][1]+k*(2*th[i]+4*th[i+1]);
    /* convenzione: momento positivo = fibre tese inferiori */
    const Ma=-Mi, Mb=Mj;
    const V0=wi*L/2-(Mb-Ma)/L, V1=-(wi*L/2+(Mb-Ma)/L);
    const xm=clmp(V0/Math.max(1e-6,wi),0,L);
    const Mmax=Ma+V0*xm-wi*xm*xm/2;
    out.push({L,w:wi,Ma,Mb,V0,V1,Mmax,xMax:xm,
      Mneg:Math.min(Ma,Mb,0), Mpos:Math.max(Mmax,0)});
  }
  return {campate:out,rot:th};
}
/* eliminazione di Gauss con pivot parziale */
function solveLin(A,b){
  const n=b.length, M=A.map((r,i)=>r.concat([b[i]]));
  for(let c=0;c<n;c++){
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    if(Math.abs(M[p][c])<1e-12) return null;
    [M[c],M[p]]=[M[p],M[c]];
    for(let r=0;r<n;r++){ if(r===c) continue;
      const f=M[r][c]/M[c][c]; if(!f) continue;
      for(let k=c;k<=n;k++) M[r][k]-=f*M[c][k]; }
  }
  return M.map((r,i)=>r[n]/r[i]);   // dopo l'eliminazione ogni riga ha il pivot sulla diagonale
}

/* ---------- verifiche in c.a. ---------- */
const BARRE=[12,14,16,18,20,22,24,26];
function armaFlex(Md,b,h){                      // Md in kNm, b/h in m
  const d=Math.max(0.05,h-0.04), fcd=fcdOf()*1000, fyd=fydOf()*1000;   // kPa
  const Md_=Math.abs(Md);
  const mu=Md_/(b*d*d*fcd);
  if(mu>0.45) return {ok:false,As:0,mu,msg:'sezione insufficiente a flessione'};
  const om=1-Math.sqrt(Math.max(0,1-2*mu));
  let As=om*b*d*fcd/fyd*1e4;                    // cm²
  const fyk=(ACC_CA[S.strCfg.acc]||ACC_CA['B450C']).fyk;
  const AsMin=Math.max(0.26*fctmOf()/fyk*b*d, 0.0013*b*d)*1e4;   // EC2 §9.2.1.1, su fyk
  const AsMax=0.04*b*h*1e4;
  As=Math.max(As,AsMin);
  return {ok:As<=AsMax, As, AsMin, AsMax, mu, d};
}
function scegliBarre(As){                        // As in cm²
  let best=null;
  for(const phi of BARRE){ const a=Math.PI*phi*phi/400;
    const n=Math.max(2,Math.ceil(As/a));
    if(n>8) continue;
    const tot=n*a, sc=tot-As+n*0.02;
    if(!best||sc<best.sc) best={n,phi,tot,sc};
  }
  if(!best){ const phi=26,a=Math.PI*phi*phi/400,n=Math.ceil(As/a); best={n,phi,tot:n*a,sc:0}; }
  return best;
}
/* barre di un pilastro: numero pari, almeno 4, distribuite sul perimetro */
function barrePil(As){                            // As in cm²
  let best=null;
  for(const phi of BARRE) for(const n of [4,6,8,10,12,14,16,20]){
    const tot=n*Math.PI*phi*phi/400;
    if(tot<As-1e-9) continue;
    const sc=(tot-As)+n*0.05+phi*0.01;
    if(!best||sc<best.sc) best={n,phi,tot,sc};
  }
  if(!best){ const phi=26,a=Math.PI*phi*phi/400;
    const n=Math.max(4,2*Math.ceil(As/a/2)); best={n,phi,tot:n*a,sc:0}; }
  return best;
}
function verTaglio(Vd,b,h,As){                   // Vd kN
  const d=Math.max(0.05,h-0.04), fck=fckOf();
  const rho=Math.min(0.02,(As/1e4)/(b*d));
  const k=Math.min(2,1+Math.sqrt(0.2/d));
  const vmin=0.035*Math.pow(k,1.5)*Math.sqrt(fck);
  const vRdc=Math.max(0.18/GAMMA_C*k*Math.pow(100*rho*fck,1/3), vmin)*1000*b*d;  // kN
  const V=Math.abs(Vd);
  if(V<=vRdc) return {ok:true,staffe:false,VRdc:vRdc,V,pass:'minime'};
  /* Traliccio a inclinazione variabile: cotθ si sceglie fra 2,5 e 1. Tenerlo fisso a
     2,5 sottostima del 30 % la resistenza delle bielle e boccia sezioni che reggono
     benissimo; abbassarlo costa più staffe, ed è il compromesso giusto. */
  const fcd=fcdOf()*1000, fyd=fydOf()*1000;
  const bielle=c=>0.9*d*b*0.5*fcd*(c/(1+c*c));
  let cot=2.5, VRcd_=bielle(2.5);
  for(const c of [2.5,2.0,1.75,1.5,1.25,1.0]){ cot=c; VRcd_=bielle(c); if(V<=VRcd_) break; }
  const AswS=V/(0.9*d*fyd*cot)*1e4;              // cm²/m
  const nBr=2, phi=AswS<=3?8:10, a=Math.PI*phi*phi/400;
  const passo=Math.min(0.8*d,0.30,nBr*a/Math.max(0.01,AswS));
  return {ok:V<=VRcd_, staffe:true, VRdc:vRdc, VRcd:VRcd_, V, AswS, cot,
          phi, passo:Math.max(0.05,Math.floor(passo*100)/100)};
}

/* ---------- discesa dei carichi, analisi sismica e verifiche ---------- */
const PSI2=0.30;                     // ψ2 per carichi residenziali/uffici — Tab. 2.5.I
let ANA=null;                        // esito dell'ultima analisi: vive solo in memoria

/* parametri sismici del sito: quelli scritti a mano, altrimenti quelli della zona */
function sismaPar(){
  const C=S.strCfg, Z=ZONE_SISM[C.zonaS]||ZONE_SISM['3'];
  const num=(v,d)=>(v===''||v==null||!isFinite(+v)||+v<=0)?d:+v;
  const agV=num(C.agSLV,Z.agSLV), agD=num(C.agSLD,Z.agSLD);
  const F0=num(C.F0,Z.F0), Tc=num(C.TcStar,Z.Tc);
  const cat=C.suolo||'C', tp=C.topo||'T1';
  return {SLV:spettroPar(agV,F0,Tc,cat,tp), SLD:spettroPar(agD,F0,Tc,cat,tp),
          agV,agD,F0,TcStar:Tc,zona:Z,cat,tp};
}
function strBBox(ST){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  ST.pil.forEach(p=>{ x0=Math.min(x0,p.x); x1=Math.max(x1,p.x);
                      y0=Math.min(y0,p.y); y1=Math.max(y1,p.y); });
  if(x0>x1) return {x0:0,y0:0,x1:1,y1:1};
  return {x0,y0,x1:Math.max(x1,x0+0.5),y1:Math.max(y1,y0+0.5)};
}
/* numero di campate del telaio, per il rapporto αu/α1 */
function nCampate(ST,levels){
  const L0=levels[0]; if(!L0) return 1;
  const P=ST.pil.filter(p=>p.liv===L0.id); if(P.length<2) return 1;
  const ux=new Set(P.map(p=>Math.round(p.x*2))).size;
  const uy=new Set(P.map(p=>Math.round(p.y*2))).size;
  return Math.max(1,Math.max(ux,uy)-1);
}

/* ---------- solai ---------- */
function calcSolai(ST,AC){
  ST.solaio.forEach(s=>{
    s.g1=g1Solaio(s); s.g2=AC.g2; s.qk=qkUso(s.uso);
    s.qSlu=slu(s.g1,s.g2,s.qk); s.qSle=sleQp(s.g1,s.g2,s.qk);
    /* travetto in semplice appoggio, larghezza d'influenza 0,50 m */
    const i=0.50, M=s.qSlu*i*s.luce*s.luce/8, V=s.qSlu*i*s.luce/2;
    const fl=armaFlex(M,0.12,s.h);
    s.M=M; s.V=V; s.As=fl.As; s.barre=scegliBarre(fl.As);
    s.snell=s.luce/s.h;
    s.ver=fl.ok&&s.snell<=25;
    s.nota=!fl.ok?'travetto insufficiente'
      :(s.snell>25?'rapporto luce/spessore alto: '+nf(s.snell,1):'');
  });
}
/* ---------- carichi portati da ogni trave ---------- */
function caricaTravi(ST,AC,levels){
  /* Larghezze di influenza: il solaio è ordito in una direzione e scarica sulle travi
     ortogonali. Con la maglia completata più travi attraversano lo stesso vano: ognuna
     prende metà della distanza dalle vicine, così il carico totale torna esatto invece
     di essere contato più volte. */
  const infl=new Map();                                           // idTrave -> [{solaio, larghezza}]
  ST.solaio.forEach(s=>{
    const asseX = s.dir==='x';                                    // orditura lungo x
    const cand=ST.trave.filter(t=>{
      if(t.liv!==s.liv) return false;
      const dx=Math.abs(t.b.x-t.a.x), dy=Math.abs(t.b.y-t.a.y);
      const oriz=dx>=dy;
      if(asseX ? oriz : !oriz) return false;                      // non è di appoggio
      const mx=(t.a.x+t.b.x)/2, my=(t.a.y+t.b.y)/2;
      return mx>=s.bb.x0-0.6&&mx<=s.bb.x1+0.6&&my>=s.bb.y0-0.6&&my<=s.bb.y1+0.6;
    }).map(t=>({t, p: asseX ? (t.a.x+t.b.x)/2 : (t.a.y+t.b.y)/2}))
      .sort((a,b)=>a.p-b.p);
    if(!cand.length) return;
    const lo=asseX?s.bb.x0:s.bb.y0, hi=asseX?s.bb.x1:s.bb.y1;
    cand.forEach((c,i)=>{
      const a=i===0? lo : (cand[i-1].p+c.p)/2;
      const b=i===cand.length-1? hi : (c.p+cand[i+1].p)/2;
      const w=Math.max(0,Math.min(hi,b)-Math.max(lo,a));
      if(w>0){ const arr=infl.get(c.t.id)||[]; arr.push({s,w,t:c.t}); infl.set(c.t.id,arr); }
    });
    /* Il carico va applicato uniforme su tutta la trave: si tarano le larghezze perché
       la somma di w·L restituisca esattamente l'area del solaio, né più né meno.
       Distribuzione un po' approssimata, ma il totale che scende in fondazione è esatto. */
    let cop=0;
    cand.forEach(c=>{ const arr=infl.get(c.t.id)||[];
      const o=arr[arr.length-1]; if(o&&o.s===s) cop+=o.w*c.t.len; });
    if(cop>0.01){ const k=clmp(s.area/cop,0.25,3);
      cand.forEach(c=>{ const arr=infl.get(c.t.id)||[];
