<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MODULO — Onirico Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D0F; --panel:#12161A; --panel2:#171C21; --line:#242C34; --line2:#323C46;
  --txt:#E6E9EC; --mut:#7D8994; --mut2:#59636D;
  --amb:#F2A03D; --amb-d:#8A5A18; --cyn:#48C7D8; --cyn-d:#1B5D67;
  --ok:#6FBF73; --warn:#E0A93B; --err:#E2574C;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'Archivo Narrow','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyn);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
#app{display:grid;height:100%;
  grid-template-columns:64px minmax(0,1fr) 400px;
  grid-template-rows:44px minmax(0,1fr) 34px;
  grid-template-areas:"top top top" "rail stage side" "bar bar bar"}
#top{grid-area:top;border-bottom:1px solid var(--line);background:var(--panel);
  display:flex;align-items:center;gap:14px;padding:0 12px}
#rail{grid-area:rail;border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;padding:8px 0;gap:2px;overflow:auto}
#stage{grid-area:stage;position:relative;background:#0E1114;overflow:hidden}
#side{grid-area:side;border-left:1px solid var(--line);background:var(--panel);
  overflow-y:auto;overflow-x:hidden}
#bar{grid-area:bar;border-top:1px solid var(--line);background:var(--panel);
  display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden}

.brand{font-weight:700;letter-spacing:.16em;font-size:14px}
.brand em{font-style:normal;color:var(--amb)}
.sub{font-family:var(--mono);font-size:10px;color:var(--mut2);letter-spacing:.08em;
  text-transform:uppercase}
.spacer{flex:1}

/* ---------- rail ---------- */
.rb{background:none;border:0;border-left:2px solid transparent;padding:9px 0 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);transition:.12s}
.rb .n{font-family:var(--mono);font-size:9px;letter-spacing:.06em}
.rb .g{font-size:19px;line-height:1}
.rb .l{font-size:9px;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.rb:hover{color:var(--txt);background:var(--panel2)}
.rb.on{color:var(--amb);border-left-color:var(--amb);background:#1A1408}
.rb:disabled{opacity:.3;cursor:not-allowed}

/* ---------- stage ---------- */
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:none;cursor:grab}
#gl.walk{cursor:crosshair}
#hud3d{position:absolute;inset:0;pointer-events:none;display:none;z-index:6}
#hud3d.on{display:block}
#g3dtools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:5px;pointer-events:auto}
#g3dsec{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;pointer-events:auto;
  background:#12161Ae6;border:1px solid var(--line2);border-radius:3px;padding:6px 10px;backdrop-filter:blur(6px)}
#g3dsec .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
#g3dsec input[type=range]{width:150px;accent-color:var(--amb)}
#g3dsec .mono{font-family:var(--mono);font-size:11px;color:var(--amb);min-width:44px;text-align:right}
#g3dmsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
  gap:12px;text-align:center;padding:28px;pointer-events:auto}
#g3dmsg.on{display:flex}
#g3dmsg .big{font-size:20px;font-weight:700}
#g3dmsg .txt{color:var(--mut);max-width:440px;font-size:13px;line-height:1.5}
#g3dtoast{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:var(--mono);font-size:12px;
  color:var(--txt);background:#12161Aee;border:1px solid var(--line2);border-radius:3px;padding:6px 12px;
  opacity:0;transition:.2s;pointer-events:none}
#g3dtoast.on{opacity:1}
#tools{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:5px;z-index:5}
.tool{width:34px;height:34px;border:1px solid var(--line2);background:#12161Ad9;color:var(--mut);
  border-radius:3px;cursor:pointer;font-size:15px;backdrop-filter:blur(6px)}
.tool:hover{color:var(--txt);border-color:var(--mut)}
.tool.on{background:var(--amb);color:#0B0D0F;border-color:var(--amb)}
#hint{position:absolute;left:52px;top:12px;z-index:5;font-family:var(--mono);font-size:11px;
  color:var(--amb);background:#12161Ae6;border:1px solid var(--amb-d);padding:5px 9px;border-radius:3px;
  max-width:340px;display:none}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;text-align:center;padding:24px;z-index:4}
#drop.hide{display:none}
#drop .big{font-size:26px;font-weight:700;letter-spacing:.04em}
#drop .txt{color:var(--mut);max-width:420px;font-size:14px}
.dz{border:1px dashed var(--line2);border-radius:4px;padding:26px 34px;transition:.15s}
.dz.hot{border-color:var(--amb);background:#F2A03D14}
#scalebar{position:absolute;right:12px;bottom:12px;z-index:5;font-family:var(--mono);font-size:10px;
  color:var(--mut);display:flex;align-items:center;gap:7px}
#scalebar .ln{height:5px;border:1px solid var(--mut);border-top:0;width:80px}

/* ---------- side panels ---------- */
.pane{display:none;padding:14px}
.pane.on{display:block}
.ph{display:flex;align-items:baseline;gap:8px;margin:0 0 3px}
.ph h2{margin:0;font-size:17px;font-weight:700;letter-spacing:.03em}
.ph .idx{font-family:var(--mono);font-size:10px;color:var(--amb)}
.pd{color:var(--mut);font-size:13px;margin:0 0 14px;line-height:1.4}

.sec{border-top:1px solid var(--line);padding-top:11px;margin-top:15px}
.sec>h3{margin:0 0 9px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mut);font-weight:600}

.row{display:flex;gap:7px;align-items:center}
.row+.row{margin-top:6px}
label.f{display:block;margin-bottom:8px}
label.f>span{display:block;font-family:var(--mono);font-size:10px;color:var(--mut);
  letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
input,select,textarea{width:100%;background:#0C0F12;border:1px solid var(--line2);border-radius:3px;
  padding:6px 8px;color:var(--txt)}
input[type=number],.num{font-family:var(--mono)}
input:focus,select:focus{border-color:var(--cyn);outline:none}
select{cursor:pointer}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}
.chk input{width:auto}

.btn{background:#1B2127;border:1px solid var(--line2);border-radius:3px;padding:7px 12px;
  cursor:pointer;font-weight:600;font-size:13px;letter-spacing:.02em;transition:.12s}
.btn:hover{border-color:var(--mut);background:#232A31}
.btn.pri{background:var(--amb);border-color:var(--amb);color:#0B0D0F}
.btn.pri:hover{background:#FFB554}
.btn.cy{background:none;border-color:var(--cyn-d);color:var(--cyn)}
.btn.cy:hover{border-color:var(--cyn)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.w{width:100%}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mut);text-align:left;font-weight:500;padding:0 5px 5px;border-bottom:1px solid var(--line)}
td{padding:5px;border-bottom:1px solid #1A2026;vertical-align:middle}
td.n{font-family:var(--mono);text-align:right}
tr.sel td{background:#F2A03D1a}
tr.clk{cursor:pointer}
tr.clk:hover td{background:#1A2026}
td input,td select{padding:3px 5px;font-size:12px}

.tag{font-family:var(--mono);font-size:9px;letter-spacing:.07em;padding:2px 5px;border-radius:2px;
  border:1px solid;text-transform:uppercase;white-space:nowrap}
.tag.ok{color:var(--ok);border-color:#2E5A31}
.tag.warn{color:var(--warn);border-color:#5B4718}
.tag.err{color:var(--err);border-color:#5E2621}
.tag.neu{color:var(--mut);border-color:var(--line2)}
.tag.cy{color:var(--cyn);border-color:var(--cyn-d)}

.note{border-left:2px solid var(--amb);background:#F2A03D0f;padding:8px 10px;font-size:12.5px;
  color:#D8C9AE;margin:10px 0;line-height:1.45}
.note.cy{border-color:var(--cyn);background:#48C7D80f;color:#B5D9DE}
.note.er{border-color:var(--err);background:#E2574C12;color:#E5B2AD}
.note b{color:var(--txt)}

.card{border:1px solid var(--line);border-radius:3px;padding:9px;margin-bottom:8px;background:var(--panel2)}
.card.sel{border-color:var(--amb)}
.ttl{font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:6px}
.kv{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;
  color:var(--mut);padding:1px 0}
.kv b{color:var(--txt);font-weight:500}
.empty{color:var(--mut2);font-size:13px;text-align:center;padding:22px 10px;
  border:1px dashed var(--line);border-radius:3px}

/* ---------- verify bar (signature) ---------- */
.vchip{display:flex;align-items:center;gap:7px;padding:0 13px;border-right:1px solid var(--line);
  white-space:nowrap;cursor:pointer;transition:.12s}
.vchip:hover{background:var(--panel2)}
.vchip .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--mut2)}
.vchip.ok .dot{background:var(--ok)} .vchip.warn .dot{background:var(--warn)}
.vchip.err .dot{background:var(--err);box-shadow:0 0 7px #E2574C99}
.vchip .k{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.vchip .v{font-family:var(--mono);font-size:11.5px;font-weight:600}
.vchip.ok .v{color:var(--ok)} .vchip.warn .v{color:var(--warn)} .vchip.err .v{color:var(--err)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:#04060899;backdrop-filter:blur(3px);z-index:50;
  display:none;align-items:center;justify-content:center;padding:18px}
#modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:4px;max-width:660px;
  width:100%;max-height:86vh;overflow:auto;padding:18px}
.mbox h3{margin:0 0 4px;font-size:17px}

/* ---------- responsive ---------- */
@media(max-width:1100px){#app{grid-template-columns:56px minmax(0,1fr) 330px}}
@media(max-width:840px){
  #app{grid-template-columns:1fr;grid-template-rows:44px 42vh minmax(0,1fr) 34px;
    grid-template-areas:"top" "stage" "side" "bar"}
  #rail{grid-area:top;flex-direction:row;border-right:0;padding:0;justify-content:space-around;
    position:fixed;left:0;right:0;top:44px;height:46px;z-index:20;border-bottom:1px solid var(--line)}
  .rb{padding:4px 6px;border-left:0;border-bottom:2px solid transparent;flex:1}
  .rb.on{border-left-color:transparent;border-bottom-color:var(--amb)}
  .rb .l{display:none}
  #stage{margin-top:46px}
  #side{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">

<header id="top">
  <div class="brand">MODULO<em>.</em></div>
  <div class="sub">Calcolatore Studio</div>
  <div class="spacer"></div>
  <button class="btn sm" id="bSave">Salva progetto</button>
  <button class="btn sm" id="bLoad">Apri progetto</button>
</header>

<nav id="rail" role="tablist"></nav>

<main id="stage">
  <canvas id="cv"></canvas>
  <canvas id="gl"></canvas>
  <div id="hud3d">
    <div id="g3dtools">
      <button class="tool" id="bFit3D" title="Inquadra l'edificio">⤢</button>
      <button class="tool" id="bWalk" title="Cammina dentro (prima persona)">🚶</button>
    </div>
    <div id="g3dsec">
      <span class="lbl">Sezione</span>
      <input type="range" id="secR" min="0" max="100" value="100">
      <span id="secV" class="mono">—</span>
    </div>
    <div id="g3dmsg"></div>
    <div id="g3dtoast"></div>
  </div>
  <div id="tools">
    <button class="tool on" data-tool="pan" title="Sposta e ingrandisci">✥</button>
    <button class="tool" data-tool="pick" title="Seleziona vano">▣</button>
    <button class="tool" data-tool="cut" title="Traccia divisione vani">╱</button>
    <button class="tool" data-tool="del" title="Elimina divisione">⌫</button>
    <button class="tool" id="bFit" title="Adatta alla finestra">⤢</button>
  </div>
  <div id="hint"></div>
  <div id="scalebar"><span id="scaleTxt">—</span><span class="ln"></span></div>
  <div id="drop">
    <div class="dz" id="dz">
      <div class="big">Carica una pianta DXF</div>
      <div class="txt">Trascina qui il file, o toccalo per sceglierlo. Restano tutti in locale:
        nessun dato lascia questo dispositivo.</div>
      <div style="margin-top:14px"><button class="btn pri" id="bPick">Scegli file DXF</button>
      <button class="btn cy" id="bDemo">Apri pianta di prova</button></div>
    </div>
  </div>
</main>

<aside id="side"></aside>
<footer id="bar"></footer>
</div>

<div id="modal"><div class="mbox" id="mbox"></div></div>
<input type="file" id="fDxf" accept=".dxf" style="display:none">
<input type="file" id="fJson" accept=".json" style="display:none">
<script>
/* ==================== CORE START ====================
   Funzioni pure, senza DOM. Testate separatamente.
   ==================================================== */

/* ---------- 1. PARSER DXF ASCII ---------- */
const ENT_TYPES = ['LINE','LWPOLYLINE','POLYLINE','VERTEX','SEQEND','ARC','CIRCLE',
                   'TEXT','MTEXT','INSERT','POINT','ELLIPSE','SOLID'];

function parseDXF(text){
  const raw = text.split(/\r\n|\r|\n/);
  const P = [];
  for(let i=0;i+1<raw.length;i+=2){
    const c = parseInt(raw[i].trim(),10);
    if(Number.isNaN(c)) continue;
    P.push([c, raw[i+1]===undefined?'':raw[i+1].trim()]);
  }
  const layers = {}, blocks = {}, entities = [];
  let sect = null, target = entities, blk = null;
  let ent = null, poly = null, tbl = null;

  const flush = ()=>{
    if(!ent) return;
    if(ent.type==='VERTEX'){
      if(poly) poly.pts.push({x:ent._x||0,y:ent._y||0,b:ent._bulge||0});
    } else if(ent.type==='SEQEND'){
      if(poly){ target.push(poly); poly=null; }
    } else if(ent.type==='POLYLINE'){
      poly = ent; poly.pts = [];
    } else {
      target.push(ent);
    }
    ent = null;
  };

  for(let i=0;i<P.length;i++){
    const [c,v] = P[i];
    if(c===0){
      flush();
      if(tbl && tbl.name) layers[tbl.name]=tbl;   // chiude sempre la voce LAYER precedente
      tbl = null;
      if(v==='SECTION'){ sect = (P[i+1]&&P[i+1][0]===2)?P[i+1][1]:null; continue; }
      if(v==='ENDSEC'){ sect=null; blk=null; poly=null; target=entities; continue; }
      if(sect==='BLOCKS' && v==='BLOCK'){ blk={name:'',base:{x:0,y:0},ents:[]}; target=blk.ents; continue; }
      if(sect==='BLOCKS' && v==='ENDBLK'){ if(blk&&blk.name) blocks[blk.name]=blk; blk=null; target=entities; continue; }
      if(sect==='TABLES' && v==='LAYER'){ tbl={name:'',color:7}; continue; }
      if((sect==='ENTITIES'||sect==='BLOCKS') && ENT_TYPES.includes(v)){
        ent = {type:v,layer:'0',pts:[]};
      }
      continue;
    }
    if(tbl){ if(c===2) tbl.name=v; else if(c===62) tbl.color=parseInt(v,10)||7; continue; }
    if(blk && !ent){ if(c===2&&!blk.name) blk.name=v; else if(c===10) blk.base.x=+v;
      else if(c===20) blk.base.y=+v; continue; }
    if(!ent) continue;
    const t = ent.type;
    switch(c){
      case 8: ent.layer=v; break;
      case 2: ent.name=v; break;
      case 1: ent.text=v; break;
      case 10:
        if(t==='LWPOLYLINE') ent.pts.push({x:+v,y:0,b:0}); else ent._x=+v;
        break;
      case 20:
        if(t==='LWPOLYLINE'){ if(ent.pts.length) ent.pts[ent.pts.length-1].y=+v; }
        else ent._y=+v;
        break;
      case 11: ent._x2=+v; break;
      case 21: ent._y2=+v; break;
      case 40: ent.r=+v; ent.h=+v; break;
      case 41: if(t==='INSERT') ent.sx=+v; break;
      case 42:
        if(t==='LWPOLYLINE'){ if(ent.pts.length) ent.pts[ent.pts.length-1].b=+v; }
        else if(t==='VERTEX') ent._bulge=+v;
        else if(t==='INSERT') ent.sy=+v;
        break;
      case 50: ent.a1=+v; ent.rot=+v; break;
      case 51: ent.a2=+v; break;
      case 70: ent.flag=parseInt(v,10)||0; break;
    }
  }
  flush();
  if(poly) entities.push(poly);
  if(tbl&&tbl.name) layers[tbl.name]=tbl;
  entities.forEach(e=>{ if(!layers[e.layer]) layers[e.layer]={name:e.layer,color:7}; });
  return {layers,blocks,entities};
}

/* ---------- 2. GEOMETRIA: entità -> polilinee ---------- */
function bulgeArc(p0,p1,b){
  if(!b) return [];
  const th = 4*Math.atan(b);
  const dx=p1.x-p0.x, dy=p1.y-p0.y, ch=Math.hypot(dx,dy);
  if(ch<1e-12) return [];
  const r = ch/(2*Math.sin(Math.abs(th)/2));
  const d = r*Math.cos(th/2);
  const mx=(p0.x+p1.x)/2, my=(p0.y+p1.y)/2;
  const nx=-dy/ch, ny=dx/ch;
  const cx=mx+nx*d*Math.sign(th), cy=my+ny*d*Math.sign(th);
  let a0=Math.atan2(p0.y-cy,p0.x-cx), a1=Math.atan2(p1.y-cy,p1.x-cx);
  let sw=a1-a0;
  while(sw> Math.PI) sw-=2*Math.PI;
  while(sw<-Math.PI) sw+=2*Math.PI;
  if(Math.sign(sw)!==Math.sign(th)) sw += 2*Math.PI*Math.sign(th);
  const n = Math.max(2, Math.ceil(Math.abs(sw)/0.20));
  const out=[];
  for(let i=1;i<n;i++){ const a=a0+sw*i/n; out.push({x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)}); }
  return out;
}
function samplePts(pts, closed){
  const out=[];
  const n=pts.length;
  for(let i=0;i<n;i++){
    const p=pts[i]; out.push({x:p.x,y:p.y});
    const j=i+1;
    if(j<n) out.push(...bulgeArc(p,pts[j],p.b||0));
    else if(closed && n>2) out.push(...bulgeArc(p,pts[0],p.b||0));
  }
  return out;
}
function xf(p,t){
  const c=Math.cos(t.rot), s=Math.sin(t.rot);
  const x=p.x*t.sx, y=p.y*t.sy;
  return {x:t.x + x*c - y*s, y:t.y + x*s + y*c};
}
const ID_XF = {x:0,y:0,rot:0,sx:1,sy:1};

/** Restituisce [{layer, closed, pts:[{x,y}], kind}] */
function toPolys(dxf, ent, t, depth){
  t = t||ID_XF; depth = depth||0;
  const L = ent.layer, out=[];
  const map = a => a.map(p=>xf(p,t));
  switch(ent.type){
    case 'LINE':
      out.push({layer:L,closed:false,kind:'line',
        pts:map([{x:ent._x||0,y:ent._y||0},{x:ent._x2||0,y:ent._y2||0}])}); break;
    case 'LWPOLYLINE': case 'POLYLINE': {
      const cl = !!(ent.flag&1);
      if(ent.pts.length>1) out.push({layer:L,closed:cl,kind:'poly',pts:map(samplePts(ent.pts,cl))});
      break; }
    case 'ARC': {
      const a0=(ent.a1||0)*Math.PI/180, a1=(ent.a2||0)*Math.PI/180;
      let sw=a1-a0; if(sw<=0) sw+=2*Math.PI;
      const n=Math.max(3,Math.ceil(sw/0.15)), p=[];
      for(let i=0;i<=n;i++){const a=a0+sw*i/n;
        p.push({x:(ent._x||0)+ent.r*Math.cos(a), y:(ent._y||0)+ent.r*Math.sin(a)});}
      out.push({layer:L,closed:false,kind:'arc',pts:map(p)}); break; }
    case 'CIRCLE': {
      const p=[]; for(let i=0;i<40;i++){const a=i/40*2*Math.PI;
        p.push({x:(ent._x||0)+ent.r*Math.cos(a), y:(ent._y||0)+ent.r*Math.sin(a)});}
      out.push({layer:L,closed:true,kind:'poly',pts:map(p)}); break; }
    case 'SOLID':
      if(ent.pts.length>2) out.push({layer:L,closed:true,kind:'poly',pts:map(ent.pts)}); break;
    case 'INSERT': {
      if(depth>4) break;
      const b = dxf.blocks[ent.name]; if(!b) break;
      const nt = {x:(ent._x||0), y:(ent._y||0), rot:(ent.rot||0)*Math.PI/180,
                  sx:(ent.sx===undefined?1:ent.sx), sy:(ent.sy===undefined?1:ent.sy)};
      const comp = {x:0,y:0,rot:0,sx:1,sy:1};
      for(const be of b.ents){
        const sub = toPolys(dxf, be, comp, depth+1);
        for(const s of sub){
          s.pts = s.pts.map(p=>xf(xf({x:p.x-b.base.x,y:p.y-b.base.y},nt),t));
          s.layer = (be.layer==='0')? L : be.layer;
          out.push(s);
        }
      }
      break; }
  }
  return out;
}
function polyBBox(polys){
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  for(const g of polys) for(const p of g.pts){
    if(p.x<x0)x0=p.x; if(p.y<y0)y0=p.y; if(p.x>x1)x1=p.x; if(p.y>y1)y1=p.y; }
  if(x0>x1) return null;
  return {x0,y0,x1,y1,w:x1-x0,h:y1-y0};
}
function shoelace(pts){
  let a=0; for(let i=0,n=pts.length;i<n;i++){const p=pts[i],q=pts[(i+1)%n]; a+=p.x*q.y-q.x*p.y;}
  return Math.abs(a)/2;
}

/* ---------- 3. FLOOD FILL VANI (griglia booleana) ---------- */
/** grid: Uint8Array (1 = barriera). Ritorna componenti interne, esterno escluso. */
function floodRooms(grid,W,H,px,minArea){
  minArea = minArea===undefined?0.5:minArea;
  const lab = new Int32Array(W*H).fill(-1);
  const stack = new Int32Array(W*H);
  let sp=0, next=0;
  const comps=[];
  // 1. marca l'esterno partendo dai bordi
  const seedEdge=(i)=>{ if(grid[i]===0&&lab[i]===-1){ lab[i]=0; stack[sp++]=i; } };
  for(let x=0;x<W;x++){ seedEdge(x); seedEdge((H-1)*W+x); }
  for(let y=0;y<H;y++){ seedEdge(y*W); seedEdge(y*W+W-1); }
  const run=(id)=>{
    let n=0,sx=0,sy=0,minx=W,maxx=0,miny=H,maxy=0;
    while(sp>0){
      const i=stack[--sp]; const x=i%W, y=(i-x)/W;
      n++; sx+=x; sy+=y;
      if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y;
      if(x>0){const j=i-1; if(grid[j]===0&&lab[j]===-1){lab[j]=id;stack[sp++]=j;}}
      if(x<W-1){const j=i+1; if(grid[j]===0&&lab[j]===-1){lab[j]=id;stack[sp++]=j;}}
      if(y>0){const j=i-W; if(grid[j]===0&&lab[j]===-1){lab[j]=id;stack[sp++]=j;}}
      if(y<H-1){const j=i+W; if(grid[j]===0&&lab[j]===-1){lab[j]=id;stack[sp++]=j;}}
    }
    return {n,cx:sx/n,cy:sy/n,minx,maxx,miny,maxy};
  };
  run(0);
  next=1;
  for(let i=0;i<W*H;i++){
    if(grid[i]===0&&lab[i]===-1){
      const id=next++; lab[i]=id; stack[sp++]=i;
      const r=run(id);
      comps.push({id, px:r.n, area:r.n*px*px, cx:r.cx, cy:r.cy,
        bb:{minx:r.minx,maxx:r.maxx,miny:r.miny,maxy:r.maxy}});
    }
  }
  const keep = comps.filter(c=>c.area>=minArea);
  return {labels:lab, comps:keep, dropped:comps.length-keep.length};
}
/** perimetro approssimato di una componente: conta i lati di bordo */
function compPerimeter(lab,W,H,id,px){
  let e=0;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const i=y*W+x; if(lab[i]!==id) continue;
    if(x===0||lab[i-1]!==id) e++;
    if(x===W-1||lab[i+1]!==id) e++;
    if(y===0||lab[i-W]!==id) e++;
    if(y===H-1||lab[i+W]!==id) e++;
  }
  return e*px;
}

/* ---------- 4. TERMICA ---------- */
/* Resistenze superficiali UNI EN ISO 6946 (tab. 7) */
const RS = {
  oriz:{si:0.13,se:0.04},   // flusso orizzontale — pareti verticali
  asc: {si:0.10,se:0.04},   // flusso ascendente — copertura, solaio verso l'alto
  disc:{si:0.17,se:0.04}    // flusso discendente — pavimento su ambiente non riscaldato
};
function surfaceR(flusso,interno){
  const r = RS[flusso]||RS.oriz;
  return interno ? {si:r.si, se:r.si} : {si:r.si, se:r.se};
}
/** strati: [{s(m), lambda(W/mK), rho(kg/m3), c(J/kgK), R(opz. per intercapedini), intonaco:bool}] */
function calcU(strati, flusso, interno){
  const r = surfaceR(flusso,interno);
  let Rs = 0, sTot = 0, Ms = 0, MsNoInt = 0;
  for(const L of strati){
    const s = +L.s||0;
    Rs += (L.R!==undefined && L.R!==null && L.R!=='') ? +L.R : (L.lambda>0 ? s/L.lambda : 0);
    sTot += s;
    const m = s*(+L.rho||0);
    Ms += m; if(!L.intonaco) MsNoInt += m;
  }
  const Rtot = r.si + Rs + r.se;
  return {R:Rs, Rtot, U:Rtot>0?1/Rtot:0, spessore:sTot, Ms, MsNoInt, Rsi:r.si, Rse:r.se};
}
/* aritmetica complessa minima */
const C=(re,im)=>({re,im:im||0});
const cmul=(a,b)=>C(a.re*b.re-a.im*b.im, a.re*b.im+a.im*b.re);
const cabs=a=>Math.hypot(a.re,a.im);
const carg=a=>Math.atan2(a.im,a.re);
function mm(A,B){
  const R=[[C(0),C(0)],[C(0),C(0)]];
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){
    let re=0,im=0;
    for(let k=0;k<2;k++){ re+=A[i][k].re*B[k][j].re-A[i][k].im*B[k][j].im;
                          im+=A[i][k].re*B[k][j].im+A[i][k].im*B[k][j].re; }
    R[i][j]=C(re,im);
  }
  return R;
}
/** Matrice di trasferimento complessa dell'intero componente (ISO 13786, T = 24 h) */
function zMatrix(strati, flusso, interno){
  const T = 86400;
  const r = surfaceR(flusso,interno);
  const Rlayer = R => [[C(1),C(-R)],[C(0),C(1)]];
  let Z = Rlayer(r.si);                       // da interno verso esterno
  for(const L of strati){
    const s=+L.s||0, lam=+L.lambda||0, rho=+L.rho||0, cp=+L.c||0;
    if(!(s>0) || !(lam>0) || !(rho>0) || !(cp>0)){
      const R = (L.R!==undefined&&L.R!==null&&L.R!=='')?+L.R : (lam>0? s/lam : 0);
      Z = mm(Z, Rlayer(R)); continue;
    }
    const d = Math.sqrt(lam*T/(Math.PI*rho*cp));   // profondità di penetrazione
    const x = s/d;
    const ch=Math.cosh(x), sh=Math.sinh(x), co=Math.cos(x), si=Math.sin(x);
    const k1 = d/(2*lam), k2 = lam/d;
    const Z11 = C(ch*co, sh*si);
    const Z12 = C(-k1*(sh*co+ch*si), -k1*(ch*si-sh*co));
    const Z21 = C(-k2*(sh*co-ch*si), -k2*(sh*co+ch*si));
    Z = mm(Z, [[Z11,Z12],[Z21,Z11]]);
  }
  Z = mm(Z, Rlayer(r.se));
  return Z;
}
/** Yie = -1/Z12 */
function yie(strati, flusso, interno){
  const z = zMatrix(strati,flusso,interno)[0][1];
  const m2 = Math.max(z.re*z.re + z.im*z.im, 1e-24);
  return C(-z.re/m2, z.im/m2);
}
/** UNI EN ISO 13786 — trasmittanza periodica, sfasamento, fattore di attenuazione.
    La fase è srotolata partendo da spessore nullo (ritardo = 0) per evitare
    l'ambiguità dell'argomento principale oltre le 12 h. */
function calcDynamic(strati, flusso, interno, U){
  const w = yie(strati,flusso,interno);
  const Yie = cabs(w);
  const N = 60;
  let prev = 0, acc = 0;
  for(let k=1;k<=N;k++){
    const t = k/N;
    const sc = strati.map(L=>{
      const o = Object.assign({},L); o.s = (+L.s||0)*t;
      if(o.R!==undefined && o.R!==null && o.R!=='') o.R = (+o.R)*t;
      return o;
    });
    const ph = carg(yie(sc,flusso,interno));
    let d = ph - prev;
    while(d> Math.PI) d -= 2*Math.PI;
    while(d<-Math.PI) d += 2*Math.PI;
    acc += d; prev = ph;
  }
  const sf = -(86400/(2*Math.PI))*acc/3600;   // acc negativo = ritardo positivo
  return {Yie, sfasamento:Math.max(0,sf), attenuazione: U>0? Yie/U : 0};
}

/* ---------- disegno ---------- */
function draw(){
  if(!ctx) return;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#0E1114'; ctx.fillRect(0,0,cv.width,cv.height);
  if(!S.polys.length){ scaleBar(); return; }
  // vani
  if(S.roomImg && S.gw){
    const a=W2S({x:S.gx0,y:S.gy0+S.gh*S.px}), b=W2S({x:S.gx0+S.gw*S.px,y:S.gy0});
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(S.roomImg,a.x,a.y,b.x-a.x,b.y-a.y);
    ctx.imageSmoothingEnabled=true;
  }
  // geometria
  const byRole={};
  for(const g of S.polys){ const r=S.layerMap[g.layer]||'IGN'; (byRole[r]=byRole[r]||[]).push(g); }
  for(const r of ['IGN','TRA','SCA','CTS','RIV','ISO','MUR_INT','MUR_EST','PIL','VANI','POR','FIN']){
    const arr=byRole[r]; if(!arr) continue;
    const st=RUOLI[r];
    ctx.strokeStyle=st.c; ctx.fillStyle=st.c+'22';
    ctx.lineWidth=(r==='POR'||r==='FIN')?2*DPR:(r==='IGN'?1*DPR:1.4*DPR);
    for(const g of arr){
      ctx.beginPath();
      g.pts.forEach((p,i)=>{const q=W2S(p); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});
      if(g.closed) ctx.closePath();
      if(g.closed && (r==='MUR_EST'||r==='MUR_INT'||r==='PIL')) ctx.fill();
      ctx.stroke();
    }
  }
  // divisioni manuali
  ctx.strokeStyle='#F2A03D'; ctx.lineWidth=3*DPR; ctx.setLineDash([7*DPR,5*DPR]);
  for(const c of S.cuts){ const a=W2S(c.a),b=W2S(c.b);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke(); }
  if(S.cutA&&S.cutB){ const a=W2S(S.cutA),b=W2S(S.cutB);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke(); }
  ctx.setLineDash([]);
  // etichette vani
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const rm of S.rooms){
    const p=W2S({x:S.gx0+rm.cx*S.px, y:S.gy0+(S.gh-rm.cy)*S.px});
    const on=S.sel===rm.id;
    ctx.font=`600 ${12*DPR}px 'Archivo Narrow',sans-serif`;
    ctx.fillStyle=on?'#F2A03D':'#E6E9EC';
    ctx.fillText(rm.nome,p.x,p.y-7*DPR);
    ctx.font=`${11*DPR}px 'IBM Plex Mono',monospace`;
    ctx.fillStyle=on?'#F2A03D':'#7D8994';
    ctx.fillText(nf(rm.area)+' m²',p.x,p.y+8*DPR);
  }

  if(typeof drawInfNumbers==='function' && S.pane===4) drawInfNumbers();
  scaleBar();
}
function drawInfNumbers(){

function scaleBar(){

/* ---------- rasterizzazione + rilevamento vani ---------- */
function detectRooms(){
  if(!S.bbox) return;
  const px=S.cfg.px, pad=6;
  let gw=Math.ceil(S.bbox.w/px)+pad*2, gh=Math.ceil(S.bbox.h/px)+pad*2;
  const MAXPX=7e6;
  if(gw*gh>MAXPX){
    const k=Math.sqrt(gw*gh/MAXPX);
    S.cfg.px=+(px*k).toFixed(3);
    return detectRooms();
  }
  const P=S.cfg.px;
  S.gw=gw; S.gh=gh; S.px=P;
  S.gx0=S.bbox.x0-pad*P; S.gy0=S.bbox.y0-pad*P;
  const oc=document.createElement('canvas'); oc.width=gw; oc.height=gh;
  const o=oc.getContext('2d',{willReadFrequently:true});
  o.fillStyle='#000'; o.fillRect(0,0,gw,gh);
  o.strokeStyle='#fff'; o.fillStyle='#fff'; o.lineJoin='round'; o.lineCap='round';
  const G=p=>({x:(p.x-S.gx0)/P, y:gh-(p.y-S.gy0)/P});
  let barrier=0;
  for(const g of S.polys){
    const role=S.layerMap[g.layer]||'IGN';
    if(!RUOLI[role]||!RUOLI[role].bar) continue;
    barrier++;
    o.beginPath();
    g.pts.forEach((p,i)=>{const q=G(p); i?o.lineTo(q.x,q.y):o.moveTo(q.x,q.y);});
    if(g.closed){
      // poligono chiuso = ingombro reale: solo riempimento, nessun tratto che lo dilati
      o.closePath(); o.fill();
      if(role==='POR'||role==='FIN'){ o.lineWidth=3; o.stroke(); }
    } else {
      // polilinea aperta: il tratto E' lo spessore. Minimo 2 px per sopravvivere alla soglia
      o.lineWidth=(role==='POR'||role==='FIN')?3:2;
      o.stroke();
    }
  }
  o.lineWidth=Math.max(3,0.08/P);
  for(const c of S.cuts){ const a=G(c.a),b=G(c.b);
    o.beginPath();o.moveTo(a.x,a.y);o.lineTo(b.x,b.y);o.stroke(); }
  const im=o.getImageData(0,0,gw,gh).data;
  const grid=new Uint8Array(gw*gh);
  for(let i=0,j=0;i<grid.length;i++,j+=4) grid[i]=im[j]>=128?1:0;
  const res=floodRooms(grid,gw,gh,P,S.cfg.minArea);
  S.grid=grid; S.labels=res.labels;
  // mantieni nomi/tipi già assegnati agganciandoli al centroide più vicino
  const old=S.rooms;
  S.rooms=res.comps.map(c=>{
    const prev=old.find(r=>Math.hypot(r.cx-c.cx,r.cy-c.cy)<Math.max(8,0.5/P));
    return {id:c.id, lab:c.id, area:c.area, cx:c.cx, cy:c.cy, px:c.px,
      nome:prev?prev.nome:'Vano '+c.id, tipo:prev?prev.tipo:'ab',
      hOver:prev?prev.hOver:null, liv:prev?prev.liv:(S.livelli[0]&&S.livelli[0].id)};
  });
  // superficie lorda: tutto ciò che non è esterno
  let inner=0; for(let i=0;i<res.labels.length;i++) if(res.labels[i]!==0) inner++;
  S.lorda=inner*P*P;
  S.dropped=res.dropped; S.barriers=barrier;
  paintRooms(); assignInfissi();
}
function paintRooms(){
  if(!S.labels) return;
  const oc=document.createElement('canvas'); oc.width=S.gw; oc.height=S.gh;
  const o=oc.getContext('2d');
  const im=o.createImageData(S.gw,S.gh), d=im.data;
  const selLab=S.sel!=null?(S.rooms.find(r=>r.id===S.sel)||{}).lab:null;
  const set=new Map(S.rooms.map(r=>[r.lab,r]));
  for(let i=0,j=0;i<S.labels.length;i++,j+=4){
    const L=S.labels[i];
    if(L>0 && set.has(L)){
      const on=L===selLab;
      d[j]=242; d[j+1]=on?160:150; d[j+2]=on?61:90; d[j+3]=on?92:40;
    }
  }
  o.putImageData(im,0,0);
  S.roomImg=oc;
}

/* ---------- infissi ---------- */
function polyLen(g){ let L=0; for(let i=1;i<g.pts.length;i++) L+=Math.hypot(g.pts[i].x-g.pts[i-1].x,g.pts[i].y-g.pts[i-1].y);
  return g.closed&&g.pts.length>2 ? L+Math.hypot(g.pts[0].x-g.pts[g.pts.length-1].x,g.pts[0].y-g.pts[g.pts.length-1].y) : L; }
function polyMid(g){ let x=0,y=0; g.pts.forEach(p=>{x+=p.x;y+=p.y}); return {x:x/g.pts.length,y:y/g.pts.length}; }
function polySpan(g){ const b=polyBBox([g]); return Math.hypot(b.w,b.h); }
function detectInfissi(){
  const old=S.infissi;
  S.infissi=[];
  S.polys.forEach((g,i)=>{
    const r=S.layerMap[g.layer];
    if(r!=='POR'&&r!=='FIN') return;
    const prev=old.find(o=>o.pi===i);
    const ax=rectAxis(g.pts);            // larghezza reale = lato lungo del rettangolo (non la diagonale)
    S.infissi.push({id:uid(), pi:i, kind:r==='POR'?'por':'fin', layer:g.layer,
      lb:+((ax?ax.len:polySpan(g))).toFixed(3), mid:polyMid(g),
      tipo:prev?prev.tipo:null, hOver:prev?prev.hOver:null, room:null});
  });
  // numerazione stabile: F1,F2… per le finestre; P1,P2… per le porte
  let np=0,nf=0; S.infissi.forEach(f=>{ f.num = f.kind==='por'?('P'+(++np)):('F'+(++nf)); });
  autoTipo(); assignInfissi();
}
function autoTipo(){
  // auto-assegna solo tipi "primari" (finestra/porta a battente): mai portafinestra/scorrevole a caso
  const AUTO=t=>!t.sub||t.sub==='finestra'||t.sub==='battente';
  for(const f of S.infissi){
    if(f.tipo) continue;
    const cand=S.tipi.filter(t=>t.kind===f.kind && AUTO(t));
    if(!cand.length) continue;
    let best=cand[0],bd=1e9;
    for(const t of cand){ const d=Math.abs((+t.lb||0)-f.lb); if(d<bd){bd=d;best=t;} }
    f.tipo=bd<=0.35?best.id:null;
  }
}
function labAt(gx,gy){
  if(!S.labels) return 0;
  const x=Math.round(gx), y=Math.round(gy);
  if(x<0||y<0||x>=S.gw||y>=S.gh) return 0;
  return S.labels[y*S.gw+x];
}
function assignInfissi(){
  if(!S.labels) return;
  for(const f of S.infissi){
    const gx=(f.mid.x-S.gx0)/S.px, gy=S.gh-(f.mid.y-S.gy0)/S.px;
    let found=0;
    for(let r=1;r<=Math.ceil(0.9/S.px)&&!found;r++){
      for(let a=0;a<16&&!found;a++){
        const t=a/16*2*Math.PI;
        const L=labAt(gx+r*Math.cos(t), gy+r*Math.sin(t));
        if(L>0 && S.rooms.some(rm=>rm.lab===L)) found=L;
      }
    }
    f.room=found||null;
  }
}

/* ---------- calcoli ---------- */
function livOf(rm){ return S.livelli.find(l=>l.id===rm.liv)||S.livelli[0]; }
function strOf(id){ return S.strati.find(s=>s.id===id)||null; }
function spess(st){ return st? st.strati.reduce((a,l)=>a+(+l.s||0),0) : 0; }
function hNetta(rm){
  if(rm.hOver) return +rm.hOver;
  const L=livOf(rm); if(!L) return 0;
  return Math.max(0,(+L.h||0)-spess(strOf(L.solaio))-spess(strOf(L.pav)));
}
function volume(rm){ return rm.area*hNetta(rm); }
function tipoOf(f){ return S.tipi.find(t=>t.id===f.tipo)||null; }
/* altezza/larghezza/parapetto effettivi di un infisso: override per pezzo, poi tipo, poi default */
function infH(f){ if(f.hOver!=null&&f.hOver!=='') return +f.hOver; const t=tipoOf(f); return (t&&+t.h)||(f.kind==='fin'?1.4:2.1); }
function infW(f){ const t=tipoOf(f); return (t&&+t.lb)||f.lb||(f.kind==='fin'?1.2:0.8); }
function infSill(f){ const t=tipoOf(f); return f.kind==='fin'?((t&&t.par!=null)?+t.par:0.9):0; }
/* Uw stimato da telaio (Uf) e vetro (Ug) — UNI EN ISO 10077 semplificato; override manuale se t.Uw */
function estUw(t){ const tf=TELAI[t&&t.telaio]; if(!tf) return null; const vg=VETRI[t&&t.vetro];
  if(!vg||vg.ug==null) return +tf.uf.toFixed(2); return +(0.7*vg.ug+0.3*tf.uf+0.1).toFixed(2); }
function uwOf(t){ if(!t) return null; if(t.Uw!=null&&t.Uw!=='') return +t.Uw; return estUw(t); }
/* raggruppa gli infissi per l'abaco (per tipo, o per kind+dimensioni se senza tipo) */
function infGroups(){ const map=new Map();
  S.infissi.forEach(f=>{ const t=tipoOf(f), w=Math.round(f.lb*100), hh=Math.round(infH(f)*100);
    const key=(t?('t'+t.id):('k'+f.kind))+'_'+w+'x'+hh;   // raggruppa per tipo E dimensioni reali
    let g=map.get(key); if(!g){ g={key,kind:f.kind,tipo:t,nums:[],w:f.lb,h:infH(f)}; map.set(key,g); }
    g.nums.push(f.num); });
  return [...map.values()].sort((a,b)=>a.kind===b.kind?(b.w-a.w):(a.kind<b.kind?-1:1)); }
function expInfAbaco(){
  const R=[['Sigla','Categoria','Modello','Largh cm','Alt cm','Parapetto cm','Telaio','Vetro','Uw W/m2K','Q.ta']];
  infGroups().forEach(g=>{ const t=g.tipo, uw=t?uwOf(t):null, cat=t?(INF_CAT[t.sub]||{}).l:(g.kind==='fin'?'Finestra':'Porta');
    R.push([g.nums.join(' '), cat, t?t.nome:'', Math.round(g.w*100), Math.round(g.h*100),
      t?Math.round((t.par||0)*100):'', t?(TELAI[t.telaio]||{}).l||'':'', t?(VETRI[t.vetro]||{}).l||'':'',
      uw!=null?nf(uw,2):'', g.nums.length]); });
  dl('abaco-infissi-modulo.csv',csv(R)); }
function supFin(roomLab){
  let a=0;
  for(const f of S.infissi){
    if(f.kind!=='fin'||f.room!==roomLab) continue;
    if(f.hOver==null && !tipoOf(f)) continue;   // conta se ha un tipo o un'altezza impostata
    a += f.lb*infH(f);
  }
  return a;
}
function stratCalc(st){
  if(!st) return null;
  const ls=st.strati.map(l=>{
    const m=S.materiali.find(x=>x.id===l.mat)||{};
    return {s:+l.s||0, lambda:m.lambda, rho:m.rho, c:m.c, R:l.R, intonaco:!!l.intonaco, mat:m};
  });
  const manca=ls.some(l=>(l.R===undefined||l.R===null||l.R==='')&&!(l.lambda>0));
  const flusso=st.tipo==='copertura'||st.tipo==='solaio_sup'?'asc':(st.tipo==='pavimento'?'disc':'oriz');
  const interno=st.tipo==='parete_int';
  const u=calcU(ls,flusso,interno);
  const d=calcDynamic(ls,flusso,interno,u.U);
  return Object.assign({},u,d,{manca,flusso,interno});
}
function limiteDi(st){
  const L=S.limiti;
  if(st.tipo==='parete_est') return L.parete;
  if(st.tipo==='copertura'||st.tipo==='solaio_sup') return L.copertura;
  if(st.tipo==='pavimento') return L.pavimento;
  return null;
}

/* ---------- barra verifiche ---------- */
function bar(){
  const chips=[];
  const tot=S.rooms.reduce((a,r)=>a+r.area,0), vol=S.rooms.reduce((a,r)=>a+volume(r),0);
  chips.push(['Vani',S.rooms.length||'—',S.rooms.length?'ok':'',1]);
  chips.push(['Superficie',S.rooms.length?nf(tot)+' m²':'—','',1]);
  chips.push(['Volume',S.rooms.length?nf(vol)+' m³':'—','',2]);
  // altezze
  let hb=0; S.rooms.forEach(r=>{const lim=r.tipo==='ab'?S.cfg.hMinAb:(r.tipo==='se'?S.cfg.hMinSer:0);
    if(lim>0&&hNetta(r)<lim-1e-9) hb++;});
  chips.push(['Altezze',S.rooms.length?(hb?hb+' sotto min':'conformi'):'—',
    S.rooms.length?(hb?'err':'ok'):'',2]);
  // RAI
  let rb=0,rn=0; S.rooms.filter(r=>r.tipo!=='ac').forEach(r=>{const sf=supFin(r.lab);
    if(sf<=0){rn++;return;} if(!checkRAI(r.area,sf,+S.cfg.rai).ok) rb++;});
  chips.push(['RAI',S.rooms.length?(rn&&!rb?rn+' n.d.':(rb?rb+' non conf.':'conformi')):'—',
    S.rooms.length?(rb?'err':(rn?'warn':'ok')):'',4]);
  // U
  let ub=0,un=0;
  S.strati.forEach(st=>{const c=stratCalc(st),l=limiteDi(st);
    if(!c||c.manca){un++;return;} if(l&&c.U>+l) ub++;});
  chips.push(['Trasmittanze',S.strati.length?(ub?ub+' oltre limite':(un?un+' incomplete':'conformi')):'—',
    S.strati.length?(ub?'err':(un?'warn':'ok')):'',3]);
  if(S.impianti){ let nd=0; SYS_ORD.forEach(k=>nd+=(S.impianti[k]?S.impianti[k].dev.length:0));
    if(nd) chips.push(['Impianti',nd+' punti','ok',7]); }
  $('#bar').innerHTML=chips.map(c=>
    `<div class="vchip ${c[2]}" data-go="${c[3]}"><span class="dot"></span>
     <span class="k">${c[0]}</span><span class="v">${c[1]}</span></div>`).join('');
  $$('#bar .vchip').forEach(e=>e.onclick=()=>go(+e.dataset.go));
}

/* ---------- binding ---------- */
function on(sel,ev,fn){ $$(sel).forEach(e=>e.addEventListener(ev,fn)); }
function bind(){
  const u=$('#uni'); if(u){ u.value=String(S.scala);
    u.onchange=()=>{S.scala=+u.value; rebuild();}; }
  const rs=$('#res'); if(rs){ rs.value=String(S.cfg.px);
    rs.onchange=()=>{S.cfg.px=+rs.value; if(S.rooms.length) detectRooms(); render();}; }
  on('[data-lay]','change',e=>{S.layerMap[e.target.dataset.lay]=e.target.value;
    detectInfissi(); if(S.rooms.length) detectRooms(); render();});
  const bd=$('#bDetect'); if(bd) bd.onclick=()=>{detectInfissi();detectRooms();go(1);};
  on('[data-rm]','click',e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;

  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},900);
}

function impPrz(){
  const i=document.createElement('input'); i.type='file'; i.accept='.csv';
  i.onchange=()=>{const f=i.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{
      const rows=String(r.result).split(/\r?\n/).filter(x=>x.trim());
      const sep=(rows[0].match(/;/g)||[]).length>=(rows[0].match(/,/g)||[]).length?';':',';
      const hd=rows[0].split(sep).map(x=>x.trim().toLowerCase().replace(/"/g,''));
      const ix=k=>hd.findIndex(h=>h.indexOf(k)>=0);
      const ic=ix('cod'),id=ix('desc'),iu=ix('um'),ip=ix('prezz');
      S.prezzario=rows.slice(1).map(l=>{const c=l.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));
        return {cod:c[ic]||'',desc:c[id]||'',um:c[iu]||'',prezzo:parseFloat(String(c[ip]||'').replace(',','.'))||0};
      }).filter(v=>v.cod||v.desc);
      render();
    };
    r.readAsText(f,'utf-8');};
  i.click();
}
/* ---------- caricamento DXF ---------- */
function rebuild(){
  if(!S.dxf) return;
  S.polys=[];
  for(const e of S.dxf.entities){
    try{ S.polys.push(...toPolys(S.dxf,e)); }catch(err){}
  }
  if(S.scala!==1) S.polys.forEach(g=>g.pts.forEach(p=>{p.x*=S.scala;p.y*=S.scala;}));
  S.polys=S.polys.filter(g=>g.pts.length>1);
  S.bbox=polyBBox(S.polys);
  detectInfissi();
  if(S.rooms.length) detectRooms();
  fitView(); render();
}
function loadDXF(text,name){
  let d;
  try{ d=parseDXF(text); }catch(e){ alert('Il file non è leggibile come DXF ASCII.'); return; }
  if(!d.entities.length){
    alert('Nessuna entità trovata. Se il file è in formato DXF binario, riesportalo come DXF ASCII (R12 o superiore).');
    return;
  }
  S.dxf=d; S.file=name; S.rooms=[]; S.cuts=[]; S.sel=null; S.roomImg=null; S.labels=null;
  S.layerMap={};
  Object.keys(d.layers).forEach(n=>S.layerMap[n]=guessRole(n));
  // deduzione unità: un edificio di 400+ unità è quasi certamente in millimetri
  S.polys=[]; for(const e of d.entities){ try{S.polys.push(...toPolys(d,e));}catch(err){} }
  const bb=polyBBox(S.polys);
  S.scala = (bb && Math.max(bb.w,bb.h)>400) ? 0.001 : 1;
  $('#drop').classList.add('hide');
  rebuild(); go(0);
}
function readFile(f){
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>loadDXF(String(r.result),f.name);
  r.onerror=()=>alert('Lettura del file non riuscita.');
  r.readAsText(f,'utf-8');
}

/* ---------- interazione canvas ---------- */
let pts=new Map(), pinch=null;
function stagePt(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,stagePt(e));
  if(pts.size===2){ const[a,b]=[...pts.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),sc:S.view.sc}; return; }
  const w=S2W(stagePt(e));
  if(isImp(S.pane) && impDown(w)) return;
  if(isStr(S.pane) && strDown(w)) return;
  if(S.tool==='pick'){ pickRoom(w); return; }
  if(S.tool==='cut'){ S.cutA=w; S.cutB=w; return; }
  if(S.tool==='del'){ delCut(w); return; }
  S.drag={x:e.clientX,y:e.clientY,cx:S.view.cx,cy:S.view.cy};
});
cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,stagePt(e));
  if(pts.size===2&&pinch){ const[a,b]=[...pts.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    S.view.sc=Math.max(1,Math.min(4000,pinch.sc*d/Math.max(pinch.d,1))); draw(); return; }

const clmp=(v,a,b)=>Math.max(a,Math.min(b,v));
const MOD3D={renderer:null,scene:null,cam:null,ray:null,model:null,clip:null,bounds:null,secRange:null,

/* --- geometria muri --- */
function rectAxis(pts){
  let p=pts.slice();
  if(p.length>1 && Math.hypot(p[0].x-p[p.length-1].x,p[0].y-p[p.length-1].y)<1e-6) p=p.slice(0,-1);
  if(p.length!==4) return null;
  const e=(i,j)=>Math.hypot(p[j].x-p[i].x,p[j].y-p[i].y);
  const e0=e(0,1),e1=e(1,2),e2=e(2,3),e3=e(3,0);
  let p0,p1,thk;
  if((e0+e2)>=(e1+e3)){ p0={x:(p[3].x+p[0].x)/2,y:(p[3].y+p[0].y)/2}; p1={x:(p[1].x+p[2].x)/2,y:(p[1].y+p[2].y)/2}; thk=(e1+e3)/2; }
  else { p0={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}; p1={x:(p[2].x+p[3].x)/2,y:(p[2].y+p[3].y)/2}; thk=(e0+e2)/2; }
  const len=Math.hypot(p1.x-p0.x,p1.y-p0.y);
  if(len<0.05||thk<0.02) return null;
  return {p0,p1,len,thk};
}
function projOnSeg(px,py,a,b){ const abx=b.x-a.x,aby=b.y-a.y,L2=abx*abx+aby*aby||1;
  const t=((px-a.x)*abx+(py-a.y)*aby)/L2; const cx=a.x+t*abx,cy=a.y+t*aby;
  return {t, d:Math.hypot(px-cx,py-cy)}; }
/* Muro (MUR_EST/INT) più vicino a un punto: dà direzione e spessore per orientare gli infissi.
   maxD limita la ricerca: rectAxis riconosce solo i rettangoli a 4 punti, quindi i muri
   complessi non hanno asse e senza limite si finirebbe ad agganciarsi a un muro a metri
   di distanza — che è peggio del non trovarne nessuno. */
function nearestWallAxis(pt,maxD){ let best=null,bd=(maxD==null?1.0:maxD);
  for(const g of S.polys){ const role=S.layerMap[g.layer]; if(role!=='MUR_EST'&&role!=='MUR_INT')continue;
    const ax=rectAxis(g.pts); if(!ax)continue; const pr=projOnSeg(pt.x,pt.y,ax.p0,ax.p1);
    if(pr.t<-0.15||pr.t>1.15)continue; if(pr.d<bd){bd=pr.d;best=ax;} }
  return best; }

function buildWallMesh(g,role,base,H,lg){
  const clip=MOD3D.clip;
  const axis = role==='PIL'? null : rectAxis(g.pts);
  const col=(RUOLI[role]&&RUOLI[role].c)||'#b9c0c8';
  const mat=new THREE.MeshStandardMaterial({color:new THREE.Color(col),roughness:.92,metalness:0,side:THREE.DoubleSide,clippingPlanes:[clip]});
  let geo;
  if(axis){
    const len=axis.len, thk=Math.max(0.03,axis.thk);
    const sh=new THREE.Shape();
    sh.moveTo(0,0); sh.lineTo(len,0); sh.lineTo(len,H); sh.lineTo(0,H); sh.lineTo(0,0);
    for(const f of S.infissi){
      if(f.kind!=='fin') continue;
      const pr=projOnSeg(f.mid.x,f.mid.y,axis.p0,axis.p1);
      if(pr.d>thk/2+0.25) continue;
      const u=pr.t*len; if(u<-0.1||u>len+0.1) continue;
      const t=tipoOf(f), w=clmp((t&&t.lb)||f.lb||1.2,0.2,len-0.12), oh=(t&&t.h)||1.4;
      const sill=(t&&t.par!=null)?t.par:0.9;
      const v0=Math.max(0.05,sill), v1=Math.min(H-0.05,sill+oh);
      const u0=Math.max(0.05,u-w/2), u1=Math.min(len-0.05,u+w/2);
      if(v1-v0<0.1||u1-u0<0.1) continue;
      const hp=new THREE.Path(); hp.moveTo(u0,v0);hp.lineTo(u1,v0);hp.lineTo(u1,v1);hp.lineTo(u0,v1);hp.lineTo(u0,v0);
      sh.holes.push(hp);
    }
    geo=new THREE.ExtrudeGeometry(sh,{depth:thk,bevelEnabled:false});
    geo.translate(0,0,-thk/2);
    const dx=axis.p1.x-axis.p0.x, dy=axis.p1.y-axis.p0.y, L=Math.hypot(dx,dy)||1, dirx=dx/L, dirz=-dy/L;
    const mtx=new THREE.Matrix4().makeBasis(new THREE.Vector3(dirx,0,dirz),new THREE.Vector3(0,1,0),new THREE.Vector3(-dirz,0,dirx));
    mtx.setPosition(axis.p0.x,base,-axis.p0.y);
    geo.applyMatrix4(mtx);
  } else {
    const sh=new THREE.Shape();
    g.pts.forEach((p,i)=> i?sh.lineTo(p.x,p.y):sh.moveTo(p.x,p.y));
    geo=new THREE.ExtrudeGeometry(sh,{depth:H,bevelEnabled:false});
    geo.rotateX(-Math.PI/2); geo.translate(0,base,0);
  }
  const mesh=new THREE.Mesh(geo,mat); mesh.userData={layer:g.layer,role};
  if(S.selLayer===g.layer){ mat.emissive=new THREE.Color('#F2A03D'); mat.emissiveIntensity=0.5; }
  else if(S.layerStrat&&S.layerStrat[g.layer]){ mat.emissive=new THREE.Color('#3a2f18'); mat.emissiveIntensity=0.35; }
  lg.add(mesh);
  if(MOD3D.pickWall){ MOD3D.pickWall.push(mesh); (MOD3D.wallByLayer[g.layer]=MOD3D.wallByLayer[g.layer]||[]).push(mesh); }
  if(S.m3d.edges){ const eg=new THREE.EdgesGeometry(geo,25);
    lg.add(new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x0b0d0f,clippingPlanes:[clip]}))); }
}
/* posiziona un box nel frame locale di un infisso (A=lungo muro, U=verticale, P=perpendicolare) */
function boxLocal(midX,midZ,ux,uy,aOff,yLev,sw,sh,sd,mat,lg){
  const g=new THREE.BoxGeometry(sw,sh,sd);
  const A=new THREE.Vector3(ux,0,-uy), U=new THREE.Vector3(0,1,0), P=new THREE.Vector3(uy,0,ux);
  const m=new THREE.Matrix4().makeBasis(A,U,P);
  m.setPosition(new THREE.Vector3(midX,yLev,midZ).addScaledVector(A,aOff));
  g.applyMatrix4(m); const mesh=new THREE.Mesh(g,mat); lg.add(mesh); return mesh;
}
function placeOpening(f,base,H,lg){
  const clip=MOD3D.clip;
  // orientamento: prima l'asse lungo dell'infisso stesso (rettangolo), poi il muro ospite
  const src=S.polys[f.pi], oa=src?rectAxis(src.pts):null, wax=nearestWallAxis(f.mid);
  let ux=1,uy=0, thk=S.m3d.wallDef||0.1;
  if(oa){ const dx=oa.p1.x-oa.p0.x,dy=oa.p1.y-oa.p0.y,l=Math.hypot(dx,dy)||1; ux=dx/l; uy=dy/l; thk=Math.max(0.08,oa.thk); }
  else if(wax){ const dx=wax.p1.x-wax.p0.x,dy=wax.p1.y-wax.p0.y,l=Math.hypot(dx,dy)||1; ux=dx/l; uy=dy/l; thk=Math.max(0.08,wax.thk); }
  else if(src&&src.pts&&src.pts.length>=2){ const a=src.pts[0],b=src.pts[src.pts.length-1],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1; ux=dx/l; uy=dy/l; }
  const isF=f.kind==='fin';
  const w=clmp((oa?oa.len:f.lb)||(isF?1.2:0.8),0.2,6), oh=infH(f), sill=infSill(f);
  const midX=f.mid.x, midZ=-f.mid.y, cY=base+sill;
  const fw=Math.max(0.05,Math.min(0.09,w*0.16,oh*0.16));
  const frameMat=new THREE.MeshStandardMaterial({color:new THREE.Color(isF?'#d7dde3':'#7a6748'),roughness:.55,metalness:isF?0.15:0,side:THREE.DoubleSide,clippingPlanes:[clip]});
  const glassMat=new THREE.MeshStandardMaterial({color:new THREE.Color('#8fd6e2'),transparent:true,opacity:clmp(S.m3d.glass,0.05,0.95),roughness:.08,metalness:.1,side:THREE.DoubleSide,clippingPlanes:[clip]});
  const leafMat=new THREE.MeshStandardMaterial({color:new THREE.Color('#6b5a3e'),roughness:.7,side:THREE.DoubleSide,clippingPlanes:[clip]});
  // telaio + imbotti (spallette, architrave, davanzale/soglia) nello spessore del muro
  boxLocal(midX,midZ,ux,uy,-(w/2-fw/2),cY+oh/2,fw,oh,thk,frameMat,lg);
  boxLocal(midX,midZ,ux,uy, (w/2-fw/2),cY+oh/2,fw,oh,thk,frameMat,lg);
  boxLocal(midX,midZ,ux,uy,0,cY+oh-fw/2,w,fw,thk,frameMat,lg);
  boxLocal(midX,midZ,ux,uy,0,cY+(isF?fw*0.65:fw/2),w,isF?fw*1.3:fw*0.6,isF?thk+0.06:thk,frameMat,lg);
  // vetro / anta interna
  const iw=Math.max(0.05,w-2*fw), ih=Math.max(0.05,oh-2*fw);
  boxLocal(midX,midZ,ux,uy,0,cY+oh/2,iw,ih,isF?0.03:0.045,isF?glassMat:leafMat,lg);
  // porta: muratura sopra la porta (architrave) fino al solaio — conteggiata nelle superfici
  if(!isF){ const topH=(H||oh)-oh;
    if(topH>0.05){ const m2=new THREE.MeshStandardMaterial({color:new THREE.Color((RUOLI.MUR_INT&&RUOLI.MUR_INT.c)||'#98A2AC'),roughness:.92,side:THREE.DoubleSide,clippingPlanes:[clip]});
      boxLocal(midX,midZ,ux,uy,0,base+oh+topH/2,w,topH,thk,m2,lg); } }
}
function slabBox(topY,thk,color){ const b=S.bbox;
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(b.w+0.25,thk,b.h+0.25),
    new THREE.MeshStandardMaterial({color:new THREE.Color(color),roughness:.95,clippingPlanes:[MOD3D.clip]}));

function addFloor(lg,y){
  const clip=MOD3D.clip, b=S.bbox;
  const plate=new THREE.Mesh(new THREE.BoxGeometry(b.w+0.5,0.08,b.h+0.5),
    new THREE.MeshStandardMaterial({color:new THREE.Color('#12171c'),roughness:1,clippingPlanes:[clip]}));
  plate.position.set((b.x0+b.x1)/2,y-0.06,-(b.y0+b.y1)/2); lg.add(plate); MOD3D.pick.push(plate);

}
function refreshFloorTex(){ MOD3D.floorTex.forEach(t=>t.needsUpdate=true); }

function dispose3D(){ if(!MOD3D.model)return; MOD3D.scene.remove(MOD3D.model);
  MOD3D.model.traverse(o=>{ if(o.geometry)o.geometry.dispose();
    if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(m.map)m.map.dispose();m.dispose();});} });
  MOD3D.model=null; MOD3D.floorTex=[]; MOD3D.pick=[]; }

/* categorie in cui è diviso ogni livello del modello 3D */
const M3D_PARTI=['mur','inf','sol','str','mep'];
const M3D_PARTL={mur:'Muri',inf:'Infissi',sol:'Solai e pavimenti',str:'Struttura',mep:'Impianti'};
function lvPart(id,key){
  const P=MOD3D.levelParts&&MOD3D.levelParts[id];
  return (P&&P[key])||(MOD3D.levelGroups&&MOD3D.levelGroups[id])||MOD3D.model;
}
function build3D(){
  if(!MOD3D.scene||!S.bbox) return;
  dispose3D();
  const grp=new THREE.Group(); MOD3D.model=grp; MOD3D.scene.add(grp);
  MOD3D.levelGroups={}; MOD3D.levelParts={}; MOD3D.pickWall=[]; MOD3D.wallByLayer={};
  const m=S.m3d, b=S.bbox;
  if(!m.partsOff) m.partsOff={};
  const levels=S.livelli.slice().sort((a,b)=>a.quota-b.quota);
  const qs=levels.map(l=>l.quota), tops=levels.map(l=>l.quota+Math.max(0.4,l.h));
  const baseMin=Math.min(0,...qs), totTop=Math.max(baseMin+3,...tops);
  levels.forEach((L,idx)=>{
    const lg=new THREE.Group(); grp.add(lg); MOD3D.levelGroups[L.id]=lg; lg.visible=!m.levelsOff[L.id];
    /* ogni livello è diviso per categoria, così si può spegnere il singolo pezzo */
    const P={}; M3D_PARTI.forEach(k=>{ const g2=new THREE.Group();
      g2.visible=!m.partsOff[L.id+'|'+k]; lg.add(g2); P[k]=g2; });
    MOD3D.levelParts[L.id]=P;
    const base=L.quota, H=Math.max(0.4,L.h);
    for(const g of S.polys){ const role=S.layerMap[g.layer];
      if(role==='MUR_EST'||role==='MUR_INT'||role==='PIL') buildWallMesh(g,role,base,H,P.mur); }
    for(const f of S.infissi) placeOpening(f,base,H,P.inf);
    if(m.floors) addFloor(P.sol,base+0.02);
    else { const pp=new THREE.Mesh(new THREE.PlaneGeometry(b.w+2,b.h+2),new THREE.MeshBasicMaterial({visible:false}));
      pp.rotation.x=-Math.PI/2; pp.position.set((b.x0+b.x1)/2,base+0.02,-(b.y0+b.y1)/2); P.sol.add(pp); MOD3D.pick.push(pp); }
    const isTop=idx===levels.length-1;
    if(m.slabs && !(isTop&&m.roof)) P.sol.add(slabBox(base+H,0.24,'#242c34'));
  });
  if(m.roof && levels.length){ const T=levels[levels.length-1];
    lvPart(T.id,'sol').add(slabBox(T.quota+Math.max(0.4,T.h),0.3,'#2a333c')); }

  if(typeof buildImpianti3D==='function') buildImpianti3D(levels);

/* --- scena / camera / loop --- */
function init3D(){
  const gl=$('#gl');

  rnd.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  rnd.localClippingEnabled=true; rnd.setClearColor(new THREE.Color('#0E1114'),1);
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(55,1,0.05,6000);
  scene.add(new THREE.HemisphereLight(0xcfe0ff,0x20262c,0.75));
  const sun=new THREE.DirectionalLight(0xfff2df,0.95); sun.position.set(40,80,30); scene.add(sun);
  scene.add(new THREE.AmbientLight(0xffffff,0.22));
  const grid=new THREE.GridHelper(600,300,0x2a333c,0x161c22); grid.position.y=-0.03; scene.add(grid);
  MOD3D.clip=new THREE.Plane(new THREE.Vector3(0,-1,0),1e6);
  MOD3D.renderer=rnd; MOD3D.scene=scene; MOD3D.cam=cam; MOD3D.ray=new THREE.Raycaster();
  CTL.target=new THREE.Vector3(); CTL.pos=new THREE.Vector3(); MOD3D.keys=new Set();

function updateOrbit(){ const cam=MOD3D.cam,t=CTL.target,R=CTL.radius;
  cam.position.set(t.x+R*Math.sin(CTL.phi)*Math.sin(CTL.theta), t.y+R*Math.cos(CTL.phi), t.z+R*Math.sin(CTL.phi)*Math.cos(CTL.theta));
  cam.lookAt(t); }
function updateWalk(){ const cam=MOD3D.cam,spd=0.09,K=MOD3D.keys;

function wire3DControls(gl){
  const pointers=new Map();
  gl.addEventListener('pointerdown',e=>{ gl.setPointerCapture&&gl.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); CTL.moved=0;
    CTL.panMode=(e.button===2||e.button===1||e.shiftKey); if(pointers.size>=2) CTL.pinch=0; });
  gl.addEventListener('pointermove',e=>{ const p=pointers.get(e.pointerId); if(!p)return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY; CTL.moved+=Math.abs(dx)+Math.abs(dy);
    if(pointers.size>=2){ const pts=[...pointers.values()]; const nd=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
      if(CTL.pinch) CTL.radius=clmp(CTL.radius*(CTL.pinch/nd),0.5,8000); CTL.pinch=nd; panBy(dx*0.5,dy*0.5); return; }
    if(CTL.mode==='walk'){ CTL.yaw-=dx*0.005; CTL.pitch=clmp(CTL.pitch-dy*0.005,-1.4,1.4); return; }
    if(CTL.panMode) panBy(dx,dy);
    else { CTL.theta-=dx*0.005; CTL.phi=clmp(CTL.phi-dy*0.005,0.06,Math.PI-0.06); } });
  const up=e=>{ if(CTL.moved<4 && pointers.size===1 && CTL.mode!=='walk') pick3D(e);
    pointers.delete(e.pointerId); if(pointers.size<2) CTL.pinch=0; };
  gl.addEventListener('pointerup',up); gl.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);if(pointers.size<2)CTL.pinch=0;});
  gl.addEventListener('wheel',e=>{ e.preventDefault(); CTL.radius=clmp(CTL.radius*(1+Math.sign(e.deltaY)*0.1),0.5,8000); },{passive:false});
  gl.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('keydown',e=>{ if(MOD3D.running) MOD3D.keys.add(e.key.toLowerCase()); });
  window.addEventListener('keyup',e=>{ MOD3D.keys.delete(e.key.toLowerCase()); });
  const bf=$('#bFit3D'); if(bf) bf.onclick=fit3D;
  const bw=$('#bWalk'); if(bw) bw.onclick=toggleWalk;
  const sr=$('#secR'); if(sr) sr.oninput=()=>setSection(+sr.value);
}
function panBy(dx,dy){ if(CTL.mode==='walk')return; const cam=MOD3D.cam, s=CTL.radius*0.0016;
  const right=new THREE.Vector3().setFromMatrixColumn(cam.matrix,0), upv=new THREE.Vector3().setFromMatrixColumn(cam.matrix,1);
  CTL.target.addScaledVector(right,-dx*s).addScaledVector(upv,dy*s); }

function ensureThree(cb){
  if(window.THREE) return cb(true);
  if(MOD3D.loading){ MOD3D.loadCbs.push(cb); return; }
  MOD3D.loading=true; MOD3D.loadCbs=[cb];
  const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js';
  s.onload=()=>{ MOD3D.loading=false; const cbs=MOD3D.loadCbs; MOD3D.loadCbs=[]; cbs.forEach(f=>f(!!window.THREE)); };
  s.onerror=()=>{ MOD3D.loading=false; const cbs=MOD3D.loadCbs; MOD3D.loadCbs=[]; cbs.forEach(f=>f(false)); };
  document.head.appendChild(s);
}

  SYS_ORD.forEach(k=>{ if(!S.impianti[k]) S.impianti[k]={dev:[],run:[],gen:null}; });
  return S.impianti; }
function addDev(sys,kind,x,y,room,meta){ ensureImp(); const d={id:uid(),sys,kind,x,y,room:room||null,meta:meta||{}};
  S.impianti[sys].dev.push(d); return d; }

/* --- helper geometrici sui vani --- */
function roomCtr(rm){ return {x:S.gx0+rm.cx*S.px, y:S.gy0+(S.gh-rm.cy)*S.px}; }
function roomDoors(rm){ return S.infissi.filter(f=>f.kind==='por'&&f.room===rm.lab); }
function roomWins(rm){ return S.infissi.filter(f=>f.kind==='fin'&&f.room===rm.lab); }
function labOfWorld(w){ if(!S.labels) return 0; return labAt((w.x-S.gx0)/S.px, S.gh-(w.y-S.gy0)/S.px); }
function labRoomOf(p){ const l=labOfWorld(p); return S.rooms.some(r=>r.lab===l)?l:null; }
/* centroidi delle polilinee sui layer che matchano rgx: importa i punti disegnati */
function mepPts(rgx){ const out=[]; S.polys.forEach(g=>{ if(rgx.test(g.layer)) out.push(polyMid(g)); }); return out; }
function edgeMap(){ const gw=S.gw,gh=S.gh,px=S.px,gx0=S.gx0,gy0=S.gy0,labels=S.labels; const M=new Map();
  if(!labels) return M;
  for(let y=1;y<gh-1;y++)for(let x=1;x<gw-1;x++){ const i=y*gw+x, lab=labels[i]; if(lab<=0)continue;
    if(labels[i-1]!==lab||labels[i+1]!==lab||labels[i-gw]!==lab||labels[i+gw]!==lab){
      let a=M.get(lab); if(!a){a=[];M.set(lab,a);} a.push({x:gx0+x*px,y:gy0+(gh-y)*px}); } }
  return M; }
function towards(p,ctr,d){ const dx=ctr.x-p.x,dy=ctr.y-p.y,l=Math.hypot(dx,dy)||1; return {x:p.x+dx/l*d,y:p.y+dy/l*d}; }
function spread(pts,ctr,n){ if(!pts||!pts.length||n<=0) return [];
  const s=pts.slice().sort((a,b)=>Math.atan2(a.y-ctr.y,a.x-ctr.x)-Math.atan2(b.y-ctr.y,b.x-ctr.x));
  const out=[]; for(let i=0;i<n;i++){ const p=s[Math.floor(i*s.length/n)]; out.push(towards(p,ctr,0.12)); } return out; }
function manhattan(a,bp){ return [{x:a.x,y:a.y},{x:bp.x,y:a.y},{x:bp.x,y:bp.y}]; }
/* percorso a L "dall'altro lato": mandata e ritorno non si sovrappongono mai */
function manhattanAlt(a,bp){ return [{x:a.x,y:a.y},{x:a.x,y:bp.y},{x:bp.x,y:bp.y}]; }
/* copia di una polilinea spostata di d in perpendicolare: il tubo gemello corre affiancato */
function offsetPath(pts,d){
  if(!pts||pts.length<2) return (pts||[]).slice();
  const out=[];
  for(let i=0;i<pts.length;i++){
    let nx=0,ny=0;
    if(i>0){ const dx=pts[i].x-pts[i-1].x,dy=pts[i].y-pts[i-1].y,l=Math.hypot(dx,dy)||1; nx+=-dy/l; ny+=dx/l; }
    if(i<pts.length-1){ const dx=pts[i+1].x-pts[i].x,dy=pts[i+1].y-pts[i].y,l=Math.hypot(dx,dy)||1; nx+=-dy/l; ny+=dx/l; }
    const l=Math.hypot(nx,ny)||1; out.push({x:pts[i].x+nx/l*d, y:pts[i].y+ny/l*d});
  }
  return out;
}
function pathLen(pts){ let L=0; for(let i=1;i<(pts||[]).length;i++) L+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y); return L; }
/* campionamento a massima distanza: n punti ben distribuiti, senza grappoli come nello slicing per indice */
function farthest(pts,n){
  if(!pts||!pts.length||n<=0) return [];
  if(pts.length<=n) return pts.slice();
  const out=[pts[0]], used=new Set([0]);
  while(out.length<n){
    let bi=-1,bd=-1;
    for(let i=0;i<pts.length;i++){ if(used.has(i))continue;
      let dm=1e9; for(const q of out){ const d=Math.hypot(pts[i].x-q.x,pts[i].y-q.y); if(d<dm)dm=d; }
      if(dm>bd){bd=dm;bi=i;} }
    if(bi<0)break; used.add(bi); out.push(pts[bi]);
  }
  return out;
}
/* asse di un infisso: direzione lungo il muro, luce netta e spessore (stessa logica del 3D).
   ATTENZIONE: len deve essere la luce dell'infisso. Se l'asse arriva dal muro ospite,
   ax.len è la lunghezza del MURO — usarla farebbe finire comandi e cassette a metri di distanza. */
function infAxis(f){
  const src=S.polys[f.pi], oa=src?rectAxis(src.pts):null, ax=oa||nearestWallAxis(f.mid);
  const len=oa?oa.len:(f.lb||0.8);
  if(!ax) return {ux:1,uy:0,thk:S.m3d.wallDef||0.1,len};
  const dx=ax.p1.x-ax.p0.x, dy=ax.p1.y-ax.p0.y, l=Math.hypot(dx,dy)||1;
  return {ux:dx/l, uy:dy/l, thk:Math.max(0.08,ax.thk), len};
}
/* aggancia un punto alla faccia interna del muro più vicino.
   Restituisce posizione + terna coerente: n = rot90(a), n rivolta verso l'interno del vano. */
function wallSnap(p,ctr,off){
  /* solo un muro davvero adiacente può ospitare il pezzo: se non c'è, il punto resta
     dov'è (già calcolato bene, per esempio a fianco della porta) e si orienta verso il vano */
  const ax=nearestWallAxis(p,0.55), o=(off==null?0.02:off);
  if(!ax){ const dx=(ctr.x-p.x), dy=(ctr.y-p.y), l=Math.hypot(dx,dy);
    /* se il punto coincide col centro del vano non c'è una direzione: terna di default,
       altrimenti asse e normale resterebbero nulli e i pezzi finirebbero sovrapposti */
    const nx=l>1e-6?dx/l:0, ny=l>1e-6?dy/l:1;
    return {x:p.x, y:p.y, ux:ny, uy:-nx, nx, ny, thk:S.m3d.wallDef||0.1}; }   // n = rot90(a)
  const dx=ax.p1.x-ax.p0.x, dy=ax.p1.y-ax.p0.y, l=Math.hypot(dx,dy)||1;
  let ux=dx/l, uy=dy/l;
  /* margine metrico, non percentuale: su un muro lungo un limite in frazione
     sposterebbe il punto di metri, cambiando il vano in cui finisce */
  const mg=Math.min(0.45,0.06/l);
  const t=clmp(((p.x-ax.p0.x)*ux+(p.y-ax.p0.y)*uy)/l,mg,1-mg);
  const bx=ax.p0.x+dx*t, by=ax.p0.y+dy*t;
  let nx=-uy, ny=ux;
  if((ctr.x-bx)*nx+(ctr.y-by)*ny<0){ nx=-nx; ny=-ny; ux=-ux; uy=-uy; }  // ribalta entrambi: n resta rot90(a)
  const d=Math.max(0.08,ax.thk)/2+o;
  return {x:bx+nx*d, y:by+ny*d, ux, uy, nx, ny, thk:Math.max(0.08,ax.thk)};
}
/* Un posto è "occupato" se c'è già un pezzo dello stesso vano troppo vicino.
   Fra vani diversi basta non sovrapporsi: due prese sulle due facce dello stesso muro
   divisorio sono normalissime e non vanno scartate. */
const CROSS_D=0.12;
function occupato(busy,x,y,lab,md){
  return !!busy && busy.some(q=>Math.hypot(q.x-x,q.y-y) < (q.lab===lab? md : CROSS_D));
}
/* aggancia al muro e, se il posto è già preso, scorre lungo il muro finché trova posto */
function snapFree(p,ctr,off,busy,minD,lab){
  const md=(minD==null?0.30:minD);
  let w=wallSnap(p,ctr,off);
  if(busy) for(let k=0;k<8;k++){
    if(!occupato(busy,w.x,w.y,lab,md)) break;
    const s=(k%2?-1:1)*Math.ceil((k+1)/2)*md;
    w=wallSnap({x:p.x+w.ux*s, y:p.y+w.uy*s},ctr,off);
  }
  if(busy) busy.push({x:w.x,y:w.y,lab});
  return w;
}
/* dispositivo montato a parete, con asse e normale memorizzati per 2D e 3D */
function addWallDev(sys,kind,p,ctr,rmLab,meta,off,busy,minD){
  const w=busy? snapFree(p,ctr||p,off,busy,minD,rmLab) : wallSnap(p,ctr||p,off);
  return addDev(sys,kind,w.x,w.y,rmLab,Object.assign({ax:{x:w.ux,y:w.uy},n:{x:w.nx,y:w.ny}},meta||{}));
}
/* posa n apparecchi a parete scorrendo i candidati e saltando quelli che, DOPO l'aggancio
   al muro, finirebbero addosso a uno già posato (due punti lontani sul perimetro possono
   ricadere sullo stesso punto di muro, per esempio a cavallo di uno spigolo) */
function placeWall(sys,kind,cands,ctr,rmLab,n,minD,meta,off,busy){
  const out=[], taken=busy||[];   // lista condivisa: viene aggiornata man mano
  const md=minD==null?0.40:minD;
  for(const p of cands){
    if(out.length>=n) break;
    const w=wallSnap(p,ctr,off);
    if(occupato(taken,w.x,w.y,rmLab,md)) continue;
    taken.push({x:w.x,y:w.y,lab:rmLab});
    out.push(addDev(sys,kind,w.x,w.y,rmLab,Object.assign({ax:{x:w.ux,y:w.uy},n:{x:w.nx,y:w.ny}},meta||{})));
  }
  return out;
}
const devAx=d=>(d&&d.meta&&d.meta.ax)||{x:1,y:0};
const devZ=d=>{ const k=IMPK[d.kind]; if(!k) return 0.3; return k.z==='soff'?null:(+k.z||0); };
/* attacchi di mandata e ritorno di un collettore, presi ai due capi del suo asse */
function collPorts(d,sep){
  const a=devAx(d), s=(sep==null?0.13:sep);
  return {m:{x:d.x-a.x*s,y:d.y-a.y*s}, r:{x:d.x+a.x*s,y:d.y+a.y*s}};
}

/* --- generatore ELETTRICO (CEI 64-8) --- */
function pickQuadro(){ let best=null,bs=-1;
  for(const rm of S.rooms){ const u=usoOf(rm); let s=(u==='ingresso')?100:(u==='corridoio')?60:(u==='cucina')?20:0;
    s+=roomDoors(rm).length*3; if(s>bs){bs=s;best=rm;} }
  return best||S.rooms[0]; }
/* zona giorno / notte: separa i circuiti nei livelli di dotazione superiori */
const ZONA_G=['soggiorno','cucina','ingresso','corridoio','studio','balcone','scala','garage'];
const zonaOf=u=>ZONA_G.includes(u)?'g':'n';
/* elenco dei circuiti del quadro secondo il livello di dotazione CEI 64-8 */
function circuiti(li){
  if(li<=0) return [{id:'C1',t:'luce',lbl:'C1 · Illuminazione'},{id:'C2',t:'prese',lbl:'C2 · Prese'}];
  if(li===1) return [{id:'C1',t:'luce',lbl:'C1 · Illuminazione'},{id:'C2',t:'prese',lbl:'C2 · Prese'},
                     {id:'C3',t:'FM',lbl:'C3 · Forza motrice'}];
  return [{id:'C1',t:'luce',z:'g',lbl:'C1 · Luci zona giorno'},{id:'C2',t:'luce',z:'n',lbl:'C2 · Luci zona notte'},
          {id:'C3',t:'prese',z:'g',lbl:'C3 · Prese zona giorno'},{id:'C4',t:'prese',z:'n',lbl:'C4 · Prese zona notte'},
          {id:'C5',t:'FM',lbl:'C5 · Forza motrice'},{id:'C6',t:'dati',lbl:'C6 · TV / dati'}];
}
function circFor(list,t,z){ return list.find(c=>c.t===t&&(!c.z||c.z===z))||list.find(c=>c.t===t)||list[0]; }
/* punto a fianco di un infisso, dal lato interno del vano: comandi e cassette stanno qui */
function besideOpening(f,c,extra,lab){
  const a=infAxis(f), lat=(a.len||0.8)/2+(extra==null?0.16:extra);
  const cand=[{x:f.mid.x+a.ux*lat,y:f.mid.y+a.uy*lat},{x:f.mid.x-a.ux*lat,y:f.mid.y-a.uy*lat}];
  const inside=p=>labOfWorld(towards(p,c,0.30));   // sbircia verso il centro: evita di finire dentro il muro
  return (lab!=null?cand.find(p=>inside(p)===lab):null) || cand.find(p=>inside(p)>0) || cand[0];
}
function genElettrico(){
  if(!S.rooms.length) return;
  ensureImp(); const E=S.impianti.elettrico; E.dev=[]; E.run=[]; E.gen=null;
  const li=clmp((S.impLiv|0)-1,0,2), EM=edgeMap(), CIR=circuiti(li);
  /* --- quadro: posizione scelta a mano oppure ingresso/disimpegno, agganciato al muro --- */
  let qpos=S.impGenPos.elettrico, qrm=null;
  if(qpos){ qrm=S.rooms.find(r=>r.lab===labRoomOf(qpos)); }
  else { qrm=pickQuadro();
    if(qrm){ const c=roomCtr(qrm), dr=roomDoors(qrm); qpos=dr.length?besideOpening(dr[0],c,0.45,qrm.lab):c; }
    else qpos={x:(S.bbox.x0+S.bbox.x1)/2,y:(S.bbox.y0+S.bbox.y1)/2}; }
  const qc=qrm?roomCtr(qrm):qpos;
  /* posti già occupati sul muro, condivisi fra TUTTI i vani: due stanze confinanti
     non devono piazzare due scatole sullo stesso punto del muro che le separa */
  const busy=[];
  E.gen=addWallDev('elettrico','quadro',qpos,qc,qrm?qrm.lab:null,{circuiti:CIR.length},0,busy,0.35);
  const Q={x:E.gen.x,y:E.gen.y}, zQ=IMPK.quadro.z, zCD=IMPK.derivaz.z;
  /* calata dalla cassetta al singolo punto: è così che si disegna un impianto civile */
  const drop=(box,d,c)=>E.run.push({id:uid(),sys:'elettrico',circ:c.t,cid:c.id,room:d.room,t:'drop',
    zs:zCD, ze:devZ(d), pts:manhattan({x:box.x,y:box.y},{x:d.x,y:d.y})});
  for(const rm of S.rooms){
    const u=usoOf(rm), info=USI[u]||USI.altro, c=roomCtr(rm), z=zonaOf(u);
    const edge=EM.get(rm.lab)||[], doors=roomDoors(rm);
    /* --- cassette di derivazione: a 2,20 m sul muro a fianco della porta, una ogni ~26 m² --- */
    const nBox=rm.area>26?2:1, boxes=[];
    for(let bi=0;bi<nBox;bi++){
      let bp=null;
      const d0=doors[bi];   // la seconda cassetta solo se c'è davvero una seconda porta
      if(d0) bp=towards(besideOpening(d0,c,0.60,rm.lab),c,0.10);   // ben oltre il comando
      if(!bp||labRoomOf(bp)!==rm.lab) bp=farthest(edge,nBox+2)[bi]||c;
      boxes.push(addWallDev('elettrico','derivaz',bp,c,rm.lab,{},0,busy,0.35));
    }
    const nearBox=p=>{ let b=boxes[0],bd=1e9; boxes.forEach(q=>{const dd=Math.hypot(q.x-p.x,q.y-p.y); if(dd<bd){bd=dd;b=q;}}); return b; };
    /* --- punti luce a soffitto --- */
    const nL=Math.max(info.pl[li], Math.min(4,Math.round(rm.area/22))), lucePts=[];
    if(nL<=1) lucePts.push(c);
    else { const rr=Math.min(1.3,Math.sqrt(rm.area)/3);
      for(let k=0;k<nL;k++){ const a=k/nL*2*Math.PI+Math.PI/4; lucePts.push({x:c.x+Math.cos(a)*rr,y:c.y+Math.sin(a)*rr}); } }
    const luci=lucePts.map(p=>addDev('elettrico','luce',p.x,p.y,rm.lab,{}));
    /* --- comandi: a fianco di ogni porta, all'interno del vano, a 1,10 m --- */
    const cmd=(doors.length?doors:[null]).map((d,di)=>{
      const p=d?besideOpening(d,c,0.16,rm.lab):(farthest(edge,nBox+2)[nBox+1]||c);
      return addWallDev('elettrico','int',p,c,rm.lab,{gang:di===0?clmp(luci.length,1,3):1},0,busy,0.30);
    });
    /* --- prese: sul perimetro, lontano dalle porte e ben distanziate fra loro --- */
    let cand=edge.filter(p=>doors.every(d=>Math.hypot(p.x-d.mid.x,p.y-d.mid.y)>0.55));
    if(cand.length<Math.max(6,info.pr[li]*2)) cand=edge;
    const ordinati=farthest(cand,Math.min(cand.length,info.pr[li]*4));
    const pres=placeWall('elettrico','presa',ordinati,c,rm.lab,info.pr[li],0.45,{},0,busy);
    /* --- forza motrice: lontano anche dalle prese ordinarie --- */
    const fms=info.fm? placeWall('elettrico','fm',ordinati,c,rm.lab,info.fm,0.55,{},0,busy) : [];
    /* --- TV e dati affiancate al gruppo prese, sullo stesso muro --- */
    const dat=[];
    const side=(b,dd)=>{ const a=devAx(b); return {x:b.x+a.x*dd, y:b.y+a.y*dd}; };
    if(info.tv&&pres.length){ const p=side(pres[0],0.14);
      dat.push(addDev('elettrico','tvp',p.x,p.y,rm.lab,{ax:devAx(pres[0]),n:pres[0].meta.n})); }
    if(info.dati&&pres.length){ const b=pres[Math.min(1,pres.length-1)], p=side(b,-0.14);
      dat.push(addDev('elettrico','dati',p.x,p.y,rm.lab,{ax:devAx(b),n:b.meta.n})); }
    /* --- dorsali dal quadro a ogni cassetta, una per circuito presente nel vano --- */
    const cL=circFor(CIR,'luce',z), cP=circFor(CIR,'prese',z), cF=circFor(CIR,'FM',z), cD=circFor(CIR,'dati',z);
    const dorsale=(cc,alt)=>boxes.forEach(b=>E.run.push({id:uid(),sys:'elettrico',circ:cc.t,cid:cc.id,room:rm.lab,t:'dorsale',
      zs:zQ, ze:zCD, pts:alt?offsetPath(manhattanAlt(Q,{x:b.x,y:b.y}),0.05):manhattan(Q,{x:b.x,y:b.y})}));
    if(luci.length||cmd.length) dorsale(cL,false);
    if(pres.length) dorsale(cP,true);
    if(fms.length&&cF!==cP) dorsale(cF,false);
    if(dat.length&&cD!==cP) dorsale(cD,true);
    luci.forEach(d=>drop(nearBox(d),d,cL));
    cmd.forEach(d=>drop(nearBox(d),d,cL));
    pres.forEach(d=>drop(nearBox(d),d,cP));
    fms.forEach(d=>drop(nearBox(d),d,cF));
    dat.forEach(d=>drop(nearBox(d),d,cD));
  }
}

/* --- generatori IDRICO / TERMO / SCARICHI --- */
function genSys(sys){ if(sys==='idrico')genIdrico(); else if(sys==='termo')genTermo(); else if(sys==='scarichi')genScarichi(); }

/* apparecchi previsti per uso del vano, e quali non vogliono l'acqua calda */
const FIX_USO=u=> u==='bagno'?['lavabo','wc','bidet','doccia'] : u==='antibagno'?['lavabo']
  : u==='cucina'?['lavello'] : u==='lavanderia'?['lavatrice','lavello'] : [];
const SOLO_AF=['wc','lavatrice'];
function genIdrico(){
  if(!S.rooms.length) return;
  ensureImp(); const P=S.impianti.idrico; P.dev=[]; P.run=[]; P.gen=null; const EM=edgeMap();
  const AC=[], AF=[];
  // se il DXF contiene i punti acqua disegnati, importali invece di inventarli
  const cald=mepPts(/acqua.*cald|\bcalda\b/i), fred=mepPts(/acqua.*fredd|\bfredda\b/i);
  if(cald.length||fred.length){
    cald.forEach(p=>AC.push(addDev('idrico','acqua_calda',p.x,p.y,labRoomOf(p),{})));
    fred.forEach(p=>AF.push(addDev('idrico','acqua_fredda',p.x,p.y,labRoomOf(p),{})));
  } else {
    for(const rm of S.rooms){ const fx=FIX_USO(usoOf(rm)); if(!fx.length)continue;
      const c=roomCtr(rm), pts=farthest(EM.get(rm.lab)||[],fx.length);
      fx.forEach((k,idx)=>{ const p=pts[idx]||c;
        const d=addWallDev('idrico',k,p,c,rm.lab,{},0.03);
        AF.push(d); if(!SOLO_AF.includes(k)) AC.push(d); });
    }
  }
  /* --- cassetta con i due collettori: acqua fredda e acqua calda, affiancati sullo stesso muro --- */
  const anchor=S.impGenPos.idrico || (()=>{
    const rm=S.rooms.find(r=>['bagno','lavanderia','antibagno','ripostiglio'].includes(usoOf(r)))||S.rooms[0];
    if(!rm) return {x:(S.bbox.x0+S.bbox.x1)/2,y:(S.bbox.y0+S.bbox.y1)/2};
    /* la cassetta sta a muro, non in mezzo alla stanza */
    return farthest(EM.get(rm.lab)||[],1)[0]||roomCtr(rm); })();
  const aRm=S.rooms.find(r=>r.lab===labRoomOf(anchor)), aCtr=aRm?roomCtr(aRm):anchor, aLab=aRm?aRm.lab:null;
  const w=wallSnap(anchor,aCtr,0.03), fr={ax:{x:w.ux,y:w.uy},n:{x:w.nx,y:w.ny}};
  const cf=addDev('idrico','collfred',w.x-w.ux*0.16,w.y-w.uy*0.16,aLab,Object.assign({vie:AF.length},fr));
  const cc=addDev('idrico','collcald',w.x+w.ux*0.16,w.y+w.uy*0.16,aLab,Object.assign({vie:AC.length},fr));
  P.gen=cf;
  /* --- produttore di acqua calda e ingresso della rete --- */
  const sa=addDev('idrico','scaldacqua',w.x+w.ux*0.80,w.y+w.uy*0.80,aLab,Object.assign({},fr));
  const b=S.bbox, cn=addDev('idrico','contatore',clmp(cf.x,b.x0+0.3,b.x1-0.3),b.y0-0.55,null,{ax:{x:1,y:0},n:{x:0,y:1}});
  const zC=IMPK.collfred.z, zH=IMPK.collcald.z;

  P.run.push({id:uid(),sys:'idrico',circ:'acqua fredda',t:'primario',zs:zC,ze:0.20,pts:manhattan({x:cf.x,y:cf.y},{x:sa.x,y:sa.y})});
  P.run.push({id:uid(),sys:'idrico',circ:'acqua calda',t:'primario',zs:1.20,ze:zH,pts:offsetPath(manhattanAlt({x:sa.x,y:sa.y},{x:cc.x,y:cc.y}),0.05)});
  /* --- impianto a collettori: ogni utenza ha la sua linea dedicata, calda e/o fredda --- */
