        const o=arr[arr.length-1]; if(o&&o.s===s) o.w*=k; }); }
    s.nApp=cand.length;
  });
  ST.trave.forEach(t=>{
    const L=levels.find(l=>l.id===t.liv)||levels[0];
    const pp=GAMMA_CA*t.b_*t.h;                                   // peso proprio
    const hMur=Math.max(0,(L?L.h:3)-t.h);
    /* la tamponatura pesa solo sulle travi che stanno davvero su un muro:
       quelle aggiunte per completare la maglia attraversano i vani, sopra non c'è nulla */
    const muro=(t.suMuro===false)?0:hMur*t.b_*(+S.strCfg.gMuro||8.0);
    let g1S=0,g2S=0,qkS=0;
    const lst=infl.get(t.id)||[];
    lst.forEach(o=>{ g1S+=o.s.g1*o.w; g2S+=o.s.g2*o.w; qkS+=o.s.qk*o.w; });
    t.infl=lst.reduce((a,o)=>a+o.w,0);
    t.qPp=pp; t.qMuro=muro;
    t.g1=pp+g1S; t.g2=muro+g2S; t.qk=qkS;
    t.qSis=t.g1+t.g2+PSI2*t.qk;                                   // massa e gravità in combinazione sismica
    t.qSolK=t.qSis-pp-muro;
    t.q=1.3*t.g1+1.5*t.g2+1.5*t.qk;                               // SLU gravitazionale
    t.qSle=t.qSis;
  });
}

/* ---------- combinazioni ---------- */
/* somma pesata delle sollecitazioni di estremità di un elemento */
function combF(R,i,c){
  const f=new Float64Array(12);
  for(const k in c){ const r=R[k], a=c[k]; if(!r||!a) continue;
    const g=r.forces[i]; for(let j=0;j<12;j++) f[j]+=a*g[j]; }
  return f;
}
function combU(R,c,g){ let s=0;
  for(const k in c){ const r=R[k]; if(r&&c[k]) s+=c[k]*r.u[g]; } return s; }
/* carico distribuito risultante su una trave per una data combinazione */
function combW(t,c){ return (c.G1||0)*t.g1+(c.G2||0)*t.g2+(c.Q||0)*t.qk; }
/* le 16 combinazioni sismiche: E principale ± 0,3·E ortogonale, con l'eccentricità
   accidentale in entrambi i versi (NTC 2018 §3.2.5.1 e §7.3.5) */
function combSismiche(aX,aY,tag){
  const out=[];
  const dir=[['EX','EY','TX','TY'],['EY','EX','TY','TX']];
  const amp=[[aX,aY,aX,aY],[aY,aX,aY,aX]];
  for(let d=0;d<2;d++) for(const s1 of [1,-1]) for(const s2 of [1,-1]) for(const st of [1,-1]){
    const c={G1:1,G2:1,Q:PSI2};
    c[dir[d][0]]=s1*amp[d][0];
    c[dir[d][1]]=s2*0.3*amp[d][1];
    c[dir[d][2]]=st*amp[d][2];
    c[dir[d][3]]=st*0.3*amp[d][3];
    out.push({n:(tag||'SLV')+(d?'Y':'X')+(s1>0?'+':'−')+(s2>0?'+':'−')+(st>0?'e':'E'),c,dir:d});
  }
  return out;
}

/* ---------- analisi sismica lineare statica su telaio spaziale ---------- */
function analisiSismica(ST,levels){
  const C=S.strCfg;
  if(!ST.pil.length||!ST.trave.length) return null;
  const M=buildFrame(); if(!M||!M.elems.length) return null;
  const PS=pesiSismici(M);
  const Wtot=PS.piani.reduce((s,p)=>s+p.W,0);
  if(!(Wtot>0)) return null;
  const bb=strBBox(ST), Lx=bb.x1-bb.x0, Ly=bb.y1-bb.y0;
  const ecc=clmp(+C.ecc||0.05,0,0.15), zB=levels[0].quota;
  /* --- casi di carico elementari --- */
  const names=['G1','G2','Q','EX','EY','TX','TY','RX','RY'];
  const cases=names.map(n=>({name:n,nodal:[]}));
  const CS={}; cases.forEach(c=>CS[c.name]=c);
  M.elems.forEach(e=>{ if(e.kind==='trave'){ const t=e.ref;
      e.w.G1=t.g1; e.w.G2=t.g2; e.w.Q=t.qk; } });
  /* peso proprio dei pilastri tutto sul nodo di sommità: sul nodo di base andrebbe
     direttamente in fondazione e sparirebbe dallo sforzo normale dell'asta */
  M.elems.forEach(e=>{ if(e.kind!=='pil') return; const p=e.ref;
    CS.G1.nodal.push({node:e.n1,dof:2,f:-GAMMA_CA*p.b*p.h*e.L}); });
  /* forze sismiche unitarie: taglio alla base = 1 kN, distribuzione triangolare §7.3.3.2 */
  const den=PS.piani.reduce((s,p)=>s+(p.z-zB)*p.W,0);
  PS.piani.forEach(p=>{
    if(!(p.W>0)) return;
    const Fi=den>0? (p.z-zB)*p.W/den : p.W/Wtot;
    p.nodi.forEach(n=>{ const r=(p.wN[n.id]||0)/p.W; if(!r) return;
      CS.EX.nodal.push({node:n.id,dof:0,f:Fi*r});
      CS.EY.nodal.push({node:n.id,dof:1,f:Fi*r});
      CS.RX.nodal.push({node:n.id,dof:0,f:(p.wN[n.id]||0)*(p.z-zB)});
      CS.RY.nodal.push({node:n.id,dof:1,f:(p.wN[n.id]||0)*(p.z-zB)}); });
    /* eccentricità accidentale = coppia sull'impalcato rigido */
    const n0=p.nodi[0];
    if(n0){ CS.TX.nodal.push({node:n0.id,dof:5,f:-Fi*ecc*Ly});
            CS.TY.nodal.push({node:n0.id,dof:5,f: Fi*ecc*Lx}); }
  });
  const out=femSolve(M,cases); if(!out) return null;
  const R={}; cases.forEach((c,i)=>R[c.name]=out.res[i]);
  /* --- periodi propri con il quoziente di Rayleigh --- */
  const Ray=(dir,key)=>{ const u=R[key].u, g=9.81; let num=0,dd=0;
    PS.piani.forEach(p=>p.nodi.forEach(n=>{ const w=p.wN[n.id]||0; if(!w) return;
      const d=u[n.id*6+(dir==='x'?0:1)];
      num+=w*d*d; dd+=w*(p.z-zB)*d; }));
    return dd>1e-12? 2*Math.PI*Math.sqrt(num/(9.81*dd)) : null; };
  const H=Math.max(0.5,Math.max.apply(null,PS.piani.map(p=>p.z))-zB);
  const Tapp=0.075*Math.pow(H,0.75);                      // C1·H^(3/4), telai in c.a.
  const okT=t=>(t&&isFinite(t)&&t>0.02&&t<4)?t:Tapp;
  const Tx=okT(Ray('x','RX')), Ty=okT(Ray('y','RY'));
  /* --- spettro e taglio alla base --- */
  const SP=sismaPar();
  const QF=qFattore(C,levels.length,nCampate(ST,levels));
  const q=Math.max(1,QF.q);
  const lam=d=>(levels.length>=3 && d<2*SP.SLV.TC)?0.85:1.0;
  const SdX=spettro(SP.SLV,Tx,q), SdY=spettro(SP.SLV,Ty,q);
  const aX=SdX*Wtot*lam(Tx), aY=SdY*Wtot*lam(Ty);         // kN, moltiplica i casi unitari
  const SdXd=spettro(SP.SLD,Tx,1), SdYd=spettro(SP.SLD,Ty,1);
  const dX=SdXd*Wtot*lam(Tx), dY=SdYd*Wtot*lam(Ty);
  const CB=[{n:'SLU',c:{G1:1.3,G2:1.5,Q:1.5},grav:true}].concat(combSismiche(aX,aY,'SLV'));
  const CBd=combSismiche(dX,dY,'SLD');
  return {M,PS,R,Wtot,Tx,Ty,q,QF,SP,SdX,SdY,SdXd,SdYd,aX,aY,dX,dY,
          Lx,Ly,ecc,zB,levels,CB,CBd,H,
          SLE:{G1:1,G2:1,Q:PSI2}, gRdT:(C.duttilita==='A'?1.2:1.0),
          gRdP:(C.duttilita==='A'?1.3:1.1), dutt:C.duttilita||'B'};
}

/* ---------- verifiche degli elementi sul modello a telaio ---------- */
/* momento flettente (fibre tese inferiori positive) a distanza x dal nodo iniziale */
const msag=(f,qz,x)=>f[4]+f[2]*x+qz*x*x/2;

function verificaTravi(A,ST){
  const C=S.strCfg, fyk=(ACC_CA[C.acc]||ACC_CA['B450C']).fyk;
  ST.trave.forEach(t=>{ t._fem=false; });
  A.M.elems.forEach((e,i)=>{
    if(e.kind!=='trave') return;
    const t=e.ref, L=e.L; t._fem=true;
    let Mpos=0, Mn0=0, Mn1=0, Vmax=0, comb='';
    A.CB.forEach(cb=>{
      const f=combF(A.R,i,cb.c), qz=-combW(t,cb.c);
      const Ma=msag(f,qz,0), Mb=msag(f,qz,L);
      let Mm=Math.max(Ma,Mb);
      if(qz<-1e-9){ const xs=-f[2]/qz; if(xs>0&&xs<L) Mm=Math.max(Mm,msag(f,qz,xs)); }
      if(Mm>Mpos){ Mpos=Mm; comb=cb.n; }
      Mn0=Math.max(Mn0,-Ma); Mn1=Math.max(Mn1,-Mb);
      Vmax=Math.max(Vmax,Math.abs(f[2]),Math.abs(f[2]+qz*L));
    });
    /* armatura longitudinale */
    const d=Math.max(0.05,t.h-0.04);
    const AsMin74=1.4/fyk*t.b_*d*1e4;                    // §7.4.6.2.1
    const flP=armaFlex(Mpos,t.b_,t.h);
    const fl0=armaFlex(Mn0,t.b_,t.h), fl1=armaFlex(Mn1,t.b_,t.h);
    let AsB=Math.max(flP.As,AsMin74), As0=Math.max(fl0.As,AsMin74), As1=Math.max(fl1.As,AsMin74);
    if(A.dutt!=='nd'){                                   // As compressa ≥ metà della tesa
      AsB=Math.max(AsB,0.5*Math.max(As0,As1));
      As0=Math.max(As0,0.5*AsB); As1=Math.max(As1,0.5*AsB);
    }
    const AsMax=0.04*t.b_*t.h*1e4;
    t.Mpos=Mpos; t.Mneg=Math.max(Mn0,Mn1); t.M=Math.max(Mpos,t.Mneg); t.combM=comb;
    t.Mn0=Mn0; t.Mn1=Mn1;
    t.As=AsB; t.AsSup0=As0; t.AsSup1=As1;
    t.barre=scegliBarre(AsB); t.barreSup=scegliBarre(Math.max(As0,As1));
    /* momenti resistenti effettivi con le barre scelte */
    const cm=x=>x/1e4;
    t.MRdPos=mrdOf(t.b_,t.h,cm(t.barreSup.tot),cm(t.barre.tot),0).MRd;
    t.MRdNeg=mrdOf(t.b_,t.h,cm(t.barre.tot),cm(t.barreSup.tot),0).MRd;
    /* taglio: gerarchia delle resistenze §7.4.4.1.1 */
    let Vd=Vmax;
    if(A.dutt!=='nd'){
      const Vg=t.qSis*L/2;
      Vd=Math.max(Vmax, A.gRdT*(t.MRdPos+t.MRdNeg)/L+Vg);
      t.Vcap=A.gRdT*(t.MRdPos+t.MRdNeg)/L+Vg;
    }
    t.V=Vd;
    const ta=verTaglio(Vd,t.b_,t.h,AsB); t.taglio=ta;
    /* staffe in zona critica: passo ≤ min(d/4, 175 mm, 6·ø, 24·øst) §7.4.6.2.1 */
    if(A.dutt!=='nd'){
      const pc=Math.min(d/4,0.175,6*(t.barre.phi/1000),24*((ta.phi||8)/1000));
      t.lCrit=Math.max(t.h,0.45); t.passoCrit=Math.max(0.05,Math.floor(pc*100)/100);
      if(ta.staffe) ta.passo=Math.min(ta.passo,t.passoCrit);
    }
    /* freccia in combinazione quasi permanente, tenendo conto della continuità */
    const EI=EcmOf()*1000*(t.b_*Math.pow(t.h,3)/12)*(C.fessurato===false?1:0.5);
    const fs=combF(A.R,i,A.SLE), qs=-combW(t,A.SLE);
    const Ma=msag(fs,qs,0), Mb=msag(fs,qs,L);
    t.frecc=Math.abs(5*t.qSle*Math.pow(L,4)/(384*EI)+(Ma+Mb)*L*L/(16*EI))*1000;
    t.frLim=L/250*1000;
    /* duttilità in zona critica: ρ ≤ ρ' + 0,0018·fcd/(μφ·εsyd·fyd) — EC8 §5.4.3.1.2 */
    let duttOk=true;
    if(A.dutt!=='nd'){
      const esyd=fydOf()/200000;
      const muF=(A.Tx>=A.SP.SLV.TC)?(2*A.QF.q0*A.QF.Kr-1)
                :(1+2*(A.QF.q0*A.QF.Kr-1)*A.SP.SLV.TC/Math.max(0.05,A.Tx));
      t.muF=muF;
      t.rho=Math.max(As0,As1)/1e4/(t.b_*d);
      t.rhoP=AsB/1e4/(t.b_*d);
      t.rhoMax=t.rhoP+0.0018*fcdOf()/(Math.max(1.5,muF)*esyd*fydOf());
      duttOk=t.rho<=t.rhoMax*1.02;
      /* altezza minima che riporterebbe la sezione in campo duttile */
      if(!duttOk) t.hSugg=Math.ceil(t.h*Math.sqrt(t.rho/t.rhoMax)/0.05)*0.05;
    }
    const okAs=AsB<=AsMax&&Math.max(As0,As1)<=AsMax&&flP.mu<=0.45;
    t.ver=okAs&&ta.ok&&duttOk&&t.frecc<=t.frLim;
    t.nota=!okAs?'flessione: sezione insufficiente'
      :(!duttOk?'poco duttile: ρ='+nf(t.rho*100,2)+' % oltre '+nf(t.rhoMax*100,2)
                +' % — porta l\'altezza a '+Math.round(t.hSugg*100)+' cm'
      :(!ta.ok?'taglio: bielle compresse insufficienti'
      :(t.frecc>t.frLim?'freccia '+nf(t.frecc,1)+' mm > L/250':'')));
  });
  /* travi che non sono entrate nel modello: estremi coincidenti o quota sbagliata */
  ST.trave.forEach(t=>{ if(t._fem) { delete t._fem; return; }
    delete t._fem; t.ver=false; t.M=0; t.V=0;
    t.nota='non collegata al telaio: controlla gli estremi'; });
}
/* somma dei momenti resistenti delle travi che convergono in un nodo */
function nodoTravi(A,nodeId){
  let sum=0; const el=[];
  A.M.elems.forEach((e,i)=>{ if(e.kind!=='trave') return;
    if(e.n0!==nodeId&&e.n1!==nodeId) return;
    const t=e.ref; sum+=Math.max(t.MRdPos||0,t.MRdNeg||0); el.push({e,i,t}); });
  return {sum,el};
}
function verificaPilastri(A,ST){
  const C=S.strCfg, dutt=A.dutt;
  const idx=[]; A.M.elems.forEach((e,i)=>{ if(e.kind==='pil') idx.push({e,i}); });
  /* --- sollecitazioni di inviluppo, combinazione per combinazione --- */
  idx.forEach(o=>{
    const e=o.e, p=e.ref, sol=[];
    A.CB.forEach(cb=>{
      const f=combF(A.R,o.i,cb.c);
      const N=f[0];
      sol.push({n:cb.n,N,My:Math.abs(f[4]),Mz:Math.abs(f[5]),end:0});
      sol.push({n:cb.n,N,My:Math.abs(f[10]),Mz:Math.abs(f[11]),end:1});
    });
    p._sol=sol; p._alfa=1;
    p.N=Math.max.apply(null,sol.map(s=>s.N));
    p.Nmin=Math.min.apply(null,sol.map(s=>s.N));
    p.My=Math.max.apply(null,sol.map(s=>s.My));
    p.Mz=Math.max.apply(null,sol.map(s=>s.Mz));
  });
  /* --- gerarchia delle resistenze: amplificazione dei momenti §7.4.4.2.1 --- */
  if(dutt!=='nd'){
    const nLast=A.levels[A.levels.length-1];
    idx.forEach(o=>{
      const e=o.e, p=e.ref;
      [[e.n1,1],[e.n0,0]].forEach(([nd,end])=>{
        const base=(A.M.nodes[nd].fix===true);
        const top=(p.liv===nLast.id&&end===1);
        if(base||top) return;                    // sezioni esentate dalla gerarchia
        const NT=nodoTravi(A,nd); if(!NT.sum) return;
        let McEd=0;
        idx.forEach(o2=>{ const e2=o2.e;
          if(e2.n0!==nd&&e2.n1!==nd) return;
          const k=(e2.n0===nd)?0:1;
          let m=0; A.CB.forEach(cb=>{ if(cb.grav) return;
            const f=combF(A.R,o2.i,cb.c);
            m=Math.max(m,Math.hypot(f[4+6*k],f[5+6*k])); });
          McEd+=m; });
        const al=clmp(A.gRdP*NT.sum/Math.max(1e-3,McEd),1,3);
        p._alfa=Math.max(p._alfa||1,al);
      });
    });
    idx.forEach(o=>{ const p=o.e.ref, a=p._alfa||1;
      p._sol.forEach(s=>{ s.My*=a; s.Mz*=a; });
      p.My*=a; p.Mz*=a; p.alfa=a; });
  }
  /* --- progetto dell'armatura: ρ crescente fino a soddisfare tutte le combinazioni --- */
  idx.forEach(o=>{
    const e=o.e, p=o.e.ref, Ac=p.b*p.h;
    const rMin=(dutt==='nd')?0.003:0.01, rMax=0.04;
    let As=rMin*Ac, ok=false, worst=null, ultima=false;
    /* la peggiore combinazione si trova subito: appena il coefficiente di sfruttamento
       supera 1 non serve completare la scansione, l'armatura va comunque aumentata */
    for(let it=0;it<26;it++){
      const Af=As/2;                                   // metà armatura per faccia
      worst=null;
      for(const s of p._sol){
        const r=pressoDeviata(p.b,p.h,Af,s.N,s.My,s.Mz);
        if(!worst||r.r>worst.r) worst={r:r.r,s,MRdy:r.MRdy,MRdz:r.MRdz};
        if(worst.r>1.0&&!ultima) break;
      }
      if(worst&&worst.r<=1.0){ ok=true; break; }
      if(ultima) break;
      As=Math.min(As*1.18,rMax*Ac);
      if(As>=rMax*Ac-1e-12) ultima=true;               // ultimo giro: scansione completa
    }
    p.As=As*1e4; p.barre=barrePil(p.As,p.b,p.h);
    p.rho=As/Ac; p.sfr=worst?worst.r:0; p.combKO=worst?worst.s.n:'';
    p.MRdy=worst?worst.MRdy:0; p.MRdz=worst?worst.MRdz:0;
    p.NRd=nrdMax(p.b,p.h,p.barre.tot/2e4);
    p.nu=p.N/Math.max(1,fcdOf()*1000*Ac);
    /* taglio: gerarchia delle resistenze §7.4.4.2.2 */
    const Afe=p.barre.tot/2e4;
    const Mc=Math.max(mrdOf(p.b,p.h,Afe,Afe,p.N).MRd, mrdOf(p.h,p.b,Afe,Afe,p.N).MRd);
    let Vd=0;
    A.CB.forEach(cb=>{ const f=combF(A.R,o.i,cb.c);
      Vd=Math.max(Vd,Math.hypot(f[1],f[2]),Math.hypot(f[7],f[8])); });
    if(dutt!=='nd') Vd=Math.max(Vd,A.gRdP*2*Mc/Math.max(0.5,e.L));
    p.V=Vd; p.McRd=Mc;
    p.taglio=verTaglio(Vd,p.b,p.h,p.As);
    p.snell=Math.max(0.4,e.L)/(Math.min(p.b,p.h)/Math.sqrt(12));
    const nuOk=(dutt==='nd')||(p.nu<=(dutt==='A'?0.55:0.65));   // §7.4.4.2.2.1
    p.ver=ok&&p.taglio.ok&&p.snell<=100&&p.rho<=0.0401&&nuOk;
    p.nota=!ok?'pressoflessione deviata non verificata (sfrutt. '+nf(p.sfr,2)+' in '+p.combKO+')'
      :(!p.taglio.ok?'taglio: bielle compresse insufficienti'
      :(!nuOk?'sforzo normale adimensionale ν='+nf(p.nu,2)+' oltre il limite'
      :(p.snell>100?'snellezza elevata':'')));
  });
  /* sollecitazioni alla base, combinazione per combinazione: servono ai plinti,
     dove N massimo e M massimo non capitano mai insieme */
  A.baseSol={};
  idx.forEach(o=>{ if(A.M.nodes[o.e.n0].fix!==true) return;
    const arr=[];
    A.CB.forEach(cb=>{ const f=combF(A.R,o.i,cb.c);
      arr.push({n:cb.n,grav:!!cb.grav,N:f[0],My:Math.abs(f[4]),Mz:Math.abs(f[5]),
                V:Math.hypot(f[1],f[2])}); });
    A.baseSol[o.e.ref.id]=arr; });
  idx.forEach(o=>{ delete o.e.ref._sol; delete o.e.ref._alfa; });
}
/* ---------- nodi trave-pilastro — §7.4.4.3 ----------
   La verifica è per direzione: nel piano di ciascuna coppia di travi opposte. Sommare
   le armature di tutte le travi convergenti, anche di quelle ortogonali, sovrastima
   di molto il taglio del nodo. */
function verificaNodi(A,ST){
  if(A.dutt==='nd'){ A.nodi=[]; return; }
  const fcd=fcdOf()*1000, fck=fckOf(), fyd=fydOf()*1000;
  const fctd=0.7*fctmOf()/GAMMA_C*1000, eta=0.6*(1-fck/250);
  const out=[];
  const pilAt={};
  A.M.elems.forEach((e,i)=>{ if(e.kind!=='pil') return;
    (pilAt[e.n1]=pilAt[e.n1]||[]).push({e,i,pos:'sotto'});
    (pilAt[e.n0]=pilAt[e.n0]||[]).push({e,i,pos:'sopra'}); });
  Object.keys(pilAt).forEach(k=>{
    const nd=+k, nodo=A.M.nodes[nd]; if(nodo.fix) return;
    const NT=nodoTravi(A,nd); if(!NT.el.length) return;
    const giu=pilAt[nd].filter(x=>x.pos==='sotto')[0];
    const su =pilAt[nd].filter(x=>x.pos==='sopra')[0];
    const col=(su||giu); if(!col) return;
    const p=col.e.ref;
    /* taglio e sforzo normale del pilastro sovrastante */
    let Vc=0, Nsup=0;
    if(su) A.CB.forEach(cb=>{ const f=combF(A.R,su.i,cb.c);
      Vc=Math.max(Vc,Math.hypot(f[1],f[2])); Nsup=Math.max(Nsup,f[0]); });
    const nud=clmp(Nsup/Math.max(1,fcd*p.b*p.h),0,0.9);
    /* le travi convergenti, con la propria direzione in pianta */
    const tr=NT.el.map(o=>{ const t=o.t;
      const dx=t.b.x-t.a.x, dy=t.b.y-t.a.y, l=Math.hypot(dx,dy)||1;
      return {t, ux:dx/l, uy:dy/l,
        sup:(t.barreSup?t.barreSup.tot:0)/1e4, inf:(t.barre?t.barre.tot:0)/1e4}; });
    let peggio=null;
    /* una direzione di verifica per ogni trave: si guarda il piano che la contiene */
    tr.forEach(r=>{
      const par=tr.filter(q=>Math.abs(q.ux*r.ux+q.uy*r.uy)>0.70);
      const interno=par.length>=2;
      const As1=Math.max.apply(null,par.map(q=>q.sup));
      const As2=interno?Math.max.apply(null,par.map(q=>q.inf)):0;
      const bw=Math.max.apply(null,par.map(q=>q.t.b_));
      const hb=Math.max.apply(null,par.map(q=>q.t.h));
      /* profondità del nodo nella direzione verificata */
      const ca=p.ang||0, cu={x:Math.cos(ca),y:Math.sin(ca)};
      const cosd=Math.abs(cu.x*r.ux+cu.y*r.uy);
      const hjc=p.h*cosd+p.b*(1-cosd);
      const bc=p.b*cosd+p.h*(1-cosd);
      const Vjbd=Math.max(0,A.gRdP*(As1+As2)*fyd-Vc);
      const bj=Math.min(Math.max(bc,bw), bw+0.5*hjc);
      const hjw=Math.max(0.10,hb-0.08);
      const VRd=eta*fcd*bj*hjc*Math.sqrt(Math.max(0.01,1-nud/eta));
      const sig=Vjbd/Math.max(1e-6,bj*hjc);
      const Ash=Math.max(0,(sig*sig/Math.max(1,fctd+nud*fcd)-fctd)*bj*hjw/fyd)*1e4;  // cm²
      const r2=Vjbd/Math.max(1,VRd);
      if(!peggio||r2>peggio.r) peggio={r:r2,Vjbd,VRd,Ash,interno,hjc,bj};
    });
    if(!peggio) return;
    out.push({node:nd,x:nodo.x,y:nodo.y,z:nodo.z,pil:p.sig,
      tipo:peggio.interno?'interno':'esterno',
      Vjbd:peggio.Vjbd,VRd:peggio.VRd,Ash:peggio.Ash,nud,ok:peggio.r<=1.0,
      nota:peggio.r<=1.0?'':'compressione diagonale del nodo insufficiente: allarga il pilastro'});
  });
  A.nodi=out;
}
/* ---------- spostamenti di interpiano e effetti del secondo ordine ---------- */
function verificaDrift(A){
  const lim=0.005;                                    // tamponamenti fragili collegati §7.3.6.1
  const piani=A.PS.piani.map((p,k)=>{
    const zSotto=k===0?A.zB:A.PS.piani[k-1].z;
    let dr=0, comb='';
    A.CBd.forEach(cb=>{
      p.nodi.forEach(n=>{
        const gx=n.id*6, base=A.M.nodes.find(m=>Math.abs(m.x-n.x)<0.01&&Math.abs(m.y-n.y)<0.01&&Math.abs(m.z-zSotto)<0.01);
        const bx=base?base.id*6:-1;
        const ux=combU(A.R,cb.c,gx)-(bx>=0?combU(A.R,cb.c,bx):0);
        const uy=combU(A.R,cb.c,gx+1)-(bx>=0?combU(A.R,cb.c,bx+1):0);
        const d=Math.hypot(ux,uy);
        if(d>dr){ dr=d; comb=cb.n; }
      });
    });
    const h=p.h, Vp=A.PS.piani.slice(k).reduce((s,q)=>s+q.W,0);
    /* taglio di piano dalla combinazione SLV più gravosa */
    let Vt=0;
    A.CB.forEach(cb=>{ if(cb.grav) return; let v=0;
      A.M.elems.forEach((e,i)=>{ if(e.kind!=='pil'||e.liv!==p.liv) return;
        const f=combF(A.R,i,cb.c); v+=Math.hypot(f[1],f[2]); });
      Vt=Math.max(Vt,v); });
    const th=Vt>0? Vp*dr/(Vt*h) : 0;
    return {liv:p.liv,z:p.z,h,dr:dr*1000,lim:lim*h*1000,W:p.W,V:Vt,theta:th,comb,
      ok:dr<=lim*h&&th<=0.30};
  });
  A.drift=piani;
  A.driftOK=piani.every(p=>p.ok);
}
/* ==================== FONDAZIONI ====================
   Tre tipologie: plinti isolati con cordoli, reticolo di travi rovesce, platea.
   La scelta cambia il modo in cui il carico arriva al terreno, quindi va calcolata,
   non solo disegnata. */
const FOND_TIPI={plinti:'Plinti isolati e cordoli',rovesce:'Travi rovesce',platea:'Platea'};
function fondCfg(){
  const C=S.strCfg;
  return {tipo:C.fondTipo||'plinti',
          sAmm:clmp(+C.sigmaT||150,20,1000),
          prof:clmp(+C.fondProf||1.00,0.30,5),
          bMin:clmp(+C.fondBmin||0.80,0.40,3),
          spMin:clmp(+C.fondSpMin||0.40,0.25,1.5),
          cordB:clmp(+C.cordB||0.30,0.20,0.80),
          cordH:clmp(+C.cordH||0.50,0.30,1.20),
          parz:C.fondParz!==false,
          gTerr:clmp(+C.gTerreno||18,10,25)};
}
/* carichi alla base di ogni pilastro del livello più basso, combinazione per combinazione */
function caricoBase(ST,A,p){
  const l=(A&&A.baseSol&&A.baseSol[p.id]);
  if(l&&l.length) return l;
  return [{n:'SLU',grav:true,N:p.N||0,My:p.My||0,Mz:p.Mz||0,V:p.V||0}];
}
const Nk=s=>Math.max(0,s.N/(s.grav?1.35:1.0));

function calcFondazioni(ST,A){
  const F=fondCfg();
  ST.fond={tipo:F.tipo,cfg:F};
  ST.strisce=[]; ST.platea=null;
  if(F.tipo==='rovesce') calcRovesce(ST,A,F);
  else if(F.tipo==='platea') calcPlatea(ST,A,F);
  else { ensurePlinti(ST); calcPlinti(ST,A); return; }
  /* con travi rovesce o platea i plinti non servono più */
  ST.plinto=[]; ST.cordolo=[];
}

/* ---------- travi rovesce: reticolo nelle due direzioni ---------- */
function calcRovesce(ST,A,F){
  const levels=strLevels(), L0=levels[0]; if(!L0) return;
  const P=ST.pil.filter(p=>p.liv===L0.id); if(P.length<2) return;
  const axes=STR_AXES||structAxes();
  const dirs=direzioniMaglia(axes), u=dirs[0], v=dirs[1];
  const pu=p=>p.x*u.ux+p.y*u.uy, pv=p=>p.x*v.ux+p.y*v.uy;
  const fcd=fcdOf()*1000, fyd=fydOf()*1000;
  const strisce=[];
  /* i pilastri si raggruppano in file nelle due direzioni */
  const file=(coord,lungo)=>{
    const ord=P.slice().sort((a,b)=>coord(a)-coord(b)), gr=[];
    ord.forEach(p=>{ const g=gr[gr.length-1];
      if(g&&coord(p)-g.s<=0.40) g.p.push(p); else gr.push({s:coord(p),p:[p]}); });
    return gr.filter(g=>g.p.length>=2).map(g=>({s:g.s,p:g.p.sort((a,b)=>lungo(a)-lungo(b))}));
  };
  const fu=file(pv,pu), fv=file(pu,pv);          // file lungo u, file lungo v
  /* un pilastro che sta su due travi divide il carico fra le due */
  const quota={};
  P.forEach(p=>{ let n=0;
    fu.forEach(g=>{ if(g.p.indexOf(p)>=0) n++; });
    fv.forEach(g=>{ if(g.p.indexOf(p)>=0) n++; });
    quota[p.id]=n>0?1/n:1; });
  const costruisci=(g,dir,lungo)=>{
    const pil=g.p, n=pil.length;
    const t0=lungo(pil[0]), t1=lungo(pil[n-1]);
    const spor=0.40;                                   // sbalzo oltre l'ultimo pilastro
    const L=Math.max(1,t1-t0+2*spor);
    let Nt=0, Ntd=0, luceMax=0;
    pil.forEach((p,i)=>{
      const list=caricoBase(ST,A,p);
      let nk=0, nd=0;
      list.forEach(s=>{ nk=Math.max(nk,Nk(s)); nd=Math.max(nd,s.N); });
      Nt+=nk*quota[p.id]; Ntd+=nd*quota[p.id];
      if(i) luceMax=Math.max(luceMax,lungo(pil[i])-lungo(pil[i-1]));
    });
    const B=clmp(Math.ceil(Nt/(L*F.sAmm)/0.05)*0.05,F.bMin,4.0);
    const sigma=Nt/(B*L);
    const H=clmp(Math.ceil(Math.max(luceMax/8,0.60)/0.05)*0.05,0.60,1.60);
    /* reazione del terreno fra i pilastri: la trave si inflette con le fibre tese in alto */
    const q=Ntd/L;                                     // kN/m di calcolo
    const M=q*luceMax*luceMax/10, V=q*luceMax/2;
    const bAn=clmp(Math.max(F.cordB,0.30),0.25,0.80);  // anima
    const flS=armaFlex(M,bAn,H), flI=armaFlex(M*0.6,B,H);
    const ta=verTaglio(V,bAn,H,flS.As);
    /* mensola trasversale della suola */
    const c=Math.max(0.05,(B-bAn)/2), Ms=sigma*1.35*c*c/2;
    const flT=armaFlex(Ms,1.0,H*0.6);
    strisce.push({id:uid(),dir,s:g.s,
      a:{x:pil[0].x-(dir==='u'?u.ux:v.ux)*spor, y:pil[0].y-(dir==='u'?u.uy:v.uy)*spor},
      b:{x:pil[n-1].x+(dir==='u'?u.ux:v.ux)*spor, y:pil[n-1].y+(dir==='u'?u.uy:v.uy)*spor},
      ux:(dir==='u'?u.ux:v.ux), uy:(dir==='u'?u.uy:v.uy),
      L,B,H,bAn,nPil:n,luceMax,N:Nt,q,M,V,sigma,
      AsSup:flS.As,barreSup:scegliBarre(flS.As),
      AsInf:flI.As,barreInf:scegliBarre(flI.As),
      AsTrasv:flT.As,taglio:ta,
      hSuola:Math.min(H*0.5,0.45),
      vol:B*Math.min(H*0.5,0.45)*L + bAn*(H-Math.min(H*0.5,0.45))*L,
      kg:((flS.As+flI.As)/1e4*L + flT.As/1e4*L*B)*7850
         + Math.ceil(L/0.20)*(2*(bAn-0.06)+2*(H-0.06))*Math.PI*64/400/1e4*7850,
      sig:'TR'+(strisce.length+1),
      ver:sigma<=F.sAmm*1.001&&flS.ok&&ta.ok&&flT.ok,
      nota:sigma>F.sAmm?'tensione '+nf(sigma,0)+' > '+nf(F.sAmm,0)+' kPa'
        :(!flS.ok?'sezione insufficiente a flessione'
        :(!ta.ok?'taglio insufficiente':(!flT.ok?'suola troppo sottile':'')))});
  };
  fu.forEach(g=>costruisci(g,'u',pu));
  fv.forEach(g=>costruisci(g,'v',pv));
  ST.strisce=strisce;
  /* pressione media sull'impronta complessiva */
  let area=0, Ntot=0;
  strisce.forEach(t=>{ area+=t.B*t.L; Ntot+=t.N; });
  ST.fond.area=area; ST.fond.N=Ntot;
  ST.fond.sigma=area>0?Ntot/area:0;
  ST.fond.ver=strisce.every(t=>t.ver);
}

/* ---------- platea ---------- */
function calcPlatea(ST,A,F){
  const levels=strLevels(), L0=levels[0]; if(!L0) return;
  const P=ST.pil.filter(p=>p.liv===L0.id); if(!P.length) return;
  const fck=fckOf();
  /* impronta: le celle della sagoma, con uno sbalzo attorno */
  let area=0;
  if(SAG){ for(let k=0;k<SAG.m.length;k++) if(SAG.m[k]) area+=SAG.cs*SAG.cs; }
  if(!(area>1)){ const b=S.bbox; area=b.w*b.h; }
  let Nk_=0, Nd=0, Nmax=0, pMax=null;
  P.forEach(p=>{ const list=caricoBase(ST,A,p);
    let nk=0, nd=0;
    list.forEach(s=>{ nk=Math.max(nk,Nk(s)); nd=Math.max(nd,s.N); });
    Nk_+=nk; Nd+=nd;
    if(nd>Nmax){ Nmax=nd; pMax=p; } });
  /* luce media fra i pilastri, per la flessione della piastra */
  let luce=0;
  P.forEach(a=>{ let d=1e9; P.forEach(b=>{ if(a===b) return;
    d=Math.min(d,Math.hypot(a.x-b.x,a.y-b.y)); }); if(d<1e8) luce=Math.max(luce,d); });
  luce=clmp(luce,2,9);
  /* spessore dal punzonamento del pilastro più caricato */
  let sp=clmp(+S.strCfg.fondSpMin||0.40,0.25,1.5), punz=false, u1=0, vRd=0, Vp=0;
  for(let i=0;i<26;i++){
    const d=Math.max(0.10,sp-0.06);
    const bp=pMax?pMax.b:0.3, hp=pMax?pMax.h:0.3;
    u1=2*(bp+hp)+4*Math.PI*d;
    Vp=Nmax*(1-Math.min(1,(bp+4*d)*(hp+4*d)/Math.max(0.01,area)));
    const rho=0.006, kk=Math.min(2,1+Math.sqrt(0.2/d));
    vRd=Math.max(0.18/GAMMA_C*kk*Math.pow(100*rho*fck,1/3),
                 0.035*Math.pow(kk,1.5)*Math.sqrt(fck))*1000;
    if(Vp<=vRd*u1*d){ punz=true; break; }
    sp=+(sp+0.05).toFixed(2); if(sp>1.5) break;
  }
  const sigma=Nk_/area + GAMMA_CA*sp;                  // il peso proprio grava sul terreno
  const qd=Nd/area + 1.3*GAMMA_CA*sp;
  const M=qd*luce*luce/10;                             // piastra continua, valore di massima
  const fl=armaFlex(M,1.0,sp);
  ST.platea={area,sp,sigma,sigmaAmm:F.sAmm,N:Nk_,luce,M,
    vol:area*sp, kg:fl.As/1e4*area*2*2*7850,
    As:fl.As,barre:scegliBarre(fl.As),
    Vpunz:Vp,VRdp:vRd*u1*Math.max(0.10,sp-0.06),punz,
    pilMax:pMax?pMax.sig:'',
    ver:sigma<=F.sAmm*1.001&&fl.ok&&punz,
    nota:sigma>F.sAmm?'tensione media '+nf(sigma,0)+' > '+nf(F.sAmm,0)+' kPa'
      :(!punz?'punzonamento: spessore insufficiente sotto '+(pMax?pMax.sig:'')
      :(!fl.ok?'flessione: aumenta lo spessore':''))};
  ST.fond.area=area; ST.fond.N=Nk_; ST.fond.sigma=sigma; ST.fond.ver=ST.platea.ver;
}

/* I plinti seguono i pilastri del livello più basso: uno per pilastro, sempre.
   Vanno ricreati qui e non solo alla generazione, perché scegliendo le travi rovesce
   o la platea l'elenco viene svuotato: senza questo, tornando ai plinti non ne
   resterebbe nessuno. */
function ensurePlinti(ST){
  const L0=strLevels()[0]; if(!L0) return;
  const base=ST.pil.filter(p=>p.liv===L0.id);
  const vivi=new Set(base.map(p=>p.id));
  ST.plinto=ST.plinto.filter(pl=>vivi.has(pl.pil));      // via quelli senza pilastro
  const gia=new Set(ST.plinto.map(pl=>pl.pil));
  base.forEach(p=>{ if(gia.has(p.id)) return;
    ST.plinto.push({id:uid(),pil:p.id,x:p.x,y:p.y,b:0.9,h:0.9,sp:0.5,N:0,sigma:0,ver:null}); });
}
/* ---------- fondazioni: plinti e cordoli di collegamento ---------- */
/* tensione massima sul terreno di un plinto quadrato caricato eccentricamente:
   dentro il terzo medio la distribuzione è trapezia, fuori si parzializza. */
function sigmaTerreno(N,M,lato){
  const e=Math.abs(M)/Math.max(1e-6,N);
  if(e<=lato/6) return {smax:N/(lato*lato)+Math.abs(M)/(lato*lato*lato/6),
                        smin:N/(lato*lato)-Math.abs(M)/(lato*lato*lato/6), e, parz:false};
  if(e<lato/2)  return {smax:2*N/(3*lato*(lato/2-e)), smin:0, e, parz:true};
  return {smax:Infinity, smin:0, e, parz:true};
}
/* stato tensionale del plinto per una serie di combinazioni: in combinazione
   gravitazionale la risultante deve restare nel terzo medio, in combinazione sismica
   è ammessa la parzializzazione e la portanza si può contare maggiorata. */
function provaPlinto(list,lato,sp,sAmm){
  const Wp=GAMMA_CA*lato*lato*sp;
  let ok=true, smax=0, emax=0, parz=false, worst='', sd=0;
  for(const s of list){
    const f=s.grav?1.35:1.0;                    // in combinazione sismica i carichi sono già caratteristici
    const Nk=Math.max(1,s.N/f+Wp), Mk=Math.hypot(s.My,s.Mz)/f+(s.V/f)*sp;
    const r=sigmaTerreno(Nk,Mk,lato);
    const lim=s.grav?lato/6:lato/3;
    const sLim=s.grav?sAmm:sAmm*1.5;            // azione sismica transitoria
    if(r.smax>smax){ smax=r.smax; worst=s.n; }
    if(r.e>emax) emax=r.e;
    if(r.parz) parz=true;
    if(!(r.smax<=sLim*1.001 && r.e<=lim+1e-9)) ok=false;
    /* pressione di calcolo per il progetto dell'armatura */
    const rd=sigmaTerreno(Math.max(1,s.N+1.3*Wp),Math.hypot(s.My,s.Mz)+s.V*sp,lato);
    if(isFinite(rd.smax)) sd=Math.max(sd,rd.smax);
  }
  return {ok,smax,emax,parz,worst,sd};
}
function calcPlinti(ST,A){
  const sAmm=clmp(+S.strCfg.sigmaT||150,50,600);
  ST.plinto.forEach(pl=>{
    const p=ST.pil.find(x=>x.id===pl.pil); if(!p) return;
    const list=(A&&A.baseSol&&A.baseSol[p.id])
      ||[{n:'SLU',grav:true,N:p.N||0,My:p.My||0,Mz:p.Mz||0,V:p.V||0}];
    const FC=fondCfg();
    let lato=Math.max(FC.bMin,Math.ceil(Math.sqrt(Math.max(1,p.N||0)/1.35/sAmm)/0.1)*0.1);
    let sp=FC.spMin, r=null;
    for(let i=0;i<40;i++){
      sp=Math.max(FC.spMin,Math.ceil(lato*0.35/0.05)*0.05);
      r=provaPlinto(list,lato,sp,sAmm);
      if(r.ok) break;
      lato+=0.1;
      if(lato>3.0) break;                       // oltre non è più un plinto isolato
    }
    const A2=lato*lato;
    pl.N=Math.max.apply(null,list.map(s=>s.N));
    pl.M=Math.max.apply(null,list.map(s=>Math.hypot(s.My,s.Mz)+s.V*sp));
    pl.b=lato; pl.h=lato; pl.sp=sp; pl.comb=r.worst;
    pl.sigma=isFinite(r.smax)?r.smax:9e9; pl.sigmaMin=0;
    pl.ecc=r.emax; pl.parz=r.parz; pl.grande=lato>3.0;
    /* armatura inferiore: mensola dalla faccia del pilastro, per metro di larghezza */
    const c=Math.max(0.05,(lato-p.h)/2);
    const Mp=Math.min(r.sd,6*sAmm)*c*c/2;                     // kNm/m
    const fl=armaFlex(Mp,1.0,sp);
    pl.Mp=Mp; pl.As=fl.As; pl.barre=scegliBarre(fl.As);       // cm²/m, nelle due direzioni
    /* punzonamento sul perimetro critico a 2d dalla faccia del pilastro — EC2 §6.4 */
    const dEff=Math.max(0.10,sp-0.06);
    const u1=2*(p.b+p.h)+4*Math.PI*dEff;
    const Ain=Math.min(A2,(p.b+4*dEff)*(p.h+4*dEff));
    const Vp=Math.max(0,(p.N||Nk*gam)*(1-Ain/A2));
    const rho=Math.min(0.02,(pl.As/1e4)/dEff);
    const kk=Math.min(2,1+Math.sqrt(0.2/dEff));
    const vRd=Math.max(0.18/GAMMA_C*kk*Math.pow(100*rho*fckOf(),1/3),
                       0.035*Math.pow(kk,1.5)*Math.sqrt(fckOf()))*1000;   // kPa
    pl.Vpunz=Vp; pl.VRdp=vRd*u1*dEff; pl.punz=Vp<=pl.VRdp;
    pl.ver=r.ok&&fl.ok&&pl.punz;
    pl.nota=!r.ok?(pl.grande
        ?'plinto isolato insufficiente: servono travi rovesce o una platea'
        :'terreno insufficiente in '+esc(r.worst)+': σ '+nf(pl.sigma,0)+' kPa, e '+nf(pl.ecc,2)+' m')
      :(!pl.punz?'punzonamento: aumenta lo spessore'
      :(!fl.ok?'flessione del plinto'
      :(pl.parz?'terreno parzializzato sotto sisma — ammesso':'')));
  });
  /* plinti che si compenetrano: è il segnale che serve una fondazione continua */
  let sov=0;
  for(let i=0;i<ST.plinto.length;i++) for(let j=i+1;j<ST.plinto.length;j++){
    const a=ST.plinto[i], b=ST.plinto[j];
    if(Math.hypot(a.x-b.x,a.y-b.y) < (a.b+b.b)/2-0.02){ sov++; a.sovr=b.sovr=true; }
  }
  ST.fondNota=sov?sov+' coppie di plinti si sovrappongono: conviene passare a travi rovesce o a una platea.':'';
  if((S.strCfg.fondTipo||'plinti')==='plinti') calcCordoli(ST,A); else ST.cordolo=[];
}
/* Collegamenti fra i plinti: obbligatori in zona sismica. Vanno dimensionati per uno
   sforzo assiale di trazione/compressione proporzionale a ag·S e allo sforzo normale
   del pilastro più caricato (EC8-5 §5.4.1.2, richiamato da NTC 2018 §7.2.5.1). */
const K_COLL={A:0.30,B:0.40,C:0.60,D:0.80,E:0.80};
function calcCordoli(ST,A){
  ST.cordolo=[];
  const levels=strLevels(), L0=levels[0]; if(!L0) return;
  if(!A){ return; }
  const k=K_COLL[A.SP.cat]||0.60, agS=A.SP.SLV.ag*A.SP.SLV.S;
  const fyd=fydOf()*1000, fcd=fcdOf()*1000;
  const bC=0.30, hC=0.50;
  ST.trave.filter(t=>t.liv===L0.id).forEach(t=>{
    const pa=ST.pil.find(p=>p.liv===L0.id&&Math.hypot(p.x-t.a.x,p.y-t.a.y)<0.4);
    const pb=ST.pil.find(p=>p.liv===L0.id&&Math.hypot(p.x-t.b.x,p.y-t.b.y)<0.4);
    if(!pa||!pb) return;
    const Nmax=Math.max(pa.N||0,pb.N||0);
    const Nc=k*agS*Nmax;                                   // kN, in trazione e compressione
    const As=Math.max(Nc/fyd*1e4, 0.003*bC*hC*1e4);        // cm²
    const barre=scegliBarre(As/2);                          // metà per lembo
    const NRd=2*barre.tot/1e4*fyd;
    ST.cordolo.push({id:uid(),a:t.a,b:t.b,len:t.len,b_:bC,h:hC,sig:'C'+t.sig.slice(1),
      N:Nc,As,barre,NRd,ver:NRd>=Nc, k, agS,
      nota:NRd>=Nc?'':'armatura insufficiente per il tiro di collegamento'});
  });
}
/* ---------- percorso di riserva: soli carichi verticali ---------- */
function calcVerticale(ST,levels){
  const gruppi={};
  ST.trave.forEach(t=>{ const k=t.liv+'|'+t.ax; (gruppi[k]=gruppi[k]||[]).push(t); });
  Object.values(gruppi).forEach(g=>{
    g.sort((p,q)=>Math.hypot(p.a.x-g[0].a.x,p.a.y-g[0].a.y)-Math.hypot(q.a.x-g[0].a.x,q.a.y-g[0].a.y));
    const EI=EcmOf()*1000*(g[0].b_*Math.pow(g[0].h,3)/12);
    const res=contBeam(g.map(t=>t.len),g.map(t=>t.q),EI);
    if(!res) return;
    res.campate.forEach((c,i)=>{
      const t=g[i];
      t.Mpos=c.Mpos; t.Mneg=Math.abs(c.Mneg); t.M=Math.max(c.Mpos,Math.abs(c.Mneg));
      t.V=Math.max(Math.abs(c.V0),Math.abs(c.V1));
      t.R0=Math.abs(c.V0); t.R1=Math.abs(c.V1);
      const fl=armaFlex(t.M,t.b_,t.h);
      t.As=fl.As; t.barre=scegliBarre(fl.As); t.barreSup=t.barre;
      const ta=verTaglio(t.V,t.b_,t.h,fl.As); t.taglio=ta;
      t.frecc=5*t.qSle*Math.pow(t.len,4)/(384*EI)*1000; t.frLim=t.len/250*1000;
      t.ver=fl.ok&&ta.ok&&t.frecc<=t.frLim;
      t.nota=!fl.ok?'flessione: sezione insufficiente'
        :(!ta.ok?'taglio: bielle compresse insufficienti'
        :(t.frecc>t.frLim?'freccia '+nf(t.frecc,1)+' mm > L/250':''));
    });
  });
  const acc={};
  levels.slice().reverse().forEach(L=>{
    ST.pil.filter(p=>p.liv===L.id).forEach(p=>{
      let N=0;
      ST.trave.filter(t=>t.liv===L.id).forEach(t=>{
        if(Math.hypot(t.a.x-p.x,t.a.y-p.y)<0.4) N+=t.R0||0;
        if(Math.hypot(t.b.x-p.x,t.b.y-p.y)<0.4) N+=t.R1||0; });
      N+=1.3*GAMMA_CA*p.b*p.h*Math.max(0.4,L.h);
      const key=Math.round(p.x*10)+'_'+Math.round(p.y*10);
      N+=acc[key]||0; acc[key]=N;
      p.N=N; p.My=0; p.Mz=0; p.alfa=1;
      const Ac=p.b*p.h, fyd=fydOf()*1000;
      const As=Math.max(0.10*N/fyd,0.003*Ac);
      p.As=As*1e4; p.barre=barrePil(p.As,p.b,p.h); p.rho=As/Ac;
      p.NRd=nrdMax(p.b,p.h,p.barre.tot/2e4);
      p.nu=N/Math.max(1,fcdOf()*1000*Ac);
      p.snell=Math.max(0.4,L.h)/(Math.min(p.b,p.h)/Math.sqrt(12));
      p.V=0; p.taglio={ok:true,staffe:false};
      p.ver=N<=p.NRd&&p.snell<=100;
      p.nota=N>p.NRd?'sezione insufficiente: N='+nf(N,0)+' > NRd='+nf(p.NRd,0)+' kN'
        :(p.snell>100?'snellezza elevata':'');
    });
  });
}

/* ---------- calcolo completo ---------- */
function calcStrutture(){
  const ST=ensureStr(); if(!ST.solaio.length&&!ST.trave.length) return;
  const AC=analisiCarichi(), levels=strLevels();
  calcSolai(ST,AC);
  caricaTravi(ST,AC,levels);
  ANA=null;
  if(S.strCfg.sisma!==false){
    try{
      const A=analisiSismica(ST,levels);
      if(A){ verificaTravi(A,ST); verificaPilastri(A,ST); verificaNodi(A,ST); verificaDrift(A); ANA=A; }
    }catch(err){ ANA=null; if(typeof console!=='undefined') console.warn('analisi sismica non riuscita',err); }
  }
  if(!ANA) calcVerticale(ST,levels);
  verificaArchitravi(ST,levels);
  calcFondazioni(ST,ANA);
  ST.esito={sisma:!!ANA, ts:Date.now()};
}

/* ---------- disegno di carpenteria (2D) ---------- */
const STR_COL={pil:'#F2A03D', trave:'#8FB4E5', solaio:'#6E7A86', plinto:'#8FB48A',
  arch:'#B694D8', ko:'#E2574C', ok:'#8FB48A'};
const strLiv=()=>{ const L=strLevels(); return S.strLiv&&L.find(x=>x.id===S.strLiv)?S.strLiv:(L[0]&&L[0].id); };
function drawStrutture(){
  const ST=S.strutt; if(!ST) return;
  const liv=strLiv(), u=S.view.sc;
  ctx.save();
  /* --- solai: campitura leggera e frecce dell'orditura --- */
  ST.solaio.filter(s=>s.liv===liv).forEach(s=>{
    const a=W2S({x:s.bb.x0,y:s.bb.y1}), b=W2S({x:s.bb.x1,y:s.bb.y0});
    ctx.strokeStyle=STR_COL.solaio; ctx.lineWidth=1*DPR; ctx.setLineDash([4*DPR,4*DPR]);
    ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y); ctx.setLineDash([]);
    ctx.globalAlpha=0.55;
    const n=clmp(Math.round((s.dir==='x'?(s.bb.y1-s.bb.y0):(s.bb.x1-s.bb.x0))/0.5),2,24);
    for(let i=1;i<n;i++){
      let p0,p1;
      if(s.dir==='x'){ const y=s.bb.y0+(s.bb.y1-s.bb.y0)*i/n;
        p0=W2S({x:s.bb.x0,y}); p1=W2S({x:s.bb.x1,y}); }
      else { const x=s.bb.x0+(s.bb.x1-s.bb.x0)*i/n;
        p0=W2S({x,y:s.bb.y0}); p1=W2S({x,y:s.bb.y1}); }
      ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
    }
    ctx.globalAlpha=1;
    if(u>18){ const c=W2S({x:(s.bb.x0+s.bb.x1)/2,y:(s.bb.y0+s.bb.y1)/2});
      ctx.fillStyle=s.ver===false?STR_COL.ko:'#AEB8C2';
      ctx.font=`${8.5*DPR}px 'IBM Plex Mono',monospace`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('S '+Math.round(s.h*100)+' · L '+nf(s.luce,2),c.x,c.y+16*DPR); }
  });
  /* --- travi: sagoma reale in pianta, tratteggiata come da carpenteria --- */
  ST.trave.filter(t=>t.liv===liv).forEach(t=>{
    const L=Math.hypot(t.b.x-t.a.x,t.b.y-t.a.y)||1;
    const ux=(t.b.x-t.a.x)/L, uy=(t.b.y-t.a.y)/L, nx=-uy*t.b_/2, ny=ux*t.b_/2;
    const P=[{x:t.a.x+nx,y:t.a.y+ny},{x:t.b.x+nx,y:t.b.y+ny},
             {x:t.b.x-nx,y:t.b.y-ny},{x:t.a.x-nx,y:t.a.y-ny}];
    ctx.beginPath(); P.forEach((p,i)=>{const q=W2S(p); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});
    ctx.closePath();
    ctx.fillStyle=(t.ver===false?STR_COL.ko:STR_COL.trave)+'22'; ctx.fill();
    ctx.strokeStyle=t.ver===false?STR_COL.ko:STR_COL.trave;
    ctx.lineWidth=(S.strSel===t.id?2.2:1.3)*DPR; ctx.setLineDash([6*DPR,3*DPR]); ctx.stroke();
    ctx.setLineDash([]);
    if(u>22){ const c=W2S({x:(t.a.x+t.b.x)/2,y:(t.a.y+t.b.y)/2});
      ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(Math.atan2(-uy,ux));
      ctx.fillStyle=t.ver===false?STR_COL.ko:'#CBD5E1';
      ctx.font=`${8*DPR}px 'IBM Plex Mono',monospace`; ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillText(t.sig+' '+Math.round(t.b_*100)+'×'+Math.round(t.h*100),0,-3*DPR);
      ctx.restore(); }
  });
  /* --- pilastri: sezione piena, come si disegna in carpenteria --- */
  ST.pil.filter(p=>p.liv===liv).forEach(p=>{
    const q=W2S({x:p.x,y:p.y}), w=Math.max(5*DPR,p.b*u), h=Math.max(5*DPR,p.h*u);
    ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(-(p.ang||0));
    ctx.beginPath(); ctx.rect(-w/2,-h/2,w,h);
    ctx.fillStyle=p.ver===false?STR_COL.ko+'55':STR_COL.pil+'55'; ctx.fill();
    ctx.strokeStyle=p.ver===false?STR_COL.ko:STR_COL.pil;
    ctx.lineWidth=(S.strSel===p.id?2.4:1.6)*DPR; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-w/2,-h/2); ctx.lineTo(w/2,h/2);
    ctx.moveTo(-w/2,h/2); ctx.lineTo(w/2,-h/2); ctx.lineWidth=DPR; ctx.stroke();
    ctx.restore();
    if(u>22){ ctx.fillStyle=p.ver===false?STR_COL.ko:'#F2C24D';
      ctx.font=`600 ${8*DPR}px 'IBM Plex Mono',monospace`; ctx.textAlign='left'; ctx.textBaseline='bottom';
      ctx.fillText(p.sig,q.x+w/2+3*DPR,q.y-h/2-2*DPR); }
  });
  /* --- fondazioni continue: travi rovesce e platea --- */
  if(ST.platea&&liv===strLevels()[0].id){
    const b=S.bbox, a=W2S({x:b.x0,y:b.y1}), c=W2S({x:b.x1,y:b.y0});
    ctx.strokeStyle=ST.platea.ver===false?STR_COL.ko:STR_COL.plinto;
    ctx.lineWidth=1.6*DPR; ctx.setLineDash([9*DPR,5*DPR]);
    ctx.strokeRect(a.x,a.y,c.x-a.x,c.y-a.y); ctx.setLineDash([]);
    if(u>10){ ctx.fillStyle=STR_COL.plinto; ctx.font=`${9*DPR}px 'IBM Plex Mono',monospace`;
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText('Platea sp '+Math.round(ST.platea.sp*100)+' cm · σ '+nf(ST.platea.sigma,0)+' kPa',
        a.x+6*DPR,a.y+6*DPR); }
  }
  (ST.strisce||[]).filter(()=>liv===strLevels()[0].id).forEach(t=>{
    const nx=-t.uy*t.B/2, ny=t.ux*t.B/2;
    const P=[{x:t.a.x+nx,y:t.a.y+ny},{x:t.b.x+nx,y:t.b.y+ny},
             {x:t.b.x-nx,y:t.b.y-ny},{x:t.a.x-nx,y:t.a.y-ny}];
    ctx.beginPath(); P.forEach((p,i)=>{const q=W2S(p); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});
    ctx.closePath();
    ctx.fillStyle=(t.ver===false?STR_COL.ko:STR_COL.plinto)+'1E'; ctx.fill();
    ctx.strokeStyle=t.ver===false?STR_COL.ko:STR_COL.plinto;
    ctx.lineWidth=1.3*DPR; ctx.setLineDash([7*DPR,4*DPR]); ctx.stroke(); ctx.setLineDash([]);
    if(u>18){ const q=W2S({x:(t.a.x+t.b.x)/2,y:(t.a.y+t.b.y)/2});
      ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(Math.atan2(-t.uy,t.ux));
      ctx.fillStyle=t.ver===false?STR_COL.ko:STR_COL.plinto;
      ctx.font=`${8*DPR}px 'IBM Plex Mono',monospace`; ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText(t.sig+' '+Math.round(t.B*100)+'×'+Math.round(t.H*100),0,4*DPR);
      ctx.restore(); }
  });
  /* --- architravi: sopra porte e finestre, non due pilastri ai lati --- */
  (ST.architrave||[]).filter(a=>a.liv===liv&&!a.assorbita).forEach(a=>{
    const nx=-a.uy*a.b_/2, ny=a.ux*a.b_/2, hx=a.ux*a.len/2, hy=a.uy*a.len/2;
    const P=[{x:a.x-hx+nx,y:a.y-hy+ny},{x:a.x+hx+nx,y:a.y+hy+ny},
             {x:a.x+hx-nx,y:a.y+hy-ny},{x:a.x-hx-nx,y:a.y-hy-ny}];
    ctx.beginPath(); P.forEach((p,i)=>{const q=W2S(p); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});
    ctx.closePath();
    ctx.strokeStyle=a.ver===false?STR_COL.ko:STR_COL.arch;
    ctx.lineWidth=1.2*DPR; ctx.setLineDash([2.5*DPR,2.5*DPR]); ctx.stroke(); ctx.setLineDash([]);
    if(u>28){ const q=W2S({x:a.x,y:a.y});
      ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(Math.atan2(-a.uy,a.ux));
      ctx.fillStyle=a.ver===false?STR_COL.ko:STR_COL.arch;
      ctx.font=`${7.5*DPR}px 'IBM Plex Mono',monospace`; ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText(a.sig+' '+Math.round(a.b_*100)+'×'+Math.round(a.h*100),0,4*DPR);
      ctx.restore(); }
  });
  ctx.restore();
}
/* --- selezione e modifica in pianta ---------------------------------------
   Ogni elemento può essere spostato, ridimensionato, ruotato o cancellato a mano.
   Chi viene toccato a mano resta com'è: il dimensionamento automatico lo salta e il
   ricalcolo verifica soltanto, senza mai rimettere in ordine la geometria. */
function strHit(w,tol){
  const ST=S.strutt; if(!ST) return null; const liv=strLiv();
  for(const p of ST.pil) if(p.liv===liv&&Math.hypot(p.x-w.x,p.y-w.y)<Math.max(tol,Math.max(p.b,p.h)/2))
    return {type:'pil',obj:p};
  for(const t of ST.trave) if(t.liv===liv&&distSeg(w,t.a,t.b)<Math.max(tol,t.b_/2))
    return {type:'trave',obj:t};
  for(const a of (ST.architrave||[])){ if(a.liv!==liv||a.assorbita) continue;
    const h={x:a.ux*a.len/2,y:a.uy*a.len/2};
    if(distSeg(w,{x:a.x-h.x,y:a.y-h.y},{x:a.x+h.x,y:a.y+h.y})<Math.max(tol,a.b_/2))
      return {type:'arch',obj:a}; }
  return null;
}
/* aggancia ogni trave ai pilastri che ne reggono gli estremi: serve per farla
   seguire quando il pilastro viene spostato */
function legaTravi(ST,liv){
  const P=ST.pil.filter(p=>p.liv===liv);
  ST.trave.filter(t=>t.liv===liv).forEach(t=>{
    if(!t.pa){ const a=P.find(p=>Math.hypot(p.x-t.a.x,p.y-t.a.y)<0.45); if(a) t.pa=a.id; }
    if(!t.pb){ const b=P.find(p=>Math.hypot(p.x-t.b.x,p.y-t.b.y)<0.45); if(b) t.pb=b.id; }
  });
}
/* ---------- indietro e avanti (Ctrl+Z) ----------
   Si fotografa la carpenteria prima di ogni modifica: è la sola parte che si edita a mano,
   e la fotografia è piccola (JSON dei soli elementi). Al ripristino si rifà il calcolo,
   così l'analisi resta coerente con la geometria tornata indietro. */
const UNDO={back:[],fwd:[],max:30};
function strState(){
  return S.strutt?JSON.stringify({t:S.strutt,c:S.strCfg,s:S.strSel,l:S.strLiv}):null;
}
function strMark(){
  const st=strState(); if(!st) return;
  const b=UNDO.back;
  if(b.length&&b[b.length-1]===st) return;          // stato identico: niente da segnare
  b.push(st); if(b.length>UNDO.max) b.shift();
  UNDO.fwd.length=0;                                // una modifica nuova cancella il «avanti»
}
function strApplica(st){
  const o=JSON.parse(st);
  S.strutt=o.t; S.strCfg=o.c; S.strSel=o.s; S.strLiv=o.l;
  STR_AXES=null; SNAP_G=[]; S.strA=null; S.strDrag=null;
  calcStrutture();
}
function strUndo(){
  if(!UNDO.back.length) return false;
  const cur=strState(); if(cur) UNDO.fwd.push(cur);
  strApplica(UNDO.back.pop()); return true;
}
function strRedo(){
  if(!UNDO.fwd.length) return false;
  const cur=strState(); if(cur) UNDO.back.push(cur);
  strApplica(UNDO.fwd.pop()); return true;
}
/* muove un pilastro portandosi dietro travi, plinto e cordoli */
function spostaPil(p,x,y){
  const ST=S.strutt;
  p.x=x; p.y=y; p.man=true;
  ST.trave.forEach(t=>{ if(t.liv!==p.liv) return;
    let m=false;
    if(t.pa===p.id){ t.a={x,y}; m=true; }
    if(t.pb===p.id){ t.b={x,y}; m=true; }
    if(m){ t.len=Math.hypot(t.b.x-t.a.x,t.b.y-t.a.y); t.man=true; }
  });
  ST.plinto.forEach(pl=>{ if(pl.pil===p.id){ pl.x=x; pl.y=y; } });
  (ST.cordolo||[]).forEach(c=>{
    if(Math.hypot(c.a.x-p.x,c.a.y-p.y)<0.5) c.a={x,y};
    if(Math.hypot(c.b.x-p.x,c.b.y-p.y)<0.5) c.b={x,y};
  });
}
/* orientamento automatico: il pilastro si mette lungo il muro che lo ospita */
function angMuro(x,y,maxD){
  let best=null, bd=(maxD==null?0.80:maxD);
  (STR_AXES||[]).forEach(a=>{
    const dx=a.p1.x-a.p0.x, dy=a.p1.y-a.p0.y, L=Math.hypot(dx,dy)||1;
    const t=clmp(((x-a.p0.x)*dx+(y-a.p0.y)*dy)/(L*L),0,1);
    const d=Math.hypot(a.p0.x+dx*t-x, a.p0.y+dy*t-y);
    if(d<bd){ bd=d; best=Math.atan2(dy,dx); }
  });
  return best;
}
function orientaPil(p){
  if(p.angMan) return false;
  const a=angMuro(p.x,p.y);
  if(a==null) return false;
  const n=Math.atan2(Math.sin(a),Math.cos(a));
  if(Math.abs(Math.sin(n-(p.ang||0)))<1e-3) return false;
  p.ang=n; return true;
}
/* ---------- aggancio (snap) ----------
   Tre riferimenti, in ordine di precedenza: un altro pilastro (aggancio pieno),
   l'allineamento con le file di pilastri esistenti, l'asse di un muro portante. */
let STR_AXES=null, SNAP_G=[];
function strSnap(w,escludi){
  SNAP_G=[];
  if(S.strSnap===false) return {x:w.x,y:w.y};
  const ST=S.strutt, liv=strLiv();
  const tol=Math.max(0.10,14*DPR/S.view.sc);
  let x=w.x, y=w.y, gx=null, gy=null;
  const P=ST?ST.pil.filter(p=>p.liv===liv&&p!==escludi):[];
  /* 1. sopra un altro pilastro */
  let vic=null, vd=tol;
  P.forEach(p=>{ const d=Math.hypot(p.x-w.x,p.y-w.y); if(d<vd){ vd=d; vic=p; } });
  if(vic){ SNAP_G.push({t:'pil',x:vic.x,y:vic.y});
    return {x:vic.x,y:vic.y,su:vic}; }
  /* 2. allineamento con le file esistenti */
  P.forEach(p=>{ if(Math.abs(p.x-w.x)<tol && (gx==null||Math.abs(p.x-w.x)<Math.abs(gx-w.x))) gx=p.x;
                 if(Math.abs(p.y-w.y)<tol && (gy==null||Math.abs(p.y-w.y)<Math.abs(gy-w.y))) gy=p.y; });
  /* 3. asse di un muro portante */
  (STR_AXES||[]).forEach(a=>{
    const dx=a.p1.x-a.p0.x, dy=a.p1.y-a.p0.y, L=Math.hypot(dx,dy)||1;
    const t=clmp(((w.x-a.p0.x)*dx+(w.y-a.p0.y)*dy)/(L*L),0,1);
    const px=a.p0.x+dx*t, py=a.p0.y+dy*t;
    if(Math.hypot(px-w.x,py-w.y)>tol) return;
    if(Math.abs(dx)>Math.abs(dy)){ if(gy==null) gy=py; } else { if(gx==null) gx=px; }
  });
  if(gx!=null){ x=gx; SNAP_G.push({t:'v',x:gx}); }
  if(gy!=null){ y=gy; SNAP_G.push({t:'h',y:gy}); }
  return {x,y};
}
function drawSnap(){
  if(!SNAP_G.length) return;
  ctx.save(); ctx.strokeStyle='#F2C24D'; ctx.lineWidth=DPR; ctx.setLineDash([3*DPR,3*DPR]);
  SNAP_G.forEach(g=>{
    ctx.beginPath();
    if(g.t==='v'){ const a=W2S({x:g.x,y:S.bbox.y0-2}), b=W2S({x:g.x,y:S.bbox.y1+2});
      ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); }
    else if(g.t==='h'){ const a=W2S({x:S.bbox.x0-2,y:g.y}), b=W2S({x:S.bbox.x1+2,y:g.y});
      ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); }
    else { const q=W2S(g); ctx.arc(q.x,q.y,9*DPR,0,7); }
    ctx.stroke();
  });
  ctx.setLineDash([]); ctx.restore();
}
function strDown(w){
  const ST=ensureStr(), tol=Math.max(0.15,12*DPR/S.view.sc), liv=strLiv();
  if(!STR_AXES) STR_AXES=structAxes();
  legaTravi(ST,liv);
  if(S.strTool==='addpil'){
    strMark();
    const s=strSnap(w,null);
    const n=ST.pil.filter(p=>p.liv===liv).length+1;
    const p={id:uid(),liv,x:s.x,y:s.y,ang:0,b:+S.strCfg.pilB||0.3,h:+S.strCfg.pilH||0.3,
      sig:'P'+n,N:0,ver:null,man:true};
    orientaPil(p);
    ST.pil.push(p);
    ST.plinto.push({id:uid(),pil:p.id,x:p.x,y:p.y,b:0.9,h:0.9,sp:0.5,N:0,sigma:0,ver:null});
    S.strSel=p.id; SNAP_G=[]; S.strTool='sel';   // il clic dopo seleziona, non aggiunge
    calcStrutture(); render(); return true;
  }
  if(S.strTool==='addtrave'){
    const s=strSnap(w,null);
    if(!S.strA){ S.strA={x:s.x,y:s.y,pil:s.su?s.su.id:null}; SNAP_G=[]; draw(); }
    else { strMark();
      const len=Math.hypot(s.x-S.strA.x,s.y-S.strA.y);
      /* asse proprio: una trave aggiunta a mano non è in continuità con le altre */
      if(len>0.4){
        const t={id:uid(),liv,a:{x:S.strA.x,y:S.strA.y},b:{x:s.x,y:s.y},len,
          b_:+S.strCfg.pilB||0.3,h:clmp(Math.ceil(len/9/0.05)*0.05,0.30,0.80),
          sig:'T'+(ST.trave.filter(x=>x.liv===liv).length+1),ax:'m'+uid(),
          pa:S.strA.pil,pb:s.su?s.su.id:null,suMuro:false,man:true,q:0,M:0,V:0,ver:null};
        ST.trave.push(t); S.strSel=t.id;
      }
      S.strA=null; SNAP_G=[]; S.strTool='sel';
      calcStrutture(); render(); }
    return true;
  }
  if(S.strTool==='del'){ const h=strHit(w,tol);
    if(h){ strMark();
      if(h.type==='pil'){ ST.pil=ST.pil.filter(p=>p!==h.obj);
        ST.plinto=ST.plinto.filter(pl=>pl.pil!==h.obj.id);
        ST.trave.forEach(t=>{ if(t.pa===h.obj.id) t.pa=null; if(t.pb===h.obj.id) t.pb=null; }); }
      else if(h.type==='trave') ST.trave=ST.trave.filter(t=>t!==h.obj);
      else ST.architrave=ST.architrave.filter(a=>a!==h.obj);
      if(S.strSel===h.obj.id) S.strSel=null;
      calcStrutture(); render(); }
    return true; }
  const h=strHit(w,tol);
  if(h){ S.strSel=h.obj.id;
    if(h.type==='pil'&&S.strTool==='sel'){ strMark(); S.strDrag=h.obj; }
    render(); return true; }
  S.strSel=null; render(); return false;
}
function strMove(w){
  if(!S.strDrag) return;
  const s=strSnap(w,S.strDrag);
  spostaPil(S.strDrag,s.x,s.y);
  orientaPil(S.strDrag);
  draw();
}
function strUp(){
  if(!S.strDrag) return;
  SNAP_G=[]; S.strDrag=null;
  calcStrutture(); render();
}

/* ---------- modelli 3D della struttura ---------- */
function buildStrutture3D(levels){
  const ST=S.strutt; if(!ST||!MOD3D.model) return;
  if(S.m3d.str==='off') return;
  const clip=MOD3D.clip;
  const mCa=new THREE.MeshStandardMaterial({color:new THREE.Color('#B9BFC6'),roughness:.9,
    metalness:0,clippingPlanes:[clip]});
  const mKo=new THREE.MeshStandardMaterial({color:new THREE.Color('#E2574C'),roughness:.8,
    emissive:new THREE.Color('#E2574C'),emissiveIntensity:0.25,clippingPlanes:[clip]});
  const mSol=new THREE.MeshStandardMaterial({color:new THREE.Color('#8A939C'),roughness:.95,
    transparent:true,opacity:0.85,clippingPlanes:[clip]});
  const grp=of=>lvPart(of,'str');
  levels.forEach(L=>{
    const lg=grp(L.id), H=Math.max(0.4,L.h);
    /* pilastri: dal piano fino all'intradosso delle travi */
    ST.pil.filter(p=>p.liv===L.id).forEach(p=>{
      const hT=0.5, hp=Math.max(0.3,H-hT);
      const m=new THREE.Mesh(new THREE.BoxGeometry(p.b,hp,p.h),p.ver===false?mKo:mCa);
      m.position.set(p.x,L.quota+hp/2,-p.y); m.rotation.y=-(p.ang||0); lg.add(m);
    });
    /* travi: sotto il solaio, orientate lungo il proprio asse */
    ST.trave.filter(t=>t.liv===L.id).forEach(t=>{
      const len=Math.hypot(t.b.x-t.a.x,t.b.y-t.a.y)||0.1;
      const m=new THREE.Mesh(new THREE.BoxGeometry(len,t.h,t.b_),t.ver===false?mKo:mCa);
      m.position.set((t.a.x+t.b.x)/2, L.quota+H-t.h/2, -(t.a.y+t.b.y)/2);
      m.rotation.y=Math.atan2(-(t.b.y-t.a.y),(t.b.x-t.a.x)); lg.add(m);
    });
    /* architravi: sopra ogni apertura, alla quota della testa */
    (ST.architrave||[]).filter(a=>a.liv===L.id&&!a.assorbita).forEach(a=>{
      const m=new THREE.Mesh(new THREE.BoxGeometry(a.len,a.h,a.b_),a.ver===false?mKo:mCa);
      m.position.set(a.x, L.quota+a.z+a.h/2, -a.y);
      m.rotation.y=Math.atan2(-a.uy,a.ux); lg.add(m);
    });
    /* solai: piastra all'estradosso del livello */
    ST.solaio.filter(s=>s.liv===L.id).forEach(s=>{
      const w=s.bb.x1-s.bb.x0, d=s.bb.y1-s.bb.y0;
      if(w<=0||d<=0) return;
      const m=new THREE.Mesh(new THREE.BoxGeometry(w,s.h,d),mSol);
      m.position.set((s.bb.x0+s.bb.x1)/2, L.quota+H-s.h/2, -(s.bb.y0+s.bb.y1)/2); lg.add(m);
    });
  });
  /* plinti e cordoli di collegamento sotto il livello più basso */
  const L0=levels[0]; if(L0){ const lg=grp(L0.id);
    ST.plinto.forEach(pl=>{
      const m=new THREE.Mesh(new THREE.BoxGeometry(pl.b,pl.sp,pl.h),pl.ver===false?mKo:mCa);
      m.position.set(pl.x,L0.quota-0.15-pl.sp/2,-pl.y); lg.add(m); });
    (ST.strisce||[]).forEach(t=>{
      const len=Math.hypot(t.b.x-t.a.x,t.b.y-t.a.y)||0.1;
      const g=new THREE.Group();
      const su=new THREE.Mesh(new THREE.BoxGeometry(len,t.hSuola,t.B),t.ver===false?mKo:mCa);
      su.position.y=-t.H+t.hSuola/2; g.add(su);
      const an=new THREE.Mesh(new THREE.BoxGeometry(len,t.H-t.hSuola,t.bAn),t.ver===false?mKo:mCa);
      an.position.y=-(t.H-t.hSuola)/2; g.add(an);
      g.position.set((t.a.x+t.b.x)/2, L0.quota-0.15, -(t.a.y+t.b.y)/2);
      g.rotation.y=Math.atan2(-(t.b.y-t.a.y),(t.b.x-t.a.x)); lg.add(g); });
    if(ST.platea){ const b=S.bbox;
      const m=new THREE.Mesh(new THREE.BoxGeometry(b.w,ST.platea.sp,b.h),
        ST.platea.ver===false?mKo:mCa);
      m.position.set((b.x0+b.x1)/2, L0.quota-0.15-ST.platea.sp/2, -(b.y0+b.y1)/2); lg.add(m); }
    (ST.cordolo||[]).forEach(c=>{
      const len=Math.hypot(c.b.x-c.a.x,c.b.y-c.a.y)||0.1;
      const m=new THREE.Mesh(new THREE.BoxGeometry(len,c.h,c.b_),c.ver===false?mKo:mCa);
      m.position.set((c.a.x+c.b.x)/2, L0.quota-0.15-c.h/2, -(c.a.y+c.b.y)/2);
      m.rotation.y=Math.atan2(-(c.b.y-c.a.y),(c.b.x-c.a.x)); lg.add(m); });
  }
}

/* ---------- pannello ---------- */
function strTotali(){
  const ST=S.strutt; if(!ST) return null;
  let vPil=0,vTrave=0,vPlinto=0,aSol=0,kg=0;
  const L=strLevels(), RHO_ACC=7850;
  const aBar=phi=>Math.PI*phi*phi/400/1e4;                  // area di una barra (m²), ø in mm
  ST.pil.forEach(p=>{ const lv=L.find(x=>x.id===p.liv)||L[0];
    const h=Math.max(0.4,(lv?lv.h:3)-0.5);
    vPil+=p.b*p.h*h; kg+=(p.As||0)/1e4*h*RHO_ACC;
    /* staffe ø8/15 sul fusto */
    const per=2*Math.max(0.05,p.b-0.06)+2*Math.max(0.05,p.h-0.06);
    kg+=Math.ceil(h/0.15)*per*aBar(8)*RHO_ACC; });
  ST.trave.forEach(t=>{ vTrave+=t.b_*t.h*t.len;
    kg+=(t.As||0)/1e4*t.len*RHO_ACC*2;                      // armatura inferiore e superiore
    const ta=t.taglio||{}, per=2*Math.max(0.05,t.b_-0.06)+2*Math.max(0.05,t.h-0.06);
    kg+=Math.ceil(t.len/(ta.passo||0.20))*per*aBar(ta.phi||8)*RHO_ACC; });
  const kgElev=kg;
  let kgFond=0, vCord=0;
  let vArch=0;
  (ST.architrave||[]).forEach(a=>{ if(a.assorbita) return;
    vArch+=a.b_*a.h*a.len;
    kg+=(a.barre?a.barre.tot:0)/1e4*a.len*RHO_ACC*2;
    const per=2*Math.max(0.05,a.b_-0.06)+2*Math.max(0.05,a.h-0.06);
    kg+=Math.ceil(a.len/0.15)*per*aBar(6)*RHO_ACC; });
  vTrave+=vArch;
  ST.plinto.forEach(p=>{ vPlinto+=p.b*p.h*p.sp;
    /* rete inferiore nelle due direzioni */
    kgFond+=(p.As||0)/1e4*p.b*p.b*2*RHO_ACC; });
  (ST.strisce||[]).forEach(t=>{ vPlinto+=t.vol||0; kgFond+=t.kg||0; });
  if(ST.platea){ vPlinto+=ST.platea.vol||0; kgFond+=ST.platea.kg||0; }
  (ST.cordolo||[]).forEach(c=>{ vCord+=c.b_*c.h*c.len;
    kgFond+=(c.barre?c.barre.tot:0)/1e4*2*c.len*RHO_ACC;
    const per=2*Math.max(0.05,c.b_-0.06)+2*Math.max(0.05,c.h-0.06);
    kgFond+=Math.ceil(c.len/0.20)*per*aBar(8)*RHO_ACC; });
  vPlinto+=vCord;
  kg+=kgFond;
  ST.solaio.forEach(s=>{ aSol+=s.area; });
  const ko=ST.trave.filter(t=>t.ver===false).length+ST.pil.filter(p=>p.ver===false).length
          +ST.solaio.filter(s=>s.ver===false).length+ST.plinto.filter(p=>p.ver===false).length
          +(ST.cordolo||[]).filter(c=>c.ver===false).length
          +(ST.architrave||[]).filter(a=>a.ver===false).length
          +(ST.strisce||[]).filter(t=>t.ver===false).length
          +((ST.platea&&ST.platea.ver===false)?1:0)
          +((ANA&&ANA.nodi)?ANA.nodi.filter(n=>!n.ok).length:0)
          +((ANA&&ANA.drift)?ANA.drift.filter(d=>!d.ok).length:0);
  return {vPil,vTrave,vPlinto,vCord,vArch,vTot:vPil+vTrave+vPlinto,aSol,kg,kgElev,kgFond,ko,
          vElev:vPil+vTrave, inc:kgElev/Math.max(0.01,vPil+vTrave)};
}
/* diagramma dello spettro di risposta, disegnato inline in SVG */
function spettroSVG(A){
  const W=300,H=110,mL=34,mB=18,mT=6,mR=6;
  const P=A.SP.SLV, Pd=A.SP.SLD;
  const Tmax=Math.max(2.2,P.TD*1.1);
  let ymax=P.ag*P.S*P.F0*1.05;
  const X=t=>mL+(W-mL-mR)*t/Tmax, Y=v=>mT+(H-mT-mB)*(1-clmp(v/ymax,0,1));
  const curva=(fn,n)=>{ let d='';
    for(let i=0;i<=n;i++){ const t=Tmax*i/n, v=fn(t);
      d+=(i?'L':'M')+nf(X(t),1)+' '+nf(Y(v),1); }
    return d; };
  const el=curva(t=>spettro(P,t,1),120);
  const de=curva(t=>spettro(P,t,A.q),120);
  const sd=curva(t=>spettro(Pd,t,1),120);
  const tick=v=>`<line x1="${mL}" y1="${nf(Y(v),1)}" x2="${W-mR}" y2="${nf(Y(v),1)}" stroke="#2A3038"/>
    <text x="${mL-4}" y="${nf(Y(v)+3,1)}" text-anchor="end" fill="#6E7A86" font-size="8">${nf(v,2)}</text>`;
  const mark=(T,col,lab)=>`<line x1="${nf(X(T),1)}" y1="${mT}" x2="${nf(X(T),1)}" y2="${H-mB}"
     stroke="${col}" stroke-dasharray="2 2"/>
    <text x="${nf(X(T)+2,1)}" y="${mT+8}" fill="${col}" font-size="8">${lab}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
   <rect x="${mL}" y="${mT}" width="${W-mL-mR}" height="${H-mT-mB}" fill="#12161A" stroke="#2A3038"/>
   ${tick(ymax*0.5)}${tick(ymax*0.999)}
   <path d="${el}" fill="none" stroke="#6E7A86" stroke-width="1"/>
   <path d="${sd}" fill="none" stroke="#8FB48A" stroke-width="1.2"/>
   <path d="${de}" fill="none" stroke="#F2A03D" stroke-width="1.6"/>
   ${mark(A.Tx,'#8FB4E5','T₁ₓ')}${A.Ty>A.Tx*1.08||A.Ty<A.Tx*0.92?mark(A.Ty,'#8FB4E5','T₁ᵧ'):''}
   <text x="${mL}" y="${H-6}" fill="#6E7A86" font-size="8">0</text>
   <text x="${W-mR}" y="${H-6}" text-anchor="end" fill="#6E7A86" font-size="8">${nf(Tmax,1)} s</text>
   <text x="${mL+3}" y="${H-mB-4}" fill="#6E7A86" font-size="8">S in g</text></svg>
   <div class="pd" style="margin-top:2px"><span style="color:#6E7A86">▬</span> elastico SLV ·
   <span style="color:#F2A03D">▬</span> di progetto (q=${nf(A.q,2)}) ·
   <span style="color:#8FB48A">▬</span> SLD</div>`;
}

    <tr><td>S<sub>S</sub> · S<sub>T</sub> = S</td><td class="n">${nf(P.Ss,2)} · ${nf(P.St,2)} = ${nf(P.S,3)}</td></tr>
    <tr><td>T<sub>B</sub> · T<sub>C</sub> · T<sub>D</sub></td><td class="n">${nf(P.TB,3)} · ${nf(P.TC,3)} · ${nf(P.TD,2)} s</td></tr>

/* ---------- modifica manuale di un elemento ----------
   Quello che si tocca a mano resta com'è: 'man' lo esclude dal dimensionamento automatico.
   L'orientamento ha il suo flag ('angMan'), così ruotare un pilastro non ne congela la sezione. */
function strEdit(o,k,v){
  if(!o||!isFinite(v)) return false;
  strMark();
  if(k==='angDeg'){ o.ang=v*Math.PI/180; o.angMan=true; }
  else if(k==='x'||k==='y'){ legaTravi(S.strutt,o.liv);
    spostaPil(o, k==='x'?v:o.x, k==='y'?v:o.y); }
  else { o[k]=v; o.man=true; }
  calcStrutture(); return true;
}
function strBtn(o,b){
  if(!o) return false;
  strMark();
  if(b==='sblocca'){
    o.man=false; o.angMan=false;
    if(S.strCfg.autoDim!==false){ dimensionaAuto(); return true; }
  }
  else if(b==='rot90'){ o.ang=(o.ang||0)+Math.PI/2; o.angMan=true; }
  else if(b==='autoang'){ o.angMan=false; orientaPil(o); }
  else return false;
  calcStrutture(); return true;
}
function strVerHTML(liv){

  const ko=[].concat(

    ST.pil.filter(p=>p.liv===liv&&p.ver===false).map(p=>[p.sig,p.nota||'non verificato']),
    ST.solaio.filter(s=>s.liv===liv&&s.ver===false).map(s=>['Solaio vano '+s.room,s.nota||'non verificato']),
    ST.plinto.filter(p=>p.ver===false).map(p=>{ const q=ST.pil.find(x=>x.id===p.pil);
      return ['Plinto '+(q?q.sig:''),p.nota||'tensione sul terreno eccessiva']; }),
    (ST.cordolo||[]).filter(c=>c.ver===false).map(c=>['Cordolo '+c.sig,c.nota]),
    (ST.architrave||[]).filter(a=>a.ver===false).map(a=>['Architrave '+a.sig,a.nota]),
    (ST.strisce||[]).filter(t=>t.ver===false).map(t=>['Trave rovescia '+t.sig,t.nota]),
    (ST.platea&&ST.platea.ver===false)?[['Platea',ST.platea.nota]]:[],
    (A&&A.nodi?A.nodi.filter(n=>!n.ok):[]).map(n=>['Nodo '+n.pil,n.nota]),
    (A&&A.drift?A.drift.filter(d=>!d.ok):[]).map(d=>{ const L=S.livelli.find(l=>l.id===d.liv);
      return ['Interpiano '+(L?L.nome:''),
        d.dr>d.lim?'spostamento '+nf(d.dr,1)+' mm > '+nf(d.lim,1)+' mm'
                  :'θ = '+nf(d.theta,2)+' oltre 0,30']; }));
  if(!ko.length) return `<div class="kv" style="color:#8FB48A"><span>Tutte le verifiche</span><b>superate</b></div>`;
  return `<table><thead><tr><th>Elemento</th><th>Problema</th></tr></thead><tbody>

    </tbody></table>${ko.length>20?`<p class="pd">…e altri ${ko.length-20}.</p>`:''}`;
}
function bindStr(){
  on('[data-strc]','change',e=>{ const el=e.target, k=el.dataset.strc;
    let v;
    if(el.type==='checkbox') v=el.checked;
    else if(el.type==='number') v=(el.value===''?null:+el.value);
    else v=el.value;
    strMark();
    S.strCfg[k]=v;
    /* si ricalcola soltanto: le posizioni e le sezioni restano quelle che sono.
       Per ridimensionare c'è il pulsante apposito. */
    if(S.strutt) calcStrutture();
    render(); });
  on('[data-strtool]','click',e=>{ S.strTool=e.currentTarget.dataset.strtool; S.strA=null; render(); });
  on('[data-stre]','change',e=>{ if(strEdit(strObj(),e.target.dataset.stre,+e.target.value)) render(); });
  on('[data-strb]','click',e=>{ if(strBtn(strObj(),e.currentTarget.dataset.strb)) render(); });
  const g=$('#bGenStr'); if(g) g.onclick=()=>{ strMark(); genStrutture(); render(); };
  const bu=$('#bUndo'); if(bu) bu.onclick=()=>{ if(strUndo()) render(); };
  const br=$('#bRedo'); if(br) br.onclick=()=>{ if(strRedo()) render(); };
  const ed=$('#eDxf'); if(ed) ed.onclick=expCarpDXF;
  const ls=$('#strLivSel'); if(ls) ls.onchange=()=>{ S.strLiv=ls.value; render(); };
  const ex=$('#eStr'); if(ex) ex.onclick=expStrutture;
  const pr=$('#pStr'); if(pr) pr.onclick=stampaRelazione;
}
/* ---------- esportazione del disegno di carpenteria ----------
   DXF R12: è il formato che qualunque CAD apre senza discutere. Un layer per categoria
   e per livello, gli elementi come polilinee chiuse più il testo di sigla e sezione.
   La pianta di partenza va sotto, su un layer suo, per poterla sovrapporre. */
function dxfLayName(s){
  return String(s||'').toUpperCase().replace(/[^A-Z0-9_]+/g,'_').replace(/^_+|_+$/g,'').slice(0,28)||'X';
}
function expCarpDXF(){
  const ST=S.strutt; if(!ST) return;
  const lay=[], ent=[];
  const useLay=(n,c)=>{ if(!lay.some(l=>l.n===n)) lay.push({n,c}); return n; };
  const n3=v=>(Math.round((+v||0)*1e4)/1e4).toFixed(4);
  const poly=(l,pts,cl)=>ent.push({k:'p',l,pts,cl:cl!==false});
  const line=(l,a,b)=>ent.push({k:'l',l,a,b});
  const text=(l,p,t,h,rot)=>ent.push({k:'t',l,p,t,h:h||0.12,rot:rot||0});
  /* rettangolo attorno a un asse (travi, cordoli, architravi) */
  const rettAsse=(a,b,w)=>{ const L=Math.hypot(b.x-a.x,b.y-a.y)||1;
    const ux=(b.x-a.x)/L, uy=(b.y-a.y)/L, nx=-uy*w/2, ny=ux*w/2;
    return [{x:a.x+nx,y:a.y+ny},{x:b.x+nx,y:b.y+ny},{x:b.x-nx,y:b.y-ny},{x:a.x-nx,y:a.y-ny}]; };
  /* rettangolo attorno a un centro, ruotato (pilastri) */
  const rettCentro=(x,y,b,h,ang)=>{ const c=Math.cos(ang||0), sn=Math.sin(ang||0);
    return [[-b/2,-h/2],[b/2,-h/2],[b/2,h/2],[-b/2,h/2]]
      .map(v=>({x:x+v[0]*c-v[1]*sn, y:y+v[0]*sn+v[1]*c})); };
  const sez=(a,b)=>Math.round(a*100)+'x'+Math.round(b*100);

  /* --- la pianta, sotto a tutto --- */
  const LP=useLay('PIANTA',8);
  S.polys.forEach(p=>{ if(p.pts.length>1) poly(LP,p.pts,p.closed); });

  /* --- un gruppo di layer per livello ---
     La sigla del livello va tenuta corta: 'CARP_' + sigla + '_ARCHITRAVI' deve stare
     nei 31 caratteri che il DXF concede a un nome di layer. */
  const sigle=[];
  strLevels().forEach((L,i)=>{
    let q=dxfLayName(L.nome).slice(0,12)||('L'+(i+1));
    if(sigle.indexOf(q)>=0) q=q.slice(0,10)+'_'+(i+1);      // due livelli con lo stesso nome
    sigle.push(q);
    const lPil=useLay('CARP_'+q+'_PILASTRI',30), lTra=useLay('CARP_'+q+'_TRAVI',5),
          lSol=useLay('CARP_'+q+'_SOLAI',8),     lArc=useLay('CARP_'+q+'_ARCHITRAVI',6),
          lTxt=useLay('CARP_'+q+'_TESTI',7);
    ST.solaio.filter(o=>o.liv===L.id).forEach(o=>{
      const bb=o.bb;
      poly(lSol,[{x:bb.x0,y:bb.y0},{x:bb.x1,y:bb.y0},{x:bb.x1,y:bb.y1},{x:bb.x0,y:bb.y1}],true);
      /* freccia dell'orditura, nel verso della luce */
      const cx=(bb.x0+bb.x1)/2, cy=(bb.y0+bb.y1)/2;
      const a=o.dir==='x'?{x:bb.x0+0.2,y:cy}:{x:cx,y:bb.y0+0.2};
      const b=o.dir==='x'?{x:bb.x1-0.2,y:cy}:{x:cx,y:bb.y1-0.2};
      line(lSol,a,b);
      const ux=(b.x-a.x), uy=(b.y-a.y), Lf=Math.hypot(ux,uy)||1, f=0.18/Lf;
      [[a,1],[b,-1]].forEach(v=>{ const p=v[0], sg=v[1];
        line(lSol,p,{x:p.x+sg*(ux*f)-uy*f*0.5, y:p.y+sg*(uy*f)+ux*f*0.5});
        line(lSol,p,{x:p.x+sg*(ux*f)+uy*f*0.5, y:p.y+sg*(uy*f)-ux*f*0.5}); });
      const rm=S.rooms.find(r=>r.lab===o.room);
      text(lTxt,{x:cx,y:cy},'S'+Math.round(o.h*100)+' L'+nf(o.luce,2)+(rm?' '+rm.nome:''),0.11,0);
    });
    ST.trave.filter(o=>o.liv===L.id).forEach(o=>{
      poly(lTra,rettAsse(o.a,o.b,o.b_),true);
      const rot=Math.atan2(o.b.y-o.a.y,o.b.x-o.a.x);
      text(lTxt,{x:(o.a.x+o.b.x)/2,y:(o.a.y+o.b.y)/2+o.b_*0.6},
        o.sig+' '+sez(o.b_,o.h),0.12,Math.abs(rot)>Math.PI/2?rot+Math.PI:rot);
    });
    ST.pil.filter(o=>o.liv===L.id).forEach(o=>{
      const r=rettCentro(o.x,o.y,o.b,o.h,o.ang||0);
      poly(lPil,r,true);
      line(lPil,r[0],r[2]); line(lPil,r[1],r[3]);         // le diagonali della sezione piena
      text(lTxt,{x:o.x+o.b/2+0.06,y:o.y+o.h/2+0.06},o.sig+' '+sez(o.b,o.h),0.12,0);
    });
    (ST.architrave||[]).filter(o=>o.liv===L.id&&!o.assorbita).forEach(o=>{
      const h={x:o.ux*o.len/2,y:o.uy*o.len/2};
      poly(lArc,rettAsse({x:o.x-h.x,y:o.y-h.y},{x:o.x+h.x,y:o.y+h.y},o.b_),true);
      const rot=Math.atan2(o.uy,o.ux);
      text(lTxt,{x:o.x,y:o.y},o.sig+' '+sez(o.b_,o.h),0.10,Math.abs(rot)>Math.PI/2?rot+Math.PI:rot);
    });
  });

  /* --- fondazioni: stanno tutte al piano di posa --- */
  const lFon=useLay('FONDAZIONI',3), lFtx=useLay('FONDAZIONI_TESTI',7);
  ST.plinto.forEach(o=>{
    poly(lFon,rettCentro(o.x,o.y,o.b,o.h,0),true);
    const p=ST.pil.find(x=>x.id===o.pil);
    text(lFtx,{x:o.x-o.b/2,y:o.y-o.h/2-0.16},
      (p?p.sig:'')+' '+sez(o.b,o.h)+' sp'+Math.round(o.sp*100),0.11,0);
  });
  (ST.cordolo||[]).forEach(o=>poly(lFon,rettAsse(o.a,o.b,o.b_),true));
  (ST.strisce||[]).forEach(o=>{
    poly(lFon,rettAsse(o.a,o.b,o.B),true);
    poly(lFon,rettAsse(o.a,o.b,o.bAn),true);
    const rot=Math.atan2(o.b.y-o.a.y,o.b.x-o.a.x);
    text(lFtx,{x:(o.a.x+o.b.x)/2,y:(o.a.y+o.b.y)/2},o.sig+' '+sez(o.B,o.H),0.12,
      Math.abs(rot)>Math.PI/2?rot+Math.PI:rot);
  });
  if(ST.platea){ const b=S.bbox;
    poly(lFon,[{x:b.x0,y:b.y0},{x:b.x1,y:b.y0},{x:b.x1,y:b.y1},{x:b.x0,y:b.y1}],true);
    text(lFtx,{x:b.x0+0.2,y:b.y1-0.3},'PLATEA sp '+Math.round(ST.platea.sp*100)+' cm',0.16,0);
  }
  /* --- testata --- */
  const lInt=useLay('TESTATA',7);
  const C=S.strCfg;
  text(lInt,{x:S.bbox.x0,y:S.bbox.y1+0.9},'CARPENTERIA — '+(S.file||'pianta'),0.28,0);
  text(lInt,{x:S.bbox.x0,y:S.bbox.y1+0.5},
    C.cls+' · '+C.acc+' · '+(C.sisma!==false?'NTC 2018 con sisma':'soli carichi verticali')
    +' · '+FOND_TIPI[C.fondTipo||'plinti']+' · '+new Date().toLocaleDateString('it-IT'),0.16,0);

  /* --- scrittura del file --- */
  const O=[], P=(c,v)=>{ O.push(String(c)); O.push(String(v)); };
  P(0,'SECTION'); P(2,'HEADER');
  P(9,'$ACADVER'); P(1,'AC1009');
  P(9,'$INSUNITS'); P(70,6);
  P(9,'$EXTMIN'); P(10,n3(S.bbox.x0-1)); P(20,n3(S.bbox.y0-1)); P(30,'0.0');
  P(9,'$EXTMAX'); P(10,n3(S.bbox.x1+1)); P(20,n3(S.bbox.y1+2)); P(30,'0.0');
  P(0,'ENDSEC');
  P(0,'SECTION'); P(2,'TABLES'); P(0,'TABLE'); P(2,'LAYER'); P(70,lay.length);
  lay.forEach(l=>{ P(0,'LAYER'); P(2,l.n); P(70,0); P(62,l.c); P(6,'CONTINUOUS'); });
  P(0,'ENDTAB'); P(0,'ENDSEC');
  P(0,'SECTION'); P(2,'ENTITIES');
  ent.forEach(e=>{
    if(e.k==='l'){ P(0,'LINE'); P(8,e.l);
      P(10,n3(e.a.x)); P(20,n3(e.a.y)); P(30,'0.0');
      P(11,n3(e.b.x)); P(21,n3(e.b.y)); P(31,'0.0'); }
    else if(e.k==='p'){ P(0,'POLYLINE'); P(8,e.l); P(66,1); P(70,e.cl?1:0);
      P(10,'0.0'); P(20,'0.0'); P(30,'0.0');
      e.pts.forEach(p=>{ P(0,'VERTEX'); P(8,e.l);
        P(10,n3(p.x)); P(20,n3(p.y)); P(30,'0.0'); });
      P(0,'SEQEND'); P(8,e.l); }
    else { P(0,'TEXT'); P(8,e.l);
      P(10,n3(e.p.x)); P(20,n3(e.p.y)); P(30,'0.0'); P(40,n3(e.h));
      P(1,String(e.t).replace(/[\r\n]+/g,' '));
      if(e.rot) P(50,(e.rot*180/Math.PI).toFixed(2)); }
  });
  P(0,'ENDSEC'); P(0,'EOF');
  dl('carpenteria-modulo.dxf',O.join('\r\n'),'application/dxf',true);
}

   di stampa del browser, che sa salvare in PDF. Tutto resta sul dispositivo. */
function tabPDF(cap,head,rows){
  if(!rows.length) return '';
  return `<h3>${esc(cap)}</h3><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
   <tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?' class="n"':''}>${c==null?'':c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

/* ==================== ABACO SUPERFICI ==================== */
function openArea(f){ const w=f.lb||infW(f), hh=infH(f); return {w, h:hh, a:w*hh}; }
function abacoRoom(rm){
  const h=hNetta(rm), area=rm.area;
  const per=(S.labels?compPerimeter(S.labels,S.gw,S.gh,rm.lab,S.px):0);
  const doors=S.infissi.filter(f=>f.kind==='por'&&f.room===rm.lab);
  const wins=S.infissi.filter(f=>f.kind==='fin'&&f.room===rm.lab);
  let fori=0, vetro=0, doorW=0;
  wins.forEach(f=>{const o=openArea(f); fori+=o.a; vetro+=o.a;});
  doors.forEach(f=>{const o=openArea(f); fori+=o.a; doorW+=o.w;});
  const lorde=per*h, nette=Math.max(0,lorde-fori);
  return {area, soffitto:area, per, h, lorde, fori, nette, vetro,
    battiscopa:Math.max(0,per-doorW), tinteg:nette+area, vol:area*h,
    nDoors:doors.length, nWins:wins.length};
}
function detailAbaco(){
  const rm=S.rooms.find(r=>r.id===S.sel); if(!rm) return '';
  const A=abacoRoom(rm);
  return `<div class="sec"><h3>Dettaglio — ${esc(rm.nome)}</h3>
   <div class="kv"><span>Pavimento</span><b>${nf(A.area)} m²</b></div>
   <div class="kv"><span>Soffitto</span><b>${nf(A.soffitto)} m²</b></div>
   <div class="kv"><span>Perimetro</span><b>${nf(A.per)} m</b></div>
   <div class="kv"><span>Altezza netta</span><b>${nf(A.h)} m</b></div>
   <div class="kv"><span>Pareti lorde</span><b>${nf(A.lorde)} m²</b></div>
   <div class="kv"><span>− fori (${A.nDoors} porte, ${A.nWins} finestre)</span><b>${nf(A.fori)} m²</b></div>
   <div class="kv"><span>Pareti nette</span><b style="color:var(--amb)">${nf(A.nette)} m²</b></div>
   <div class="kv"><span>Superficie vetrata</span><b>${nf(A.vetro)} m²</b></div>
   <div class="kv"><span>Battiscopa</span><b>${nf(A.battiscopa)} m</b></div>
   <div class="kv"><span>Tinteggiatura (pareti+soffitto)</span><b>${nf(A.tinteg)} m²</b></div>
   <div class="kv"><span>Volume</span><b>${nf(A.vol)} m³</b></div></div>`;
}
function paneAbaco(){
  if(!S.rooms.length) return head(9,'Servono i vani.')+`<div class="empty">Torna al passo 01 e premi «Rileva i vani».</div>`;
  const rows=S.rooms.map(rm=>({rm,A:abacoRoom(rm)}));
  const T=rows.reduce((a,{A})=>{['area','lorde','fori','nette','vetro','battiscopa','tinteg','vol','per'].forEach(k=>a[k]=(a[k]||0)+A[k]);return a;},{});
  return head(9,'Ogni superficie di ogni vano, da perimetro, altezza netta e aperture. Tocca una riga per il dettaglio. Le pareti nette detraggono porte e finestre.')+
  `<div class="sec"><h3>Per vano</h3>
   <table><thead><tr><th>Vano</th><th>Pav m²</th><th>Par.nette m²</th><th>Vetri m²</th><th>Batti m</th><th>Vol m³</th></tr></thead><tbody>
   ${rows.map(({rm,A})=>`<tr data-ab="${rm.id}"${S.sel===rm.id?' class="sel"':''}><td>${esc(rm.nome)}</td>
     <td class="n">${nf(A.area)}</td><td class="n">${nf(A.nette)}</td><td class="n">${nf(A.vetro)}</td>
     <td class="n">${nf(A.battiscopa)}</td><td class="n">${nf(A.vol)}</td></tr>`).join('')}
   <tr><td><b>Totale</b></td><td class="n"><b>${nf(T.area)}</b></td><td class="n"><b>${nf(T.nette)}</b></td>
     <td class="n"><b>${nf(T.vetro)}</b></td><td class="n"><b>${nf(T.battiscopa)}</b></td><td class="n"><b>${nf(T.vol)}</b></td></tr>
   </tbody></table></div>
   ${detailAbaco()}
   <div class="sec"><h3>Superfici aggregate</h3>
    <div class="kv"><span>Pavimenti / soffitti</span><b>${nf(T.area)} m² ciascuno</b></div>
    <div class="kv"><span>Pareti lorde</span><b>${nf(T.lorde)} m²</b></div>
    <div class="kv"><span>Fori (porte + finestre)</span><b>${nf(T.fori)} m²</b></div>
    <div class="kv"><span>Pareti nette</span><b>${nf(T.nette)} m²</b></div>
    <div class="kv"><span>Superfici vetrate</span><b>${nf(T.vetro)} m²</b></div>
    <div class="kv"><span>Tinteggiatura</span><b>${nf(T.tinteg)} m²</b></div>
    <div class="kv"><span>Battiscopa</span><b>${nf(T.battiscopa)} m</b></div></div>
   <div class="sec"><button class="btn w cy" id="eAbaco">Esporta abaco superfici — CSV</button></div>
   <div class="note">Perimetro e superfici derivano dalla discretizzazione a ${nf(S.cfg.px*100,0)} cm: adeguate a computo e predimensionamento, non ad atti con valore legale. Le superfici disperdenti (verso esterno/terreno) richiedono l'adiacenza dei muri e arriveranno collegandosi al modello 3D.</div>`;
}
function expAbaco(){
  const R=[['Vano','Uso','Pavimento m2','Soffitto m2','Perimetro m','H netta m','Pareti lorde m2',
    'Fori m2','Pareti nette m2','Vetrate m2','Battiscopa m','Tinteggiatura m2','Volume m3']];
  S.rooms.forEach(rm=>{const A=abacoRoom(rm), u=(USI[usoOf(rm)]||{}).lbl||'';
    R.push([rm.nome,u,nf(A.area),nf(A.soffitto),nf(A.per),nf(A.h),nf(A.lorde),nf(A.fori),
      nf(A.nette),nf(A.vetro),nf(A.battiscopa),nf(A.tinteg),nf(A.vol)]);});
  dl('abaco-superfici-modulo.csv',csv(R));
}

function demoDXF(){
  const O=[], P=(c,v)=>{ O.push(String(c)); O.push(String(v)); };
  const righe=PIANTA_PROVA.split('\n').filter(r=>r).map(r=>{
    const i=r.indexOf(':'), j=r.indexOf(':',i+1);
    return {nome:r.slice(0,i), col:+r.slice(i+1,j)||7, pols:r.slice(j+1).split('|')}; });
  P(0,'SECTION'); P(2,'TABLES'); P(0,'TABLE'); P(2,'LAYER'); P(70,righe.length);
  righe.forEach(r=>{ P(0,'LAYER'); P(2,r.nome); P(70,0); P(62,r.col); P(6,'CONTINUOUS'); });
  P(0,'ENDTAB'); P(0,'ENDSEC');
  P(0,'SECTION'); P(2,'ENTITIES');
  righe.forEach(r=>r.pols.forEach(sp=>{
    const v=sp.slice(1).split(' ');
    P(0,'LWPOLYLINE'); P(8,r.nome); P(90,v.length); P(70,sp.charAt(0)==='C'?1:0);
    let x=0, y=0;
    v.forEach(pt=>{ const c=pt.split(',');
      x+=+c[0]; y+=+c[1];
      P(10,(x/1000).toFixed(3)); P(20,(y/1000).toFixed(3)); });
  }));
  P(0,'ENDSEC'); P(0,'EOF');
  return O.join('\n');
}
$('#bDemo').onclick=()=>loadDXF(demoDXF(),'pianta-di-prova.dxf');

/* ---------- tastiera ----------
   Esc molla l'attrezzo, Ctrl+Z e Ctrl+Shift+Z (o Ctrl+Y) muovono la carpenteria
   avanti e indietro. Dentro un campo di testo si lascia fare al browser. */
window.addEventListener('keydown',e=>{
  const t=e.target, tag=t&&t.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable)) return;
  if(e.key==='Escape'){
    if(S.strA){ S.strA=null; SNAP_G=[]; render(); }
    else if(S.strTool&&S.strTool!=='sel'){ S.strTool='sel'; render(); }
    return;
  }
  if(!(e.ctrlKey||e.metaKey) || !isStr(S.pane)) return;
  const k=(e.key||'').toLowerCase();
  if(k==='z'&&!e.shiftKey){ if(strUndo()){ e.preventDefault(); render(); } }
  else if(k==='y'||(k==='z'&&e.shiftKey)){ if(strRedo()){ e.preventDefault(); render(); } }
});
